<style>
:root{--ink:#2A2350;--sky:#6EC6FF;--grass:#4CC24A;--grass2:#2E8F34;--dirt:#B9743A;--dirt2:#8F5628;--gold:#FFD23F;--gold2:#F2A900;--pink:#FF6FA8;--lav:#9B8EC4;--cream:#FFFDF2;--soft:#EDE8FA;--sub:#5F5890;--ok:#12803F;--err:#D12B47;--warn:#C26A00;--sun:#FFD23F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;font-size:15px;line-height:1.5}
body{background:linear-gradient(180deg,#5FBBFF 0,#A9DEFF 55%,#E6F6FF 100%) fixed;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;image-rendering:pixelated;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 6' shape-rendering='crispEdges'><g fill='white'><rect x='3' y='0' width='5' height='1'/><rect x='1' y='1' width='10' height='1'/><rect x='0' y='2' width='14' height='3'/><rect x='1' y='5' width='12' height='1'/></g></svg>") 6% 7%/112px 48px no-repeat,
 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 6' shape-rendering='crispEdges'><g fill='white'><rect x='3' y='0' width='5' height='1'/><rect x='1' y='1' width='10' height='1'/><rect x='0' y='2' width='14' height='3'/><rect x='1' y='5' width='12' height='1'/></g></svg>") 92% 24%/84px 36px no-repeat,
 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 6' shape-rendering='crispEdges'><g fill='white'><rect x='3' y='0' width='5' height='1'/><rect x='1' y='1' width='10' height='1'/><rect x='0' y='2' width='14' height='3'/><rect x='1' y='5' width='12' height='1'/></g></svg>") 18% 66%/98px 42px no-repeat;opacity:.9}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
.title{text-align:center;margin:18px 0 8px}
.title small{display:block;font-size:11px;letter-spacing:4px;color:#fff;font-weight:900;text-shadow:0 2px 0 var(--ink)}
.title b{display:block;font-size:32px;font-weight:900;letter-spacing:1px;color:var(--gold);text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 5px 0 var(--ink),0 5px 0 2px var(--ink);line-height:1.2;padding-bottom:6px}
.title span{display:block;font-size:13px;color:#16365e;margin-top:8px;font-weight:800}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:8px;padding:14px;margin:14px 0;box-shadow:0 4px 0 var(--ink)}
.sub{color:var(--sub);font-size:13px}
h2{font-size:18px;margin:4px 0 6px;color:var(--ink)}
label{display:block;font-weight:800;margin:12px 0 5px;font-size:14px;color:var(--ink)}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;padding:12px;border:3px solid var(--ink);border-radius:6px;font:inherit;background:#fff;color:var(--ink);min-height:46px}
input::placeholder,textarea::placeholder{color:#a79fc7}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 4px rgba(255,210,63,.8)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{display:block;width:100%;min-height:50px;border:3px solid var(--ink);border-radius:6px;background:var(--gold);color:var(--ink);font:inherit;font-weight:900;font-size:16px;margin-top:14px;cursor:pointer;box-shadow:inset 3px 3px 0 rgba(255,255,255,.55),inset -3px -3px 0 rgba(0,0,0,.18),0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:inset 3px 3px 0 rgba(255,255,255,.55),inset -3px -3px 0 rgba(0,0,0,.18),0 1px 0 var(--ink)}
.btn:disabled{opacity:.55}
.btn.ghost{background:#fff;box-shadow:0 3px 0 var(--ink)}
.btn.go{background:#6BDB5A}
.btn.small{min-height:46px;font-size:14px;margin-top:10px}
.msg{margin-top:10px;font-size:13px;font-weight:800;line-height:1.5}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}.msg.slow{color:var(--warn)}
.chip{display:inline-block;border-radius:4px;padding:1px 9px;font-size:12px;font-weight:900;color:#fff;border:2px solid var(--ink)}
.pill{display:inline-block;border-radius:4px;padding:1px 8px;font-size:11px;font-weight:900;background:var(--soft);color:var(--ink);border:2px solid var(--ink)}
.pill.opt{background:#FFE7B3}
.pill.team{background:#BDF0D8}
.hud{display:flex;align-items:center;gap:12px}
.av{width:58px;height:58px;border-radius:8px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--soft);flex:none;box-shadow:0 3px 0 var(--ink)}
.hi{flex:1;min-width:0}
.hi b{font-size:17px}
.coin{display:inline-block;font-weight:900;font-size:17px;color:var(--ink);white-space:nowrap;background:var(--gold);border:3px solid var(--ink);border-radius:6px;padding:0 9px;box-shadow:0 2px 0 var(--ink)}
.bar{height:16px;border-radius:4px;background:#fff;border:3px solid var(--ink);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--pink) 0 10px,#ffb3d1 10px 12px);width:0;transition:width .5s}
.banner{display:flex;align-items:center;gap:10px;border-radius:8px;padding:12px;margin:12px 0;font-weight:800;cursor:pointer;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.banner.box{background:#FFF1B8}
.banner.out{background:#FFD0D8}
.back{background:none;border:0;color:#16365e;font:inherit;font-weight:900;min-height:44px;padding:0;cursor:pointer}
.photo{display:flex;align-items:center;gap:10px;margin-top:8px}
.photo .pv{width:64px;height:64px;border-radius:6px;background:var(--soft);border:3px solid var(--ink);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.photo label{margin:0;flex:1}
.photo .pb{display:block;text-align:center;min-height:46px;line-height:40px;border:3px dashed var(--ink);border-radius:6px;color:var(--ink);font-weight:900;cursor:pointer;background:#fff}
.photo input{display:none}
.rule{background:#FFF1B8;border:3px dashed var(--ink);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--ink);margin:10px 0;font-weight:700}
.lock{background:var(--soft);color:var(--sub);border-radius:6px;padding:12px;font-size:13px;margin-top:10px;font-weight:700;border:2px solid var(--ink)}
.rk{display:flex;gap:10px;align-items:flex-start}
.rk .rn{font-size:26px;width:38px;text-align:center;font-weight:900;flex:none}
.rk.mine{background:#FFF0F7;box-shadow:0 4px 0 var(--pink),0 0 0 3px var(--pink)}
.dot{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;border:2px solid var(--ink)}
.mem{font-size:12px;color:var(--sub);margin-top:4px}
.mem span{display:inline-block;margin:0 8px 2px 0;white-space:nowrap}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;gap:6px;background:var(--dirt);background-image:linear-gradient(rgba(0,0,0,.2) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.2) 2px,transparent 2px);background-size:32px 22px;border-top:10px solid var(--grass);box-shadow:0 -3px 0 var(--ink);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#tabs button{flex:1;min-height:50px;border:3px solid transparent;border-radius:6px;background:none;color:#fff;font:inherit;font-weight:900;font-size:12px;cursor:pointer;text-shadow:0 2px 0 var(--ink)}
#tabs button b{display:block;font-size:20px}
#tabs button.on{color:var(--ink);background:var(--gold);border-color:var(--ink);box-shadow:0 3px 0 var(--ink);text-shadow:none}
#modal{position:fixed;inset:0;z-index:20;background:rgba(42,35,80,.62);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .mb{width:100%;max-width:430px;max-height:92vh;overflow:auto;background:var(--cream);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:10px;padding:18px;text-align:center}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.bx{aspect-ratio:1;border-radius:6px;border:3px solid var(--ink);box-shadow:inset 4px 4px 0 rgba(255,255,255,.5),inset -4px -4px 0 rgba(0,0,0,.2),0 3px 0 var(--ink);background:var(--gold);font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:56px;animation:wob 1.6s ease-in-out infinite}
.bx:nth-child(2){animation-delay:.2s}.bx:nth-child(3){animation-delay:.4s}.bx:nth-child(4){animation-delay:.6s}.bx:nth-child(5){animation-delay:.8s}
.bx.pick{background:#6BDB5A;animation:none;transform:scale(1.1)}
.bx.dim{opacity:.55;animation:none;cursor:default}
@keyframes wob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}
.ch{aspect-ratio:1;border-radius:8px;border:3px solid var(--ink);background:#fff;font-size:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:64px;box-shadow:0 3px 0 var(--ink)}
.ch small{font-size:11px;color:var(--sub);font-weight:800}
.ch.on{background:var(--gold);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;background:var(--gold);color:var(--ink);font-weight:900;padding:10px 18px;border-radius:6px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:opacity .3s;max-width:90%;text-align:center}
details{background:var(--cream);border:3px solid var(--ink);border-radius:8px;margin:12px 0;padding:0 14px;box-shadow:0 4px 0 var(--ink)}
summary{min-height:50px;display:flex;align-items:center;font-weight:900;cursor:pointer;color:var(--ink)}
details .gb{padding:0 0 12px;font-size:14px;color:var(--ink)}
details .gb li{margin:5px 0}
footer{text-align:center;color:#16365e;font-size:12px;margin-top:22px;font-weight:700}
footer a{color:var(--ink);font-weight:900}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.cb,.nb{min-height:52px;border-radius:6px;border:3px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.cb:active,.nb:active{background:var(--gold);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pop{animation:popin .25s steps(5)}
.pop h2{font-size:21px;margin:6px 0 8px}
.pop .pb2{font-size:15px;line-height:1.7;color:var(--ink);text-align:center}
.pop .pb2 input{margin-top:6px;text-align:center}
#modal .mb.pop{display:flex;flex-direction:column;overflow:hidden}
#modal .mb.pop .pb2{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px}
#modal .mb.pop h2,#modal .mb.pop .btn,#modal .mb.pop>div:first-child{flex:none}
@keyframes popin{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.te{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
.te .tn{font-weight:900;width:30px;text-align:center;color:var(--ink)}
.te input[type=text]{min-height:42px;padding:8px;flex:1;min-width:80px}
.te select{min-height:42px;padding:8px;width:auto;flex:1;min-width:100px}
.te .lead{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:800;min-height:42px;margin:0}
.te .lead input{width:20px;height:20px}
.hide{display:none!important}
.dl{text-align:left;max-height:42vh;overflow:auto;font-size:14px;line-height:1.6;background:var(--soft);border:3px solid var(--ink);border-radius:6px;padding:10px 12px;margin:8px 0}
.dl div{margin:3px 0}
.shead{display:flex;gap:12px;align-items:center;margin-top:4px}
.shead .sic{width:54px;height:54px;border-radius:6px;border:3px solid var(--ink);background:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none}
.shead b{display:block;font-size:20px;color:var(--ink)}
.shead small{display:block;font-weight:800;color:var(--ink);opacity:.75}

/* ===== 가로 스크롤 지도 (슈퍼마리오 월드맵 느낌) ===== */
.mapwrap{position:relative;border:4px solid var(--ink);border-radius:8px;box-shadow:0 5px 0 var(--ink);margin:14px 0;overflow:hidden;background:#5C94FC}
.mapscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;height:400px}
.mapscroll::-webkit-scrollbar{display:none}
.world{position:relative;width:1780px;height:400px;background:linear-gradient(180deg,#5C94FC 0,#8CC8FF 62%,#C4E9FF 100%)}
.world svg.cl{position:absolute;image-rendering:pixelated}
.world svg.path{position:absolute;left:0;top:0}
.ground{position:absolute;left:0;right:0;bottom:0;height:70px;background-color:var(--dirt);background-image:linear-gradient(rgba(0,0,0,.2) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.2) 2px,transparent 2px);background-size:32px 22px;background-position:0 16px;border-top:4px solid var(--ink)}
.ground::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;background:repeating-linear-gradient(90deg,var(--grass) 0 16px,#3FAE3E 16px 32px);border-bottom:4px solid var(--grass2)}
.bush{position:absolute;bottom:66px;image-rendering:pixelated}
.sign{position:absolute;bottom:80px;transform:translateX(-50%);background:#E6A35A;border:3px solid var(--ink);border-radius:4px;padding:2px 9px;font-size:12px;font-weight:900;color:var(--ink);box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.sign::after{content:'';position:absolute;left:50%;bottom:-11px;width:6px;height:8px;margin-left:-3px;background:var(--ink)}
.mn{position:absolute;width:112px;margin-left:-56px;margin-top:-29px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;z-index:2}
.mn .nd{position:relative;width:58px;height:58px;border-radius:6px;border:3px solid var(--ink);background-color:var(--c);box-shadow:inset 4px 4px 0 rgba(255,255,255,.55),inset -4px -4px 0 rgba(0,0,0,.25),0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-size:28px}
.mn:active .nd{transform:translateY(3px)}
.mn.clear .nd{background-color:#C58B55}
.mn.lock .nd{background-color:#9A97A8}
.mn.lock .nd>span{filter:grayscale(1);opacity:.35}
.mn .lk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:28px;z-index:3}
.mn.clear .nd>span{opacity:.6}
.mn .ck{position:absolute;right:-9px;top:-9px;width:24px;height:24px;border-radius:4px;background:#6BDB5A;color:var(--ink);border:3px solid var(--ink);font-size:13px;font-style:normal;font-weight:900;display:flex;align-items:center;justify-content:center}
.mn .lb{margin-top:8px;background:#fff;border:3px solid var(--ink);border-radius:4px;padding:1px 6px;line-height:1.25;box-shadow:0 2px 0 var(--ink);text-align:center}
.mn .lb b{display:block;font-size:13px;color:var(--ink);white-space:nowrap}
.mn .lb small{display:block;color:var(--sub);font-size:11px;font-weight:800;white-space:nowrap}
.mn.next .nd{animation:bump 1s steps(2) infinite}
.mn.sel .lb{background:var(--gold)}
@keyframes bump{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#hero{position:absolute;width:0;height:0;z-index:4;pointer-events:none;transition:left 1s cubic-bezier(.45,0,.3,1),top 1s cubic-bezier(.45,0,.3,1)}
#hero .hb{position:absolute;left:-26px;top:-84px;width:52px;height:52px;font-size:40px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
#hero .hb.hop{animation:hop 1s ease}
@keyframes hop{0%{transform:translateY(0)}20%{transform:translateY(-34px)}45%{transform:translateY(0)}60%{transform:translateY(-22px)}80%{transform:translateY(0)}90%{transform:translateY(-8px)}100%{transform:translateY(0)}}
#hero .bub{position:absolute;left:30px;top:-100px;white-space:nowrap;padding:3px 7px;text-align:center;background:var(--gold);border:3px solid var(--ink);border-radius:6px;font-size:12px;font-weight:900;color:var(--ink);opacity:0}
#hero .bub.show{animation:bub 1.2s ease}
@keyframes bub{0%{opacity:0;transform:translateY(8px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#say{position:absolute;left:10px;right:10px;top:10px;z-index:6;background:#fff;border:3px solid var(--ink);border-radius:6px;box-shadow:0 4px 0 var(--ink);padding:9px 12px;text-align:center;font-size:14px;font-weight:700;animation:up .25s steps(4)}
@keyframes up{from{transform:translateY(-14px);opacity:0}to{transform:translateY(0);opacity:1}}
.maphint{position:absolute;right:8px;bottom:8px;z-index:5;font-size:11px;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--ink);pointer-events:none}
.ud{position:absolute;margin:-2px 0 0 -4px;width:10px;height:10px;border-radius:50%;background:#FF3B5C;border:2px solid var(--ink)}
#tabs button b{position:relative}
.chat{max-height:52vh;min-height:140px;overflow:auto;padding:4px 2px}
.bub2{max-width:84%;margin:8px 0;padding:8px 11px;border:3px solid var(--ink);border-radius:8px;font-size:14px;white-space:pre-wrap;word-break:break-word;box-shadow:0 3px 0 var(--ink);text-align:left}
.bub2.me{margin-left:auto;background:var(--gold)}
.bub2.you{background:#fff}
.bub2 .bw{display:block;font-size:11px;font-weight:900;color:var(--sub);margin-bottom:2px}
.bub2.me .bw{color:#6b4a00}
.bub2 .bt{display:block;font-size:10px;color:var(--sub);text-align:right;margin-top:2px}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.rchip{min-height:42px;padding:4px 10px;border:3px solid var(--ink);border-radius:6px;background:#fff;font:inherit;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 2px 0 var(--ink);color:var(--ink)}
.rchip.on{background:var(--gold)}
.dlrow{margin:10px 0}
.sbwrap{overflow:auto;border:3px solid var(--ink);border-radius:6px;background:#fff;max-height:62vh;margin:8px 0}
.sbt{border-collapse:collapse;font-size:12px}.sbt th,.sbt td{border:1px solid #cfc8e8;padding:4px 6px;text-align:center;white-space:nowrap}
.sbt th:first-child,.sbt td:first-child{position:sticky;left:0;background:#fff;text-align:left;z-index:1}.sbt thead th{position:sticky;top:0;background:var(--soft);z-index:2}.sbt thead th:first-child{z-index:3}
.sbt .tr td{background:var(--soft);font-weight:800}.sbt .y{color:#1f9d55;font-weight:900}.sbt .m{color:#e5484d;font-weight:900}.sbt .o{color:#b5b0c8}
.gcard{margin:10px 0}.gph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.gph a{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:3px solid var(--ink);border-radius:6px;background:var(--soft);overflow:hidden;text-decoration:none;font-size:22px;color:var(--ink)}.gph img{width:100%;height:100%;object-fit:cover}

/* ===== 통신 ===== */
function jsonp(p,timeout){return new Promise(function(res,rej){
 if(!GAS){rej(new Error('nogas'));return;}
 var cb='cb'+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement('script');
 var t=setTimeout(function(){cl();rej(new Error('timeout'));},timeout||30000);
 function cl(){clearTimeout(t);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
 window[cb]=function(d){cl();res(d);};
 s.onerror=function(){cl();rej(new Error('net'));};
 p.callback=cb;
 s.src=GAS+(GAS.indexOf('?')>-1?'&':'?')+new URLSearchParams(p).toString();
 document.head.appendChild(s);});}
function postJson(payload,timeout){
 if(!GAS)return Promise.reject(new Error('nogas'));
 if(payload&&payload.role==='teacher')payload=Object.assign({},payload,{code:adminCode()});
 var ctl=('AbortController' in window)?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort();},timeout||70000);
 return fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined})
  .then(function(r){clearTimeout(t);return r.json();},function(e){clearTimeout(t);throw e;});}
function slowNote(setter){var t0=Date.now(),iv=setInterval(function(){var s=Math.floor((Date.now()-t0)/1000);if(s>=4)setter('🐢 구글 시트가 느려서 시간이 걸리고 있어요. 조금만 기다려 주세요! ('+s+'초)');},1000);return function(){clearInterval(iv);};}
function idParams(){var u=S.user,p={grade:u.grade,cls:u.cls,no:u.no,name:u.name};if(u.role==='teacher'){p.role='teacher';p.code=adminCode();}return p;}
function applyState(r){
 var u=S.user;
 u.key=r.key;u.team=r.team;u.teamName=r.teamName||'';u.found=r.found;u.teamHasLeader=r.teamHasLeader;u.isLeader=r.isLeader;u.members=r.members;
 if(r.me){S.me.coins=r.me.coins;if(r.me.char){S.me.char=r.me.char;S.me.nick=r.me.nick||S.me.nick;}}
 var d={};(r.done||[]).forEach(function(id){d[id]=true;});S.done=d;
 S.boxes=r.boxes||[];S.deadlines=r.deadlines||{};S.notice=r.notice||null;S.noticeAcked=!!r.noticeAcked;if(r.reviewDone)S.reviewDone=true;else if(r.reviewDone===false)S.reviewDone=false;saveS();setTimeout(checkNotice,0);}
function applyTeam(r){var u=S.user;u.team=r.team;u.teamName=r.teamName||'';u.found=r.found;u.teamHasLeader=r.teamHasLeader;u.isLeader=r.isLeader;u.members=r.members;S.deadlines=r.deadlines||{};S.notice=r.notice||null;S.noticeAcked=!!r.noticeAcked;saveS();setTimeout(checkNotice,0);}

function compress(file){return new Promise(function(res,rej){
 var img=new Image(),u=URL.createObjectURL(file);
 img.onload=function(){var k=Math.min(1,1100/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);
  var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.68));};
 img.onerror=function(){rej(new Error('img'));};img.src=u;});}

 else o.body='당신은 <b>'+esc(tn)+'</b>의 <b>팀원</b>입니다!'+(lead?'<br>팀장: 👑 <b>'+esc(lead.name||'')+'</b>':'')+'<br><br>'+list;

function hudExtra(){var u=S.user;if(u.role==='teacher')return '<button class="btn ghost small" id="tback">👩‍🏫 관리자 화면으로</button><div class="sub" style="margin:8px 0 4px;text-align:center">'+(S.realTest?'🧪 실제 전송 테스트 중 (미션·후기가 시트에 "담임"으로 저장돼요)':'🎬 체험용 미리보기 (시트에는 저장 안 돼요)')+'</div><button class="btn ghost small" id="tpl">💌 편지 → 후기 → 마무리 팝업 순서대로 보기</button><button class="btn ghost small" id="tpr">📝 후기 화면만 보기</button>';return (testOn()?'<div class="card" style="background:#EFE9FF"><b>🧪 테스트 모드</b><div class="sub">장소 잠금이 풀려 있어요. 미션·사진 제출과 후기는 <b>진짜로 전송</b>돼요 (끝나면 담임이 초기화해요).</div><button class="btn ghost small" id="ttrv">📝 후기 작성 테스트 (실제 전송)</button></div>':'')+'<button class="btn ghost small" id="tmy">👥 우리 팀 확인하기</button>'+((u.isLeader&&u.found&&u.team!=='솔로 원정대')?'<button class="btn ghost small" id="trn">✏️ 우리 팀 이름 정하기</button>':'');}
function deadlineOf(sid){var d=S.deadlines||{};return Object.prototype.hasOwnProperty.call(d,sid)?String(d[sid]||''):(DEFAULT_DEADLINES[sid]||'');}
function stageById(id){return STAGES.filter(function(x){return x.id===id;})[0];}
function curPos(){var p=store.get(K_POS,'seoul');return stageById(p)?p:'seoul';}
function roP(w){var c=String(w).charCodeAt(String(w).length-1);if(c<0xAC00||c>0xD7A3)return '로';var j=(c-0xAC00)%28;return (j===0||j===8)?'로':'으로';}
function companionFor(sid){var u=S.user;if(!u||!COMPANION[sid])return null;
 if(u.role==='teacher')return Object.assign({preview:true},COMPANION[sid]);
 if(u.role==='student'&&u.team==='솔로 원정대')return COMPANION[sid];return null;}
function compNote(sid,full){var c=companionFor(sid);if(!c)return '';
 var t='👥 이때는 <b>'+esc(c.team)+'</b>과 같이 움직여요! <span class="sub">(팀장 '+esc(c.who)+')</span>';
 if(full)t+='<br>함께 이동하고 미션도 같이 의논하며 해요. 제출은 내 이름으로 각자 해요.';
 if(c.preview)t+='<br><span class="sub">(미리보기 · 솔로 원정대 학생에게만 보여요)</span>';return t;}
function stageProg(s){
 if(s.none)return {ms:[],dn:0,clear:false,lockedOnly:false,none:true};
 var ms=MISSIONS.filter(function(m){return m.stage===s.id&&!m.hidden&&(m.scope==='me'||canTeam());});
 var dn=ms.filter(function(m){return S.done[m.id];}).length;
 return {ms:ms,dn:dn,clear:ms.length>0&&dn===ms.length,lockedOnly:!ms.length,none:false};}
function cloudSvg(w){return '<svg class="cl" width="'+w+'" height="'+Math.round(w*6/14)+'" viewBox="0 0 14 6" shape-rendering="crispEdges"><g fill="#fff"><rect x="3" y="0" width="5" height="1"/><rect x="1" y="1" width="10" height="1"/><rect x="0" y="2" width="14" height="3"/><rect x="1" y="5" width="12" height="1"/></g></svg>';}
function bushSvg(w){return '<svg class="bush" width="'+w+'" height="'+Math.round(w*6/16)+'" viewBox="0 0 16 6" shape-rendering="crispEdges"><g fill="#3CB043"><rect x="5" y="0" width="6" height="1"/><rect x="2" y="1" width="12" height="1"/><rect x="0" y="2" width="16" height="4"/></g><g fill="#1F7A2A"><rect x="3" y="3" width="1" height="2"/><rect x="8" y="2" width="1" height="3"/><rect x="12" y="3" width="1" height="2"/></g></svg>';}
function mapPath(){
 var d=[],dn=[],h='<svg class="path" width="'+MAP_W+'" height="'+MAP_H+'" viewBox="0 0 '+MAP_W+' '+MAP_H+'">';
 for(var k=0;k<STAGES.length-1;k++){
  var a=STAGES[k],b=STAGES[k+1],dx=(b.x-a.x)*.5;
  d.push('M'+a.x+' '+a.y+' C'+(a.x+dx)+' '+a.y+' '+(b.x-dx)+' '+b.y+' '+b.x+' '+b.y);
  dn.push(a.none||stageProg(a).clear);}
 d.forEach(function(q){h+='<path d="'+q+'" fill="none" stroke="#2A2350" stroke-width="11" stroke-linecap="round" stroke-dasharray="0.1 17"/>';});
 d.forEach(function(q,k){h+='<path d="'+q+'" fill="none" stroke="'+(dn[k]?'#FF6FA8':'#FFD23F')+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 17"/>';});
 return h+'</svg>';}
function dayX(idx){return 90+idx*175;}
function renderMap(){
 var nb=(S.boxes||[]).length,no=Object.keys(outbox).length,pos=curPos(),nextId=null,i;
 for(i=0;i<STAGES.length;i++){var pg=stageProg(STAGES[i]);if(!pg.none&&reqMs(STAGES[i]).length&&!reqDone(STAGES[i])){nextId=STAGES[i].id;break;}}
 var h='<div class="title" style="margin:6px 0 0"><small>EXPEDITION MAP</small><b style="font-size:27px">원정을 떠나봅시다!</b><span>블록을 콕! 눌러서 이동해요 · 옆으로 밀면 지도가 움직여요</span></div>'+noticeBar()+reviewBar()+hud()+hudExtra()+sndBtn();
 if(S.letterSeen)h+='<div class="banner" id="bltr" style="background:#FFF3C4;cursor:pointer">💌 담임 선생님 편지 다시 보기</div>';
 if(nb)h+='<div class="banner box" id="bnb">🎁 아직 안 연 상자가 '+nb+'개 있어요! 눌러서 열기</div>';

 h+='<div class="mapwrap" id="mapwrap"><div id="say" class="hide"></div><div class="maphint">◀ 옆으로 밀기 ▶</div><div class="mapscroll" id="mapscroll"><div class="world" id="world" style="width:'+MAP_W+'px">';
 for(var cx=40,ck=0;cx<MAP_W;cx+=300,ck++){var cw=[70,56,84,60][ck%4],ct=[28,60,26,70][ck%4];h+='<div style="position:absolute;left:'+cx+'px;top:'+ct+'px">'+cloudSvg(cw)+'</div>';}
 h+=mapPath()+'<div class="ground"></div>';
 for(var bx=20,bk=0;bx<MAP_W;bx+=330,bk++){h+='<div style="position:absolute;left:'+bx+'px;bottom:0;width:0;height:0">'+bushSvg([60,80,56,76][bk%4])+'</div>';}
 [[0.5,'DAY 1'],[3.5,'DAY 2'],[8.5,'DAY 3']].forEach(function(d){h+='<div class="sign" style="left:'+dayX(d[0])+'px">'+d[1]+'</div>';});
 STAGES.forEach(function(st){
  var pg=stageProg(st),cp=companionFor(st.id);
  var lk=!!blockerOf(st);
  h+='<button class="mn'+(lk?' lock':'')+(pg.clear?' clear':'')+(st.id===nextId?' next':'')+(st.id===pos?' sel':'')+'" data-s="'+st.id+'" style="left:'+st.x+'px;top:'+st.y+'px;--c:'+st.c+'"><span class="nd"><span>'+st.icon+'</span>'+(lk?'<i class="lk">🔒</i>':'')+(pg.clear?'<i class="ck">✔</i>':'')+'</span><span class="lb"><b>'+esc(st.short)+'</b><small>'+esc(st.reg)+(pg.none?'':' · '+(pg.lockedOnly?'팀 대표':(pg.dn+'/'+pg.ms.length)))+(cp?' 👥':'')+'</small></span></button>';});
 var ps=stageById(pos);
 h+='<div id="hero" style="left:'+ps.x+'px;top:'+ps.y+'px"><span class="bub">뿅~💖</span><div class="hb">'+esc(S.me.char)+'</div></div></div></div></div><div style="height:30px"></div>'+footer();
 $('app').innerHTML=h;
 Array.prototype.forEach.call(document.querySelectorAll('.mn'),function(el){el.onclick=function(){askNode(el.getAttribute('data-s'));};});
 if($('tback'))$('tback').onclick=renderAdmin;
 if($('tmy'))$('tmy').onclick=showMyTeam;
 if($('ttrv'))$('ttrv').onclick=showReview;
 if($('tpl'))$('tpl').onclick=showLetter;if($('tpr'))$('tpr').onclick=showReview;
 if($('trn'))$('trn').onclick=function(){popup({icon:'✏️',title:'우리 팀 이름',body:'<input type="text" id="tnm2" maxlength="10" placeholder="'+esc(dispTeam())+'">',btns:[{t:'저장',pre:function(){var v=$('tnm2');return v?v.value.trim():'';},fn:function(v){if(v)saveTeamName(v);}},{t:'취소',ghost:true}]});};
 if($('bnb'))$('bnb').onclick=function(){openBox(S.boxes[0].id,S.boxes[0].mission);};
 if($('bltr'))$('bltr').onclick=showLetter;if($('brv'))$('brv').onclick=showReview;bindSnd();if($('nack'))$('nack').onclick=doAck;
 if(!S.introSeen&&!S.letterPending){S.introSeen=true;saveS();setTimeout(function(){if(curTab==='map'&&!curStage&&$('modal').classList.contains('hide'))showIntro();},600);}
 if(S.letterPending&&!S.letterSeen){S.letterSeen=true;S.letterPending=false;saveS();setTimeout(function(){if(curTab==='map'&&!curStage&&$('modal').classList.contains('hide'))showLetter();},700);}
 if($('bno'))$('bno').onclick=function(){retryOutbox();};
 scrollMapTo(pos,true);
 traveling=false;
 if(!synced){synced=true;syncState().then(function(){if(curTab==='map'&&!curStage&&$('modal').classList.contains('hide')&&!traveling)renderMap();});}}
var traveling=false;
function scrollMapTo(id,instant){
 var sc=$('mapscroll'),st=stageById(id);if(!sc||!st)return;
 sc.scrollTo({left:Math.max(0,st.x-sc.clientWidth/2),behavior:instant?'auto':'smooth'});}
function moveHero(id,anim){
 var st=stageById(id),h=$('hero');if(!h)return;
 h.style.left=st.x+'px';h.style.top=st.y+'px';
 if(anim){var hb=h.querySelector('.hb'),b=h.querySelector('.bub');
  hb.classList.remove('hop');b.classList.remove('show');void hb.offsetWidth;hb.classList.add('hop');b.classList.add('show');sfx('hop');}}
function say(html,ms){var el=$('say');if(!el)return;el.innerHTML=html;el.classList.remove('hide');clearTimeout(say.t);say.t=setTimeout(function(){el.classList.add('hide');},ms||2200);}
function infoHtml(st){
 var pg=stageProg(st),cn=compNote(st.id,false);
 return '<b>'+esc(st.icon)+' '+esc(st.name)+'</b><br><span class="sub">'+(st.day?'DAY '+st.day+' · ':'')+esc(st.reg)+(pg.none?'':' · '+(pg.lockedOnly?'팀 대표가 제출해요':'미션 '+pg.dn+'/'+pg.ms.length))+(st.sub?' · '+esc(st.sub):'')+'</span>'+(deadlineOf(st.id)?'<br><span class="sub">⏰ '+esc(deadlineOf(st.id))+'</span>':'')+(cn?'<div class="rule">'+cn+'</div>':'');}
function askNode(id){
 if(traveling)return;
 var st=stageById(id),same=(curPos()===id),pg=stageProg(st);
 var blk=blockerOf(st);if(blk){showLockPop(blk);return;}
 if(same){
  if(pg.none){toast('여기는 출발 지점이에요! 다음 블록을 눌러 보세요 🚌',2200);return;}
  popup({icon:S.me.char,title:'미션 수행하러 갈까요?',body:infoHtml(st),btns:[{t:'네! 가자 ▶',fn:function(){go('map',id);}},{t:'아니요',ghost:true}]});return;}
 popup({icon:S.me.char,title:'여기로 이동할까요?',body:infoHtml(st),btns:[{t:'네! 이동 🚀',fn:function(){travel(id);}},{t:'아니요',ghost:true}]});}
function travel(id){
 var st=stageById(id),who=esc(S.me.nick||S.user.name);
 traveling=true;
 var mw=$('mapwrap');if(mw&&mw.scrollIntoView)mw.scrollIntoView({block:'center',behavior:'smooth'});
 say(esc(S.me.char)+' <b>'+who+'</b> 님이 <b>'+esc(st.short)+'</b>'+roP(st.short)+' 이동합니다!',2600);
 setTimeout(function(){
  store.set(K_POS,id);
  Array.prototype.forEach.call(document.querySelectorAll('.mn'),function(x){x.classList.toggle('sel',x.getAttribute('data-s')===id);});
  moveHero(id,true);scrollMapTo(id);
  setTimeout(function(){
   traveling=false;
   if(curTab!=='map'||curStage)return;
   say('🎉 <b>'+esc(st.short)+'</b> 도착!',1800);
   if(!stageProg(st).none)setTimeout(function(){
    if(curTab!=='map'||curStage||!$('modal').classList.contains('hide'))return;
    popup({icon:S.me.char,title:'도착했어요! 🎉',body:infoHtml(st)+'<br><br>지금 미션 수행하러 갈까요?',btns:[{t:'네! 가자 ▶',fn:function(){go('map',id);}},{t:'나중에 할래요',ghost:true}]});},700);
  },1100);
 },1300);}

function renderStage(sid){
 var s=stageById(sid),cn=compNote(sid,true);store.set(K_POS,sid);
 var h='<button class="back" id="bk">‹ 지도로</button><div class="card shead" style="background:'+s.c+'"><span class="sic">'+s.icon+'</span><div><b>'+esc(s.name)+'</b><small>'+(s.day?'DAY '+s.day+' · ':'')+esc(s.reg)+(s.sub?' · '+esc(s.sub):'')+'</small></div></div>'+(deadlineOf(sid)?'<div class="rule" style="font-size:14px">⏰ <b>제출 기한</b> · '+esc(deadlineOf(sid))+'</div>':'')+(cn?'<div class="rule" style="font-size:14px">'+cn+'</div>':'');
 MISSIONS.filter(function(m){return m.stage===sid;}).forEach(function(m){h+=(m.hidden&&!hiddenOpen(m))?hiddenLocked(m):missionCard(m);});
 $('app').innerHTML=h+footer();
 $('bk').onclick=function(){go('map');};
 MISSIONS.filter(function(m){return m.stage===sid;}).forEach(function(m){if(m.hidden&&!hiddenOpen(m))return;if(m.scope==='me'||canTeam())bindMission(m);});}
function hiddenLocked(m){return '<div class="card" id="mc_'+m.id+'" style="text-align:center;background:var(--soft)"><div style="font-size:40px">🔒</div><b style="font-size:16px">히든 미션</b><div class="sub">이 장소의 첫 미션을 끝내면 열려요! (이 장소 안에서 꼭 수행해야 해요) 뭘까요? 🤫</div></div>';}

function missionCard(m){
 var u=S.user;
 var h='<div class="card" id="mc_'+m.id+'"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:16px">'+esc(m.title)+'</b><span>'+(m.scope==='team'?'<span class="pill team">팀 미션</span> ':'')+(m.opt?'<span class="pill opt">선택</span>':'')+(m.hidden?'<span class="pill opt">🎁 히든</span>':'')+'</span></div><div class="sub">'+esc(m.desc)+'</div>';
 if(m.scope==='team'&&!canTeam()){
  var ld=(u.members||[]).filter(function(x){return x.leader;}).map(function(x){return x.name;}).join(', ');
  return h+'<div class="lock">🔒 팀 대표('+esc(ld||'팀장')+')가 제출하는 미션이에요.'+(S.done[m.id]?' ✅ 제출 완료!':'')+'</div></div>';}
 if(m.rule)h+='<div class="rule">'+esc(m.rule).replace(/\n/g,'<br>')+'</div>';
 var a=Object.assign({},S.answers[m.id]||{},(draft[m.id]&&draft[m.id].v)||{});
 m.fields.forEach(function(f){
  var id='f_'+m.id+'_'+f.k,v=a[f.k]||'';
  h+='<label for="'+id+'">'+esc(f.l)+(f.o?' <span class="sub">(선택)</span>':'')+'</label>';
  if(f.t==='area')h+='<textarea id="'+id+'">'+esc(v)+'</textarea>';
  else if(f.t==='select'){h+='<select id="'+id+'"><option value="">선택하세요</option>'+f.opts.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
   if(f.rand)h+='<button type="button" class="btn ghost small" data-rand="'+id+'">🎲 컨셉 랜덤 뽑기</button>';}
  else h+='<input type="text" id="'+id+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'">';});
 (m.photos||[]).forEach(function(p,i){h+='<div class="photo"><div class="pv" id="pv_'+m.id+'_'+i+'">📷</div><label><span class="pb">'+esc(p.l)+(p.req?'':' (선택)')+((S.photoUp&&S.photoUp[m.id]&&S.photoUp[m.id][i])?' ✅ 올림 (새로 올리면 바뀌어요)':'')+'</span><input type="file" accept="image/*" id="ph_'+m.id+'_'+i+'"></label></div>';});
 var queued=!!outbox[m.id];
 h+='<div class="sub" style="margin:6px 0">✏️ 잘못 냈어도 괜찮아요! 고쳐서 <b>[다시 제출하기]</b>를 누르면 <b>가장 최신 내용</b>으로 저장돼요. (사진은 바꾸고 싶을 때만 다시 올리면 돼요. 코인은 처음 한 번만 받아요.)</div><button class="btn" id="sb_'+m.id+'">'+(S.done[m.id]?'다시 제출하기':'제출하기')+'</button><div class="msg'+(S.done[m.id]&&!queued?' ok':(queued?' err':''))+'" id="mg_'+m.id+'">'+(queued?'⏳ 전송이 안 돼서 임시저장돼 있어요. 제출하기를 다시 눌러 주세요.':(S.done[m.id]?'✅ 제출 완료!':(draft[m.id]?'📝 임시저장된 내용이 있어요.':'')))+'</div></div>';

function bindMission(m){
 photoState[m.id]=photoState[m.id]||(draft[m.id]&&draft[m.id].photos?draft[m.id].photos.slice():[]);
 (m.photos||[]).forEach(function(p,i){
  var d0=photoState[m.id][i];if(d0&&$('pv_'+m.id+'_'+i))$('pv_'+m.id+'_'+i).innerHTML='<img src="'+d0+'">';
  var inp=$('ph_'+m.id+'_'+i);if(!inp)return;
  inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;
   compress(f).then(function(d){photoState[m.id][i]=d;$('pv_'+m.id+'_'+i).innerHTML='<img src="'+d+'">';keepDraft(m);}).catch(function(){var mg=$('mg_'+m.id);mg.className='msg err';mg.textContent='사진을 읽지 못했어요. 다시 선택해 주세요.';});};});
 m.fields.forEach(function(f){var el=$('f_'+m.id+'_'+f.k);if(el){el.addEventListener('input',function(){keepDraftSoon(m);});el.addEventListener('change',function(){keepDraftSoon(m);});}});
 Array.prototype.forEach.call(document.querySelectorAll('#mc_'+m.id+' [data-rand]'),function(b){b.onclick=function(){var sel=$(b.getAttribute('data-rand'));sel.value=CONCEPTS[Math.floor(Math.random()*CONCEPTS.length)];keepDraft(m);};});
 $('sb_'+m.id).onclick=function(){submit(m);};}
function readVals(m){var v={};m.fields.forEach(function(f){var el=$('f_'+m.id+'_'+f.k);v[f.k]=el?el.value.trim():'';});return v;}
function keepDraft(m){draft[m.id]={v:readVals(m),photos:(photoState[m.id]||[]).slice(),ts:Date.now()};saveDraft();}

function renderGallery(){

 $('app').innerHTML=startTitle('사진 모아보기')+'<div class="card"><h2>🖼️ 사진 모아보기</h2><div class="sub">미션별로 학생들이 올린 사진을 최신순으로 봐요. 사진을 누르면 원본이 새 창에서 열려요. (아듬샘 구글 계정으로 로그인된 브라우저에서만 원본이 보여요)</div>'+
  '<label for="gsel">미션</label><select id="gsel"><option value="">전체 미션</option>'+MISSIONS.filter(function(m){return m.photos&&m.photos.length;}).map(function(m){return '<option value="'+m.id+'"'+(GAL.mid===m.id?' selected':'')+'>'+m.id+' · '+esc(m.title)+'</option>';}).join('')+'</select></div><div id="gbody"></div><div class="msg" id="gmsg"></div><button class="btn ghost hide" id="gmore">더 보기</button>'+backBtn('bk','‹ 관리자 화면')+footer();
 $('bk').onclick=renderAdmin;
 $('gsel').onchange=function(){GAL.mid=this.value;renderGallery();};
 $('gmore').onclick=function(){galLoad();};
 galLoad();}
function galLoad(){
 if(GAL.busy)return;GAL.busy=true;var m=$('gmsg');m.className='msg';m.textContent='불러오는 중…';
 jsonp({action:'admingallery',code:adminCode(),mission:GAL.mid,offset:GAL.items.length,limit:12},45000).then(function(r){
  GAL.busy=false;if(!r||!r.ok)throw new Error((r&&r.error)||'x');
  GAL.total=r.total;var start=GAL.items.length;GAL.items=GAL.items.concat(r.items);
  var h='';r.items.forEach(function(it){
   h+='<div class="card gcard"><div><b>'+esc(it.mid+' · '+it.mission)+'</b></div><div class="sub">'+esc(it.scope==='팀'?(it.team+' (팀)'):((it.c||'')+'반 '+(it.n||'')+'번 '+it.name+' · '+it.team))+' · '+esc(it.t)+'</div><div class="gph">'+it.photos.map(function(p){var id='gp_'+p.fid;if(p.fid)GAL.q.push(p.fid);return '<a href="'+esc(p.url)+'" target="_blank" rel="noopener" id="'+id+'">📷</a>';}).join('')+'</div></div>';});
  $('gbody').insertAdjacentHTML('beforeend',h);
  m.textContent=GAL.items.length?('총 '+GAL.total+'건 중 '+GAL.items.length+'건'):'올라온 사진이 아직 없어요.';
  $('gmore').classList.toggle('hide',GAL.items.length>=GAL.total);
  galThumbs();
 }).catch(function(e){GAL.busy=false;m.className='msg err';m.textContent=noGasMsg(e);});}
function galThumbs(){
 if(GAL.thb||!GAL.q.length)return;GAL.thb=true;var ids=GAL.q.splice(0,6);
 jsonp({action:'adminthumbs',code:adminCode(),ids:ids.join(',')},60000).then(function(r){
  ((r&&r.thumbs)?Object.keys(r.thumbs):[]).forEach(function(fid){var a=$('gp_'+fid);if(a)a.innerHTML='<img src="'+r.thumbs[fid]+'" alt="">';});
 }).catch(function(){}).then(function(){GAL.thb=false;if(GAL.q.length&&$('gbody'))galThumbs();});}

/* ===== 미션·질문 목록 (담임, 보기 전용) ===== */
function renderMissionList(){
 inAdmin=true;setTabs(false);
 var h=startTitle('미션·질문 목록')+'<div class="sub" style="text-align:center">장소 순서대로예요. 총 '+MISSIONS.length+'개 (히든 포함)</div>';
 STAGES.forEach(function(st){
  var ms=MISSIONS.filter(function(m){return m.stage===st.id;});if(st.none||!ms.length)return;
  h+='<div class="card"><h2>'+esc(st.icon+' '+st.name)+'</h2>';
  ms.forEach(function(m){
   h+='<div style="border-top:2px dashed #cfc8ea;padding:10px 0"><b>'+esc(m.id)+' · '+esc(m.title)+'</b> '+(m.scope==='team'?'<span class="pill team">팀 미션</span> ':'')+(m.hidden?'<span class="pill opt">히든</span> ':'')+(m.opt?'<span class="pill opt">선택</span>':'')+
    '<div class="sub">'+esc(m.desc||'')+'</div>'+(m.rule?'<div class="rule" style="font-size:13px;margin:6px 0">'+esc(m.rule).replace(/\n/g,'<br>')+'</div>':'');
   if(m.fields&&m.fields.length)h+='<div style="font-size:13px;margin-top:4px"><b>✏️ 질문</b><ol style="margin:4px 0 4px 18px;padding:0">'+m.fields.map(function(f){return '<li>'+esc(f.l)+(f.t==='select'&&f.opts&&!f.rand?' <span class="sub">('+f.opts.map(esc).join(' / ')+')</span>':'')+(f.rand?' <span class="sub">(랜덤 뽑기)</span>':'')+'</li>';}).join('')+'</ol></div>';
   if(m.photos&&m.photos.length)h+='<div style="font-size:13px"><b>📷 사진</b><ul style="margin:4px 0 0 18px;padding:0">'+m.photos.map(function(q){return '<li>'+esc(q.l)+(q.req?' (필수)':' (선택)')+'</li>';}).join('')+'</ul></div>';
   h+='</div>';});
  h+='</div>';});
 $('app').innerHTML=h+backBtn('bk','‹ 관리자 화면')+footer();$('bk').onclick=renderAdmin;}

/* ===== 제출 기한 설정 (담임) ===== */
function renderDeadlines(){
 inAdmin=true;setTabs(false);
 $('app').innerHTML=startTitle('제출 기한')+'<div class="card"><h2>⏰ 장소별 제출 기한</h2><div class="msg" id="dlm">불러오는 중…</div></div>'+backBtn('bk','‹ 관리자 화면')+footer();
 $('bk').onclick=renderAdmin;
 var stop=slowNote(function(t){var m=$('dlm');if(m){m.className='msg slow';m.textContent=t;}});
 jsonp({action:'config'},30000).then(function(r){
  stop();if(!r||!r.ok)throw new Error('x');
  var old=r.deadlines||{},eff=function(id){return Object.prototype.hasOwnProperty.call(old,id)?String(old[id]||''):(DEFAULT_DEADLINES[id]||'');};
  var rows=STAGES.filter(function(st){return !st.none;});
  $('app').innerHTML=startTitle('제출 기한')+'<div class="sub" style="text-align:center">비워 두면 기한이 표시되지 않아요. 맨 아래 [저장]을 눌러야 반영돼요.</div><div class="card">'+rows.map(function(st){return '<div class="dlrow"><label for="dl_'+st.id+'">'+esc(st.icon+' '+st.name)+'</label><input type="text" id="dl_'+st.id+'" maxlength="60" value="'+esc(eff(st.id))+'" placeholder="예: 점심식사 전까지 제출"></div>';}).join('')+'</div><div class="card"><label style="display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" id="dl_lock" style="width:24px;height:24px"'+(old._lock==='0'?'':' checked')+'><span><b>🔒 장소 순서대로 열기</b><br><small>끄면 모든 장소가 바로 열려요 (사고 대비용)</small></span></label></div><button class="btn" id="dsave">저장하기</button><div class="msg" id="dlm"></div>'+backBtn('bk','‹ 저장 안 하고 돌아가기')+footer();
  $('bk').onclick=renderAdmin;
  $('dsave').onclick=function(){
   var nv={},lines=[];
   rows.forEach(function(st){var v=$('dl_'+st.id).value.trim();nv[st.id]=v;if(v!==eff(st.id))lines.push('⏰ '+esc(st.short)+': '+esc(eff(st.id)||'(없음)')+' → <b>'+esc(v||'(없음)')+'</b>');});
   var lk0=old._lock!=='0',lk1=$('dl_lock').checked;nv._lock=lk1?'1':'0';if(lk0!==lk1)lines.push('🔒 장소 순서 잠금: '+(lk0?'켜짐':'꺼짐')+' → <b>'+(lk1?'켜짐':'꺼짐')+'</b>');
   if(!lines.length){toast('바뀐 내용이 없어요',2200);return;}
   popup({icon:'📝',title:'이렇게 바꿀까요?',body:'<div class="dl">'+lines.map(function(l){return '<div>'+l+'</div>';}).join('')+'</div>',btns:[{t:'맞아요, 저장할게요',fn:function(){
    var m=$('dlm'),btn=$('dsave');btn.disabled=true;m.className='msg';m.textContent='저장 중…';
    var st2=slowNote(function(t){m.className='msg slow';m.textContent=t;});
    postJson({action:'adminsetconfig',code:adminCode(),deadlines:nv},40000).then(function(x){
     st2();if(!x||!x.ok)throw new Error((x&&x.error)||'x');
     renderAdmin();popup({icon:'✅',title:'제출 기한을 저장했어요',body:'학생 앱에는 약 1분 안에 반영돼요.',btns:[{t:'확인'}]});
    }).catch(function(e){st2();btn.disabled=false;m.className='msg err';m.textContent='저장하지 못했어요. 쓴 내용은 그대로 있으니 다시 눌러 주세요. ('+esc((e&&e.message)||'')+')';});}},{t:'다시 볼게요',ghost:true}]});};
 }).catch(function(e){stop();var m=$('dlm');if(m){m.className='msg err';m.textContent=noGasMsg(e);}});}


/* ===== 연결 설정 · 학생용 링크 · QR (담임) ===== */
function baseUrl(){return location.protocol==='file:'?location.href.split('?')[0].split('#')[0]:(location.origin+location.pathname);}
function studentLink(){return baseUrl()+'?gas='+encodeURIComponent(GAS);}
function renderGasSetup(from){
 inAdmin=false;setTabs(false);
 $('app').innerHTML=startTitle('처음 설정')+'<div class="card"><h2>🔧 구글 시트 연결</h2><div class="sub">Apps Script에서 배포한 <b>웹 앱 URL</b>(…/exec로 끝나는 주소)을 붙여넣어 주세요. 한 번만 하면 돼요. 연결되면 학생용 링크와 QR이 자동으로 만들어져요.</div><label for="gasin">웹 앱 URL</label><input type="text" id="gasin" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(GAS)+'" autocomplete="off"><button class="btn" id="gasgo">연결 확인하기</button><div class="msg" id="gasm"></div></div>'+backBtn('bk',from==='admin'?'‹ 관리자 화면':'‹ 처음으로')+footer();
 $('bk').onclick=from==='admin'?renderAdmin:renderStart;
 $('gasgo').onclick=function(){
  var v=$('gasin').value.trim(),m=$('gasm'),btn=$('gasgo');
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){m.className='msg err';m.textContent='주소가 맞는지 확인해 주세요. "https://script.google.com/…/exec" 모양이에요.';return;}
  var old=GAS;GAS=v;btn.disabled=true;m.className='msg';m.textContent='연결 확인 중…';
  var stop=slowNote(function(t){m.className='msg slow';m.textContent=t;});
  jsonp({action:'config'},30000).then(function(r){
   stop();
   if(!r||!r.ok||r.deadlines===undefined){GAS=old;btn.disabled=false;m.className='msg err';m.textContent='연결은 됐는데 GAS 코드가 옛 버전 같아요. 최신 코드를 붙여넣고 [배포 관리 → 수정 → 새 버전]으로 다시 배포해 주세요.';return;}
   try{localStorage.setItem(K_GAS,v);}catch(e){}
   toast('연결됐어요! ✅',2200);
   if(from==='admin')renderAdmin();else renderTeacherCode();
  }).catch(function(){stop();GAS=old;btn.disabled=false;m.className='msg err';m.textContent='연결이 안 돼요. 주소가 맞는지, 배포할 때 "액세스: 모든 사용자"로 했는지 확인해 주세요.';});};}
function copyText(txt){
 return (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).catch(function(){var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();});}
function qrPoster(url){
 var qr=qrcode(0,'M');qr.addData(url);qr.make();
 var n=qr.getModuleCount(),W=640,H=860,c=$('qrc'),x;c.width=W;c.height=H;x=c.getContext('2d');
 x.fillStyle='#FFD23F';x.fillRect(0,0,W,H);x.fillStyle='#2A2350';x.fillRect(0,0,W,12);x.fillRect(0,H-12,W,12);
 x.textAlign='center';x.fillStyle='#2A2350';x.font='900 54px Galmuri11,Pretendard,sans-serif';x.fillText('수학여행 원정대',W/2,100);
 x.font='700 26px Galmuri11,Pretendard,sans-serif';x.fillText('미션을 깨고 코인을 모아 최강 원정대가 되자!',W/2,152);
 var sz=Math.floor(480/n)*n,ox=(W-sz)/2,oy=205,k=sz/n;
 x.fillStyle='#fff';x.fillRect(ox-24,oy-24,sz+48,sz+48);x.strokeStyle='#2A2350';x.lineWidth=6;x.strokeRect(ox-24,oy-24,sz+48,sz+48);
 x.fillStyle='#2A2350';for(var r=0;r<n;r++)for(var q=0;q<n;q++)if(qr.isDark(r,q))x.fillRect(Math.round(ox+q*k),Math.round(oy+r*k),Math.ceil(k),Math.ceil(k));
 x.font='700 28px Galmuri11,Pretendard,sans-serif';x.fillText('📷 카메라로 찍어서 입장해요!',W/2,oy+sz+90);
 x.font='700 22px Galmuri11,Pretendard,sans-serif';x.fillText('Made by Cheon_R',W/2,H-40);}
function bindLinkCard(){
 var el=$('stuLink');if(!el)return;
 el.value=studentLink();
 $('areal').onclick=function(){S.realTest=true;saveS();startTeacherPlay();};
 $('tstOn').value=studentLink()+'&test=1';$('tstOff').value=studentLink()+'&test=0';
 [['cpt1','tstOn','테스트 링크'],['cpt0','tstOff','테스트 해제 링크']].forEach(function(a){$(a[0]).onclick=function(){var t=$(a[1]);t.select();copyText(t.value).then(function(){var m=$('tsm');m.className='msg ok';m.textContent='✅ '+a[2]+'를 복사했어요. 카톡에 붙여넣어 학생에게 보내세요!';});};});
 var lm=$('lkm');
 function note(t,ok){lm.className='msg '+(ok?'ok':'err');lm.textContent=t;}
 if(location.protocol==='file:')note('⚠️ 지금은 내 컴퓨터 파일로 열려 있어요. 깃허브에 올린 주소에서 열어야 학생용 링크가 제대로 만들어져요.');
 $('cpl').onclick=function(){el.select();copyText(el.value).then(function(){note('✅ 링크를 복사했어요. 단톡방에 붙여넣으세요!',true);});};
 $('cpr').onclick=function(){
  var url=el.value,label='수학여행 원정대_made by Cheon R',html='<a href="'+esc(url)+'">'+esc(label)+'</a>',plain=label+' 👉 '+url;
  var done=function(){note('✅ "'+label+'" 글자 링크로 복사했어요! 메일·문서에 붙여넣어 보세요.',true);};
  try{navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]).then(done,function(){copyText(plain).then(done);});}catch(e){copyText(plain).then(done);}};
 $('qrb').onclick=function(){try{qrPoster(el.value);$('qrbox').classList.remove('hide');note('QR이 만들어졌어요. [QR 이미지 저장]으로 내려받아 단톡방·프린트에 쓰세요.',true);}catch(e){note('QR을 만들지 못했어요. 링크를 복사해서 써 주세요.');}};
 $('qrd').onclick=function(){var a=document.createElement('a');a.href=$('qrc').toDataURL('image/png');a.download='수학여행원정대_QR.png';document.body.appendChild(a);a.click();a.remove();};
 $('gchg').onclick=function(){renderGasSetup('admin');};}

/* ===== 시작 ===== */
go('map');
if(S.user&&Object.keys(outbox).length&&GAS)setTimeout(function(){retryOutbox();},1500);
</script>
