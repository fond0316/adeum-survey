<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9B8EC4">
<title>CLASS BOARD</title>
<!-- 링크 미리보기(카톡 등) -->
<meta property="og:type" content="website">
<meta property="og:title" content="CLASS BOARD · 우리 반 공지">
<meta property="og:description" content="여기를 눌러 오늘의 공지를 확인하세요.">
<meta property="og:image" content="https://fond0316.github.io/adeum-survey/Cheon-R-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="Cheon-R-class-board-manifest.json">
<link rel="icon" href="Cheon-R-class-board-icon-192.png">
<link rel="apple-touch-icon" href="Cheon-R-class-board-icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{
  --main:#9B8EC4; --main-d:#6F62A3; --bg:#F4F2FA; --card:#fff; --line:#E4E0F0;
  --tx:#2E2A3D; --tx2:#6B6680; --tx3:#9A96AA;
  --u-bg:#F7C1C1; --u-tx:#791F1F; --u-dot:#E24B4A;
  --c-bg:#FAEEDA; --c-tx:#633806; --c-dot:#EF9F27;
  --h-bg:#CECBF6; --h-tx:#3C3489; --h-dot:#7F77DD;
  --g-bg:#D3D1C7; --g-tx:#444441; --g-dot:#888780;
  --s-bg:#CFE2F6; --s-tx:#0C447C; --s-dot:#378ADD;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--tx);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:12px 16px 24px}

/* 상단 */
.top{display:flex;align-items:center;gap:10px;background:var(--main);color:#fff;border-radius:14px;padding:10px 14px;min-height:56px}
.logo{font-size:22px}
.ttlw{flex:1;min-width:0}
.top h1{font-size:21px;font-weight:400;letter-spacing:.5px;line-height:1.2}

.sub{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{background:rgba(255,255,255,.22);border-radius:20px;padding:0 14px;font-size:14px;font-weight:600;min-height:44px}
.ref{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);font-size:18px;color:#fff}
.ref.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 긴급 배너 */
#urgent{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ub{background:var(--u-bg);color:var(--u-tx);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.ub small{display:block;font-weight:400;font-size:13px;margin-top:2px;white-space:pre-wrap}
.ub.h{background:var(--h-bg);color:var(--h-tx)}
.boardBtn{display:inline-block;margin-top:8px;min-height:36px;padding:0 12px;border-radius:18px;font-size:12px;color:var(--tx3);background:transparent;border:1px solid var(--line)}
/* 🖥️ 교실 화면 모드 — 멀리서도 보이게 크게 */
body.board{zoom:1.25}
body.board .wrap{max-width:1500px}
body.board .ub{font-size:20px;padding:14px 18px}
body.board .ub small{font-size:16px}
body.board .ttl{font-size:19px}
body.board .card .full,body.board .prev{font-size:16px}
body.board .pop .ttl{font-size:28px}
body.board .pop .body,body.board .pop .tg{font-size:20px}
body.board .me{background:#fff;color:var(--main-d)}
.adm{display:none}
body.board .adm{display:inline-flex;align-items:center}

/* 본문 레이아웃 (가로: 좌 달력 / 우 공지) */
.main{display:grid;grid-template-columns:minmax(260px,34%) 1fr;gap:14px;margin-top:12px;align-items:start}
.panel{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line)}
@media (orientation:portrait),(max-width:720px){
  .main{grid-template-columns:1fr}
  .cal-panel{order:2}
}

/* 달력 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:16px}
.cal-head button{width:44px;height:44px;border-radius:10px;font-size:18px;color:var(--tx2)}
.cal-head button:active{background:var(--bg)}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dow span{font-size:12px;color:var(--tx3);padding:4px 0}
.dow span:first-child{color:#D0706E}.dow span:last-child{color:#6D8CC4}
.day{min-height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;position:relative}
.day.out{color:#C9C6D4}
.day.today .n{background:var(--main);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700}
.day.sel{background:#ECE8F7}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--tx2)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:50%}

/* 탭 & 카드 */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{min-height:40px;padding:0 16px;border-radius:20px;font-size:15px;font-weight:600;color:var(--tx2);background:var(--bg)}
.tabs button.on{background:var(--main);color:#fff}
.tabs .sbtn{margin-left:auto;min-width:44px;padding:0 12px}
.sbox{display:flex;gap:6px;margin-bottom:12px}
.sbox input{flex:1;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;font-family:inherit;background:#fff;color:var(--tx)}
.sbox input:focus{outline:none;border-color:var(--main)}
.sbox button{min-height:44px;padding:0 14px;border-radius:12px;background:var(--bg);color:var(--tx2);font-weight:700;font-size:14px}
.sinfo{font-size:13px;color:var(--tx3);margin:0 0 8px}
.dd.p{color:var(--main-d)}
mark{background:#FEF3C7;color:inherit;border-radius:3px;padding:0 1px}
.sec{font-size:13px;font-weight:700;color:var(--tx2);margin:14px 0 8px}
.sec:first-child{margin-top:0}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:#fff}
.card.mine{border:2px solid var(--h-dot);background:#F6F5FE}
.row1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bd{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}
.bd.u{background:var(--u-bg);color:var(--u-tx)}.bd.c{background:var(--c-bg);color:var(--c-tx)}
.bd.h{background:var(--h-bg);color:var(--h-tx)}.bd.g{background:var(--g-bg);color:var(--g-tx)}
.bd.s{background:var(--s-bg);color:var(--s-tx)}
.dd.s{color:var(--s-tx)}
.bd.p{background:#fff;border:1px solid var(--main);color:var(--main-d)}
.bd.new{background:#FFE8E8;color:#C0392B}
.dd{margin-left:auto;font-size:13px;font-weight:700;color:var(--c-tx)}
.dd.late{color:var(--tx3)}
.ttl{font-size:17px;margin-top:6px;line-height:1.4}
.body{font-size:14px;color:var(--tx2);margin-top:4px;white-space:pre-wrap;line-height:1.55}
.tg{font-size:14px;margin-top:6px;color:var(--h-tx);font-weight:600}
.callme{display:inline-block;margin-top:6px;background:var(--h-dot);color:#fff;font-size:13px;font-weight:700;border-radius:6px;padding:3px 10px}
.ck{margin-top:10px;min-height:44px;width:100%;border-radius:10px;background:var(--main);color:#fff;font-size:15px;font-weight:700}
.ck.done{background:#EEF7EE;color:#2E7D32}
.card{cursor:pointer;width:100%;text-align:left;display:block;font:inherit;color:inherit}
.card:active{background:#FAF9FD}
.prev{font-size:14px;color:var(--tx2);margin-top:4px;white-space:pre-wrap;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .full{font-size:14px;color:var(--tx2);margin-top:4px;white-space:pre-wrap;line-height:1.5}
.more{font-size:12px;color:var(--main-d);font-weight:700;margin-top:4px}
.bd.need{background:var(--main);color:#fff}
.bd.ok{background:#EEF7EE;color:#2E7D32}
.det .x{float:right;width:44px;height:44px;margin:-10px -10px 0 0;font-size:22px;color:var(--tx3)}
.det .dt{font-size:13px;color:var(--tx3);margin-top:8px}
.req-btn{display:block;width:100%;min-height:44px;border-radius:10px;background:var(--bg);color:var(--tx2);font-size:14px;font-weight:600;margin-top:10px}
.req{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.req .who{font-size:14px;font-weight:700;background:#ECE8F7;color:var(--main-d);border-radius:8px;padding:8px 10px}
.req textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:15px;margin-top:8px;resize:vertical}
.req textarea:focus{outline:none;border-color:var(--main)}
.req .note{font-size:12px;color:var(--tx3);margin-top:6px}
.det .body{font-size:16px;color:var(--tx);max-height:55vh;overflow-y:auto;margin-top:12px}
.empty{text-align:center;color:var(--tx3);font-size:14px;padding:28px 0}
.foot{text-align:center;font-size:12px;color:var(--tx3);margin-top:18px}
.upd{font-size:12px;color:var(--tx3);text-align:right;margin-top:6px}

/* 모달 */
.ov{position:fixed;inset:0;background:rgba(30,25,50,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.ov.show{display:flex}
.modal{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:420px;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal h2{font-size:21px;margin-bottom:6px}
.ub.h{cursor:pointer}
.ub.done{background:#E8E6EE;color:#8B879A}
.chip{display:inline-block;background:rgba(255,255,255,.65);border-radius:12px;padding:1px 8px;margin:2px 4px 0 0;font-size:.85em}
.chip.ok{background:#E3F3E4;color:#2E7D32}
.gone{display:inline-block;margin-top:6px;background:#E3F3E4;color:#2E7D32;font-size:13px;font-weight:700;border-radius:6px;padding:3px 10px}
.cbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.cbtns button{min-height:56px;border-radius:12px;font-size:17px;font-weight:700;background:var(--h-bg);color:var(--h-tx)}
.cbtns button.ok{background:#E3F3E4;color:#2E7D32}
.modal p{font-size:14px;color:var(--tx2);line-height:1.5}
.modal input{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font-size:18px;font-family:inherit;margin-top:12px}
.modal input:focus{outline:none;border-color:var(--main)}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{flex:1;min-height:48px;border-radius:10px;font-size:16px;font-weight:700}
.b1{background:var(--main);color:#fff}.b2{background:var(--bg);color:var(--tx2)}
.err{color:#C0392B;font-size:13px;margin-top:8px;min-height:18px}
.pop{border-top:8px solid var(--u-dot);text-align:center;padding-top:26px}
.pop.h{border-top-color:var(--h-dot)}
.pop .ic{font-size:44px}
.pop .ttl{font-size:21px}
.pop .body{font-size:16px;text-align:left;margin-top:10px}
.pop .tg{text-align:left}
/* 제목용 폰트: 주아 (본문은 Pretendard) — 뒤에 둬서 굵기 설정을 덮어씀 */
.top h1,.ub,.ttl,.modal h2,.cal-head b{font-family:'Jua','Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400}
.ub small,.ub .chip{font-family:'Pretendard',-apple-system,sans-serif}
.cstrip{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.cstrip .ub,body.board .cstrip .ub{flex:none;margin:0;align-items:center;gap:6px;border-radius:18px;padding:6px 14px;font-size:16px;white-space:nowrap}
.cstrip .ub>div{display:flex;align-items:center;gap:8px}
.cstrip .ub small{display:inline-block;max-width:14em;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;font-size:.8em;margin:0;white-space:nowrap;font-family:'Pretendard',-apple-system,sans-serif}
.cstrip .ub.done,body.board .cstrip .ub.done{font-size:13px;padding:4px 12px}
.cstrip .chip{margin:0}
.bd.att{background:#fff;border:1px solid var(--line);color:var(--tx2)}
.atts{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.atts figure{margin:0}
.atts img{display:block;max-width:100%;max-height:50vh;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.atts figcaption{font-size:12px;color:var(--tx3);margin-top:3px}
.phload{padding:22px 12px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--tx3);font-size:13px}
.alink{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:22px;background:var(--bg);color:var(--main-d);font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--line);margin-right:8px}
.lk{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.lk b{font-size:13px;color:var(--tx2)}
.lk .lkb{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.lk .lkb .alink{margin:0}
#imgOv{background:rgba(20,16,36,.88);cursor:zoom-out;flex-direction:column;gap:8px}
#imgOv img{max-width:96vw;max-height:88vh;border-radius:10px;background:#fff}
#imgOv span{color:#fff;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="logo">📋</span>
    <div class="ttlw"><h1>CLASS BOARD</h1><div class="sub" id="cls"></div></div>
    <button class="me adm" onclick="openBoard('admin')">✏️ 관리</button>
    <button class="me" id="meBtn" onclick="BOARD ? openBoard() : openWho()">학번 등록</button>
    <button class="ref" id="refBtn" onclick="load(true)" aria-label="새로고침">↻</button>
  </header>

  <div id="urgent"></div>

  <div class="main">
    <section class="panel cal-panel">
      <div class="cal-head">
        <button onclick="moveMonth(-1)" aria-label="이전 달">‹</button>
        <b id="ym"></b>
        <button onclick="moveMonth(1)" aria-label="다음 달">›</button>
      </div>
      <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="days" id="days"></div>
      <div class="legend">
        <span><i style="background:var(--u-dot)"></i>긴급</span>
        <span><i style="background:var(--h-dot)"></i>호출</span>
        <span><i style="background:var(--c-dot)"></i>학급공지</span>
        <span><i style="background:var(--s-dot)"></i>교과공지</span>
        <span><i style="background:var(--g-dot)"></i>일반</span>
      </div>
      <div class="lk" id="linksBox" style="display:none"></div>
    </section>

    <section class="panel">
      <div class="tabs" id="tabs"></div>
      <div class="sbox" id="sbox" style="display:none"><input id="sInput" type="search" placeholder="공지 검색 (예: 수행평가)" maxlength="40" enterkeyhint="search" oninput="onSearchInput(this.value)" onkeydown="if(event.key==='Enter'){clearTimeout(sTimer);runSearch(this.value)}"><button onclick="closeSearch()">닫기</button></div>
      <div id="list"><div class="empty">불러오는 중…</div></div>
      <div class="upd" id="upd"></div>
    </section>
  </div>
  <div class="foot">Made by Cheon_R<br><button class="boardBtn" onclick="openBoard()">🖥️ 교실 화면 모드</button></div>
</div>

<!-- 학번 등록 -->
<div class="ov" id="whoOv">
  <div class="modal">
    <h2>학번 등록</h2>
    <p>확인 버튼과 호출 알림을 받으려면 학번을 등록해 주세요. 이 기기에만 저장돼요.</p>
    <input id="sidIn" type="tel" inputmode="numeric" placeholder="예: 10301" maxlength="10">
    <div class="err" id="whoErr"></div>
    <div class="btns" id="whoBtns">
      <button class="b2" onclick="closeOv('whoOv')">나중에</button>
      <button class="b1" onclick="lookup()">확인</button>
    </div>
  </div>
</div>

<!-- 교실 화면 모드 -->
<div class="ov" id="boardOv">
  <div class="modal">
    <h2 id="bdTitle">🖥️ 교실 화면 모드</h2>
    <p id="bdText"></p>
    <input id="bdPw" type="password" placeholder="담임 비밀번호 또는 회장 코드" onkeydown="if(event.key==='Enter')toggleBoard()">
    <div class="err" id="bdErr"></div>
    <div class="btns"><button class="b2" onclick="closeOv('boardOv')">취소</button><button class="b1" id="bdOk" onclick="toggleBoard()">켜기</button></div>
  </div>
</div>

<!-- 사진 크게 보기 -->
<div class="ov" id="imgOv" onclick="closeOv('imgOv')"><img id="imgBig" alt="첨부 사진"><span>화면을 누르면 닫혀요</span></div>

<!-- 공지 상세 -->
<div class="ov" id="detOv" onclick="if(event.target===this)closeOv('detOv')">
  <div class="modal det" id="detBox"></div>
</div>

<!-- 긴급/호출 팝업 -->
<div class="ov" id="popOv">
  <div class="modal pop" id="popBox"></div>
</div>

<script>
/* ===== 설정 & 저장소 ===== */
const K = { gas:'sn_gas_v1', me:'sn_me_v1', seen:'sn_popup_seen_v1', last:'sn_lastseen_v1', cls:'sn_cls_v1', board:'sn_board_v1' };
const TYPES = { '긴급':{c:'u',ic:'🚨'}, '확인':{c:'c',ic:'📋'}, '호출':{c:'h',ic:'📣'}, '교과':{c:'s',ic:'📚'}, '일반':{c:'g',ic:'📌'} };
const ORDER = { '긴급':0, '호출':1, '확인':2, '교과':3, '일반':4 };
const LABEL = { '긴급':'긴급', '호출':'호출', '확인':'학급공지', '교과':'교과공지', '일반':'일반' };
const POLL_MS = 60000;

function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

(function initGas(){
  const g = new URLSearchParams(location.search).get('gas');
  if (g) lsSet(K.gas, g.trim());
})();
const GAS = lsGet(K.gas, '');
const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
let BOARD = lsGet(K.board, false) === true;   // 🖥️ 교실 화면 모드 (이 기기에 기억)

let me = lsGet(K.me, null);
let notices = [], confirmed = new Set(), callDone = {}, links = [];
let tab = 'today', selDate = null;
let view = new Date(); view.setDate(1);
let prevSeen = lsGet(K.last, '');
let popQueue = [], popShowing = false, blinkTimer = null;
let baseTitle = document.title;

/* ===== 날짜 유틸 ===== */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return ymd(new Date()); }
function addDays(s, n){ const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); }
function diffDays(s){ return Math.round((new Date(s+'T00:00:00') - new Date(today()+'T00:00:00'))/86400000); }
function prettyDate(s){ const d = new Date(s+'T00:00:00'); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'[d.getDay()]+')'; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }


/* 날짜를 항상 yyyy-MM-dd 로 정리 (시트 형식이 바뀌어 와도 대응) */
function normDate(s){
  s = String(s ?? '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (m) return m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0');
  const d = new Date(s);
  return isNaN(d) ? s : d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ===== JSONP ===== */
let jpSeq = 0;
function jsonp(params){
  return new Promise((resolve, reject) => {
    if (!GAS) return reject(new Error('연결 주소가 없어요. 선생님이 알려준 링크로 다시 열어 주세요.'));
    const cb = '__sn' + Date.now() + (jpSeq++);
    const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); reject(new Error('서버 응답이 없어요. 화면 위 ↻를 누른 뒤 다시 시도해 주세요.')); }, 15000);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = (res) => { cleanup(); res && res.ok ? resolve(res) : reject(new Error((res && res.error) || '요청에 실패했어요.')); };
    const q = new URLSearchParams({ ...params, callback: cb, _: Date.now() });
    s.src = GAS + (GAS.includes('?') ? '&' : '?') + q.toString();
    s.onerror = () => { cleanup(); reject(new Error('서버에 연결하지 못했어요.')); };
    document.body.appendChild(s);
  });
}

/* ===== 불러오기 ===== */
/* ===== 기다리는 안내 — 오래 걸리면 몇 초째인지 알려줘요 (다른 문구로 바뀌면 저절로 멈춤) ===== */
function waitOn(el, base){
  if (!el) return;
  const t0 = Date.now(); let last = base; el.textContent = base;
  const iv = setInterval(() => {
    if (!el.isConnected || el.textContent !== last) return clearInterval(iv);
    const s = Math.floor((Date.now() - t0) / 1000);
    last = s >= 20 ? `${base} 너무 오래 걸려요 (${s}초). 화면 위 ↻를 누른 뒤 다시 확인해 주세요.`
         : s >= 10 ? `${base} 아직 기다리는 중이에요 (${s}초). 곧 결과를 알려드릴게요.`
         : s >= 5  ? `${base} 구글 서버가 조금 느려요 (${s}초)` : base;
    el.textContent = last;
  }, 1000);
}

/* ===== 렌더 ===== */
/* ===== 기간 공지 ===== */
function endOf(n){ return n.end && n.end > n.date ? n.end : n.date; }   // 끝나는 날
function isPeriod(n){ return !!(n.end && n.end > n.date); }
function covers(n, d){ return n.date <= d && d <= endOf(n); }            // 그날 보여야 하는 공지인지
function shortDate(s){ const d = new Date(s+'T00:00:00'); return (d.getMonth()+1)+'/'+d.getDate(); }
function periodText(n){ return prettyDate(n.date) + ' ~ ' + prettyDate(endOf(n)); }
function sortN(a, b){ return a.date.localeCompare(b.date) || ORDER[a.type]-ORDER[b.type] || String(a.created).localeCompare(String(b.created)); }
function isMine(n){ return !!(me && n.targets && n.targets.some(t => String(t.sid) === String(me.sid))); }

/* ===== 첨부(사진·링크) · 앱 바로가기 ===== */
function safeUrl(u){ u = String(u||'').trim(); return /^https?:\/\/\S+$/i.test(u) ? u : ''; }
function imgSrc(url){
  const u = safeUrl(url); if (!u) return '';
  const m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/(?:open|uc)\?[^#]*\bid=([\w-]+)/);
  if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600';
  if (/^https?:\/\/lh\d\.googleusercontent\.com\//i.test(u)) return u;
  if (/\.(jpe?g|png|gif|webp|bmp|avif)(\?|#|$)/i.test(u)) return u;
  return u;   // 종류가 '사진'으로 지정된 주소는 그대로 시도
}
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return '링크'; } }
const photoCache = {};
function isPhoto(a){ return !!a && a.kind === 'photo' && /^photo:P[a-z0-9]{12,24}$/.test(a.url || ''); }
function attsHtml(n){
  const list = (n.attachments || []).filter(a => isPhoto(a) || safeUrl(a.url));
  if (!list.length) return '';
  const photos = list.filter(isPhoto), imgs = list.filter(a => a.kind === 'img'), lks = list.filter(a => a.kind !== 'img' && a.kind !== 'photo');
  return `<div class="atts">
    ${photos.map(a => `<figure><div class="phload" data-photo="${esc(a.url.slice(6))}" data-name="${esc(a.name || '')}">📷 사진 불러오는 중…</div>${a.name?`<figcaption>${esc(a.name)}</figcaption>`:''}</figure>`).join('')}
    ${imgs.map(a => `<figure><img src="${esc(imgSrc(a.url))}" alt="${esc(a.name || '첨부 사진')}" data-url="${esc(safeUrl(a.url))}" loading="lazy" onclick="viewImg(this)" onerror="imgFail(this)">${a.name?`<figcaption>${esc(a.name)}</figcaption>`:''}</figure>`).join('')}
    ${lks.length ? `<div>${lks.map(a => `<a class="alink" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer">🔗 ${esc(a.name || hostOf(a.url))}</a>`).join('')}</div>` : ''}
  </div>`;
}
function imgFail(el){   // 사진이 안 열리면(공유 설정 등) 링크 버튼으로
  const a = document.createElement('a');
  a.className = 'alink'; a.href = el.dataset.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.textContent = '🖼️ ' + (el.alt && el.alt !== '첨부 사진' ? el.alt : '사진 열기');
  const box = el.closest('figure') || el; box.replaceWith(a);
}
async function loadPhotos(root){   // 폰에서 올린 사진은 시트에서 따로 불러와요
  for (const box of root.querySelectorAll('.phload')){
    const id = box.dataset.photo;
    try{
      if (!photoCache[id]) photoCache[id] = (await jsonp({ action:'photo', id })).data;
      const im = document.createElement('img');
      im.src = photoCache[id]; im.alt = box.dataset.name || '첨부 사진'; im.onclick = () => viewImg(im);
      box.replaceWith(im);
    }catch(e){
      box.innerHTML = '📷 사진을 불러오지 못했어요<br><button class="alink" style="margin:8px 0 0" onclick="retryPhotos(this)">다시 시도</button>';
    }
  }
}
function retryPhotos(btn){ const box = btn.closest('.phload'); box.textContent = '📷 사진 불러오는 중…'; loadPhotos(box.parentElement); }
function viewImg(el){ document.getElementById('imgBig').src = el.src; document.getElementById('imgOv').classList.add('show'); }
function renderLinks(){

}

}
function renderUrgent(){
  const t = today();
  const u = notices.filter(n => n.type === '긴급' && covers(n, t)).sort(sortN);
  let html = u.map(n =>
    `<div class="ub"><span>🚨</span><div>${esc(n.title)}${n.body?`<small>${esc(n.body)}</small>`:''}</div></div>`).join('');
  if (BOARD){   // 교실 화면: 오늘 호출은 한 줄에 나란히 (안 다녀온 호출이 앞, 다녀온 호출은 작은 회색)
    const calls = notices.filter(n => n.type === '호출' && n.date === t).sort((a, b) => (allDone(a) - allDone(b)) || sortN(a, b));
    if (calls.length) html += '<div class="cstrip">' + calls.map(n => {
      const fin = allDone(n);
      return `<div class="ub h${fin?' done':''}" onclick="openCall('${esc(n.id)}')"><span>${fin?'✅':'📣'}</span><div>${fin?'다녀왔어요 · ':''}${esc(n.title)}${n.body&&!fin?`<small>${esc(n.body)}</small>`:''}<div>${callChips(n)}</div></div></div>`;
    }).join('') + '</div>';
  }
  document.getElementById('urgent').innerHTML = html;
}
function renderCal(){
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById('ym').textContent = y + '년 ' + (m+1) + '월';
  const start = new Date(y, m, 1); start.setDate(1 - start.getDay());
  const byDate = {};
  notices.forEach(n => {
    const last = endOf(n);
    for (let d = n.date, k = 0; d <= last && k < 100; d = addDays(d, 1), k++) (byDate[d] = byDate[d] || new Set()).add(n.type);
  });
  const t = today();
  let html = '';
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    if (i >= 35 && d.getMonth() !== m) break;
    const s = ymd(d);
    const types = [...(byDate[s] || [])].sort((a,b)=>ORDER[a]-ORDER[b]);
    const cls = ['day', d.getMonth()!==m?'out':'', s===t?'today':'', s===selDate?'sel':''].join(' ');
    html += `<button class="${cls}" onclick="pickDate('${s}')"><span class="n">${d.getDate()}</span><span class="dots">${
      types.map(tp=>`<i style="background:var(--${TYPES[tp].c}-dot)"></i>`).join('')}</span></button>`;
  }
  document.getElementById('days').innerHTML = html;
}

/* ===== 🔍 검색 (서버에서 전체 기간, 호출 제외) ===== */
let searchQ = '', searchRes = [], searchMore = false, searchState = '', sTimer = null, sSeq = 0;
function openSearch(){
  tab = 'search'; selDate = null; render();
  const inp = document.getElementById('sInput'); inp.focus();
}
function closeSearch(){ document.getElementById('sInput').value = ''; searchQ = ''; searchRes = []; searchState = ''; setTab('today'); }
function onSearchInput(v){
  clearTimeout(sTimer);
  sTimer = setTimeout(() => runSearch(v), 450);   // 입력을 잠깐 멈추면 검색
}
async function runSearch(v){
  const q = String(v || '').trim().slice(0, 40);
  searchQ = q;
  if (!q){ searchRes = []; searchState = ''; renderList(); return; }
  const my = ++sSeq;
  searchState = 'loading'; renderList();
  try{
    const r = await jsonp({ action:'search', q });
    if (my !== sSeq) return;                         // 더 최근 검색이 있으면 무시
    searchRes = (r.results || []).map(n => ({ ...n, date: normDate(n.date), end: n.end ? normDate(n.end) : '' }));
    searchMore = !!r.more; searchState = 'done';
  }catch(e){ if (my !== sSeq) return; searchState = 'error:' + e.message; }
  renderList();
}
function hl(text){   // 검색어 표시 (띄어쓰기가 달라도 표시: "수행평가" → "수행 평가")
  const words = searchQ.split(/\s+/).filter(Boolean);
  const src = String(text || '');
  if (!words.length) return esc(src);
  const pat = words.map(w => [...w].map(ch => ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s*')).join('|');
  let out = '', last = 0;
  src.replace(new RegExp(pat, 'gi'), (m, ...rest) => {
    const i = rest[rest.length - 2];
    out += esc(src.slice(last, i)) + '<mark>' + esc(m) + '</mark>'; last = i + m.length; return m;
  });
  return out + esc(src.slice(last));
}
function renderSearch(){
  if (!searchQ) return '<div class="empty">찾고 싶은 단어를 입력해 주세요.<br><small>예: 수행평가, 체육복, 가정통신문</small></div>';
  if (searchState === 'loading') return '<div class="empty">찾는 중…</div>';
  if (searchState.startsWith('error:')) return `<div class="empty">검색하지 못했어요. ${esc(searchState.slice(6))}<br><button class="alink" style="margin-top:8px" onclick="runSearch(searchQ)">다시 시도</button></div>`;
  if (!searchRes.length) return `<div class="empty">"${esc(searchQ)}" 공지를 찾지 못했어요.</div>`;
  let html = `<p class="sinfo">"${esc(searchQ)}" 검색 결과 ${searchRes.length}개${searchMore ? ' (최근 50개만 보여요. 단어를 더 넣어 좁혀 보세요)' : ''}</p>`;
  let lastMonth = '';
  searchRes.forEach(n => {
    const m = n.date.slice(0, 7);
    if (m !== lastMonth){ lastMonth = m; html += `<div class="sec">${Number(m.slice(0,4))}년 ${Number(m.slice(5))}월</div>`; }
    html += card(n, true);
  });
  return html;
}
function card(n, inSearch){
  const T = TYPES[n.type] || TYPES['일반'];
  const mine = isMine(n);
  const isNew = prevSeen && n.created && n.created > prevSeen;
  let dd = '';
  if (isPeriod(n)){
    const t0 = today(), ks = diffDays(n.date), ke = diffDays(endOf(n));
    dd = ks > 0 ? `<span class="dd p">D-${ks} · ${shortDate(n.date)}~${shortDate(endOf(n))}</span>`
       : ke > 0 ? `<span class="dd p">~${shortDate(endOf(n))}까지</span>`
       : ke === 0 ? `<span class="dd p">오늘까지</span>` : `<span class="dd late">종료</span>`;
  } else if (n.type === '확인'){
    const k = diffDays(n.date);
    dd = k > 0 ? `<span class="dd">D-${k}</span>` : k === 0 ? `<span class="dd">오늘 마감</span>` : `<span class="dd late">마감</span>`;
  } else if (n.type === '교과'){
    const k = diffDays(n.date);
    dd = k > 0 ? `<span class="dd s">D-${k}</span>` : k === 0 ? `<span class="dd s">오늘</span>` : '';
  }
  const tg = targetLine(n);
  let ck = '';
  if (n.important) ck = confirmed.has(String(n.id)) ? '<span class="bd ok">✓ 확인</span>' : '<span class="bd need">확인 필요</span>';
  const body = (n.body || '').trim();
  const isShort = body.length <= 80 && body.split('\n').length <= 3;   // 짧은 내용은 카드에 전부
  return `<button class="card${mine?' mine':''}" onclick="openDetail('${esc(n.id)}')">
    <div class="row1"><span class="bd ${T.c}">${LABEL[n.type]||n.type}</span>${n.author==='회장'?'<span class="bd p">회장</span>':''}${isNew?'<span class="bd new">NEW</span>':''}${(n.attachments||[]).length?`<span class="bd att">📎 ${n.attachments.length}</span>`:''}${ck}${dd}</div>
    <div class="ttl">${inSearch ? hl(n.title) : esc(n.title)}</div>
    ${inSearch ? `<div class="sinfo" style="margin:4px 0 0">${isPeriod(n) ? '📅 ' + periodText(n) : prettyDate(n.date)}</div>` : ''}
    ${body ? (isShort ? `<div class="full">${inSearch ? hl(body) : esc(body)}</div>` : `<div class="prev">${inSearch ? hl(body) : esc(body)}</div><div class="more">눌러서 전체 보기 ›</div>`) : ''}
    ${tg}${mine && !isDone(n, me.sid)?'<span class="callme">나를 불렀어요</span>':''}${n.type==='호출' && allDone(n)?'<span class="gone">✅ 다녀왔어요</span>':''}
  </button>`;
}
/* ===== 호출 '다녀왔어요' ===== */
function doneList(n){ return callDone[n.id] || []; }
function isDone(n, sid){ return doneList(n).some(d => String(d.sid) === String(sid)); }
function allDone(n){
  if (n.type !== '호출') return false;
  const tg = n.targets || [];
  return tg.length ? tg.every(t => isDone(n, t.sid)) : doneList(n).length > 0;
}
function callChips(n){
  const tg = n.targets || [];
  let h = tg.map(x => `<span class="chip${isDone(n,x.sid)?' ok':''}">${isDone(n,x.sid)?'✅ ':''}${esc(x.sid+' '+x.name)}</span>`).join('');
  if (n.memo){
    const extra = doneList(n).filter(d => !tg.some(x => String(x.sid) === String(d.sid)));
    h += extra.length ? extra.map(d => `<span class="chip ok">✅ ${esc(n.memo)} ${esc(d.sid+' '+d.name)}</span>`).join('') : `<span class="chip">${esc(n.memo)}</span>`;
  }
  return h;
}
let callNid = null;
function openCall(id){
  const n = notices.find(x => String(x.id) === String(id)); if (!n) return;
  callNid = n.id;
  const tg = n.targets || [];
  const btns = tg.map(x => `<button class="${isDone(n,x.sid)?'ok':''}" onclick="markCall('${esc(x.sid)}')">${isDone(n,x.sid)?'✅ ':''}${esc(x.sid)} ${esc(x.name)}</button>`).join('');
  const memoPart = (n.memo || !tg.length) ? `
    <p style="margin-top:12px">${n.memo ? esc(n.memo)+'(으)로 불린 학생은 ' : ''}학번을 입력해 주세요.</p>
    <input id="callSid" type="tel" inputmode="numeric" placeholder="학번" maxlength="10" onkeydown="if(event.key==='Enter')markCall(this.value.trim())">
    <div class="btns"><button class="b1" onclick="markCall(document.getElementById('callSid').value.trim())">다녀왔어요</button></div>` : '';
  const extra = doneList(n).filter(d => !tg.some(x => String(x.sid) === String(d.sid)));
  document.getElementById('detBox').innerHTML = `
    <button class="x" onclick="closeOv('detOv')" aria-label="닫기">✕</button>
    <div class="row1"><span class="bd h">호출</span></div>
    <div class="ttl" style="font-size:22px">${esc(n.title)}</div>
    ${n.body?`<div class="body">${esc(n.body)}</div>`:''}
    <p style="margin-top:12px;font-weight:700">✅ 다녀왔으면 내 이름을 눌러 주세요 <span style="font-weight:400;color:var(--tx3)">(잘못 눌렀으면 한 번 더)</span></p>
    ${btns?`<div class="cbtns">${btns}</div>`:''}
    ${extra.length?`<div class="cbtns">${extra.map(d=>`<button class="ok" onclick="markCall('${esc(d.sid)}')">✅ ${esc(d.sid)} ${esc(d.name)}</button>`).join('')}</div>`:''}
    ${memoPart}
    <div class="err" id="callErr"></div>`;
  document.getElementById('detOv').classList.add('show');
}
async function markCall(sid){
  const n = notices.find(x => String(x.id) === String(callNid)); if (!n) return;
  const err = document.getElementById('callErr');
  if (!sid){ err.textContent = '학번을 입력해 주세요.'; return; }
  const undo = isDone(n, sid);
  if (undo && !confirm(`${sid} 다녀왔어요 체크를 취소할까요?`)) return;
  waitOn(err, '저장 중…');
  try{
    const r = await jsonp({ action:'callDone', nid:n.id, sid, undo: undo ? '1' : '' });
    const list = (callDone[n.id] = doneList(n).filter(d => String(d.sid) !== String(sid)));
    if (!undo) list.push({ sid, name:r.name });
    render(); openCall(n.id);
  }catch(e){ err.textContent = e.message; }
}

function targetLine(n){
  if (n.type !== '호출') return '';
  const names = (n.targets||[]).map(t => (isDone(n,t.sid)?'✅ ':'') + esc(t.sid+' '+t.name));
  if (n.memo) names.push(esc(n.memo));
  return names.length ? `<div class="tg">📣 ${names.join(', ')}</div>` : '';
}

/* ===== 공지 상세 팝업 ===== */
function findN(id){ return notices.find(x => String(x.id) === String(id)) || searchRes.find(x => String(x.id) === String(id)); }
function openDetail(id){
  const n = findN(id);
  if (!n) return;
  const T = TYPES[n.type] || TYPES['일반'];
  let ck = '';
  if (n.important){
    ck = confirmed.has(String(n.id))
      ? '<div class="btns"><button class="b1 ck done" disabled>✓ 확인 완료</button></div>'
      : `<div class="btns"><button class="b1" onclick="doConfirm('${esc(n.id)}', this)">확인했어요</button></div>`;
  }
  document.getElementById('detBox').innerHTML = `
    <button class="x" onclick="closeOv('detOv')" aria-label="닫기">✕</button>
    <div class="row1"><span class="bd ${T.c}">${LABEL[n.type]||n.type}</span>${n.author==='회장'?'<span class="bd p">회장</span>':''}</div>
    <div class="ttl" style="font-size:20px">${esc(n.title)}</div>
    <div class="dt">${isPeriod(n) ? '📅 ' + periodText(n) : prettyDate(n.date) + (n.type==='확인'?' 마감':'')}</div>
    ${targetLine(n)}${isMine(n) && !isDone(n, me.sid)?'<span class="callme">나를 불렀어요</span>':''}
    ${n.type==='호출' ? `<div class="btns"><button class="b1" onclick="openCall('${esc(n.id)}')">${allDone(n)?'✅ 다녀왔어요 (보기)':'✅ 다녀왔어요 체크하기'}</button></div>` : ''}
    ${n.body?`<div class="body">${esc(n.body)}</div>`:''}
    ${attsHtml(n)}
    ${ck}
    <div id="reqArea"><button class="req-btn" onclick="openReq('${esc(n.id)}')">✏️ 수정 요청·질문</button></div>`;
  document.getElementById('detOv').classList.add('show');
  loadPhotos(document.getElementById('detBox'));
}

/* ===== 수정 요청·질문 ===== */
let reqRid = '';
function openReq(id){
  reqRid = 'R' + Array.from({ length:16 }, () => Math.floor(Math.random() * 36).toString(36)).join('');   // 다시 보내도 한 번만 저장되게
  if (!me){ closeOv('detOv'); openWho(); return; }
  document.getElementById('reqArea').innerHTML = `<div class="req">
    <div class="who">보내는 사람: ${esc(me.sid)} ${esc(me.name)}</div>
    <textarea id="reqText" maxlength="300" placeholder="틀린 날짜·내용이나 궁금한 점을 적어 주세요."></textarea>
    <div class="note">담임선생님과 공지 작성자에게만 보이고, 학번·이름이 함께 전달돼요.</div>
    <div class="err" id="reqErr"></div>
    <div class="btns"><button class="b2" onclick="openDetail('${esc(id)}')">취소</button><button class="b1" id="reqSend" onclick="sendReq('${esc(id)}')">보내기</button></div>
  </div>`;
  document.getElementById('reqText').focus();
}
async function sendReq(id){
  const text = document.getElementById('reqText').value.trim();
  const err = document.getElementById('reqErr'), btn = document.getElementById('reqSend');
  if (!text){ err.textContent = '내용을 입력해 주세요.'; return; }
  btn.disabled = true; waitOn(err, '보내는 중…');
  try{
    await jsonp({ action:'request', nid:id, sid:me.sid, text, rid:reqRid });
    document.getElementById('reqArea').innerHTML = '<div class="req"><div class="who" style="text-align:center">✓ 보냈어요! 선생님이 확인할 거예요.</div></div>';
  }catch(e){ err.textContent = e.message; btn.disabled = false; }
}
function renderList(){
  const el = document.getElementById('list');
  const t = today();
  const shown = n => !(BOARD && n.type === '호출');   // 교실 화면에선 호출이 위쪽 줄에 이미 있어요
  let html = '';
  if (tab === 'search'){ el.innerHTML = renderSearch(); return; }
  if (!loaded && GAS){   // 아직 못 불러왔는데 "공지가 없어요"라고 하면 안 되니까
    const cur = el.querySelector('.empty.loading');
    if (!cur){ el.innerHTML = '<div class="empty loading">불러오는 중…</div>'; waitOn(el.firstChild, '불러오는 중…'); }
    return;
  }
  if (tab === 'today'){
    const td = notices.filter(n => covers(n, t) && shown(n)).sort(sortN);
    const pend = notices.filter(n => n.type === '확인' && n.date > t).sort(sortN);
    html += `<div class="sec">${prettyDate(t)}</div>` + (td.length ? td.map(n => card(n)).join('') : '<div class="empty">오늘은 공지가 없어요 🙂</div>');
    if (pend.length) html += `<div class="sec">마감 전 학급공지</div>` + pend.map(n => card(n)).join('');
  } else if (tab === 'week'){
    const wEnd = addDays(t, 6);
    const per = notices.filter(n => isPeriod(n) && n.date <= wEnd && endOf(n) >= t && shown(n)).sort(sortN);
    if (per.length) html += `<div class="sec">📅 진행 중인 기간 공지</div>` + per.map(n => card(n)).join('');   // 날짜마다 반복하지 않고 한 번만
    for (let i = 0; i < 7; i++){
      const d = addDays(t, i);
      const arr = notices.filter(n => !isPeriod(n) && n.date === d && shown(n)).sort(sortN);
      if (arr.length) html += `<div class="sec">${prettyDate(d)}</div>` + arr.map(n => card(n)).join('');
    }
    if (!html) html = '<div class="empty">이번주 공지가 없어요</div>';
  } else {
    const arr = notices.filter(n => covers(n, selDate) && shown(n)).sort(sortN);
    html = arr.length ? arr.map(n => card(n)).join('') : '<div class="empty">이 날은 공지가 없어요</div>';
  }
  el.innerHTML = html;
}

function setSub(sub){
  document.getElementById('cls').textContent = sub;
  baseTitle = 'CLASS BOARD · ' + sub;
  if (!blinkTimer) document.title = baseTitle;
}

/* ===== 조작 ===== */
function setTab(t){ tab = t; selDate = null; render(); }
function pickDate(s){ selDate = s; tab = (s === today()) ? 'today' : 'date'; if (tab==='today') selDate = s; render(); }
function moveMonth(k){ view.setMonth(view.getMonth()+k); renderCal(); }

async function doConfirm(id, btn){
  if (!me){ openWho(); return; }
  btn.disabled = true; waitOn(btn, '저장 중…');
  try{
    await jsonp({ action:'confirm', nid:id, sid:me.sid });
    confirmed.add(String(id));
    renderList();
    openDetail(id);
  }catch(e){
    btn.disabled = false; btn.textContent = '확인했어요';
    alert(e.message);
  }
}

/* ===== 학번 등록 ===== */
function openWho(){
  document.getElementById('sidIn').value = me ? me.sid : '';
  document.getElementById('whoErr').textContent = '';
  document.getElementById('whoBtns').innerHTML = `<button class="b2" onclick="closeOv('whoOv')">나중에</button><button class="b1" onclick="lookup()">확인</button>`;
  document.getElementById('whoOv').classList.add('show');
}
function closeOv(id){ document.getElementById(id).classList.remove('show'); }
async function lookup(){
  const sid = document.getElementById('sidIn').value.trim();
  const err = document.getElementById('whoErr');
  if (!sid){ err.textContent = '학번을 입력해 주세요.'; return; }
  waitOn(err, '확인 중…');
  try{
    const r = await jsonp({ action:'who', sid });
    err.textContent = '';
    document.getElementById('whoBtns').innerHTML =
      `<button class="b2" onclick="openWho()">아니에요</button><button class="b1" id="okMe">${esc(r.name)} 맞아요</button>`;
    document.getElementById('okMe').onclick = () => {
      me = { sid: String(r.sid), name: r.name };
      lsSet(K.me, me);
      closeOv('whoOv');
      load();
    };
  }catch(e){ err.textContent = e.message; }
}

/* ===== 긴급·호출 팝업 ===== */
function checkPopups(){
  const t = today();
  const seen = new Set(lsGet(K.seen, []));
  const fresh = notices.filter(n => n.popup && covers(n, t) && !seen.has(String(n.id)) && !allDone(n) &&
    (PREVIEW || BOARD || !n.targets || !n.targets.length || isMine(n)) && !popQueue.some(q => q.id === n.id));
  if (!fresh.length) return;
  popQueue.push(...fresh.sort(sortN));
  alertUser();
  if (!popShowing) showNextPop();
}
function showNextPop(){
  const n = popQueue.shift();
  if (!n){ popShowing = false; closeOv('popOv'); return; }
  popShowing = true;
  const T = TYPES[n.type] || TYPES['긴급'];
  let tg = '';
  if (n.type === '호출'){
    const names = (n.targets||[]).map(t => esc(t.sid+' '+t.name));
    if (n.memo) names.push(esc(n.memo));
    if (names.length) tg = `<div class="tg">📣 ${names.join(', ')}</div>`;
  }
  const box = document.getElementById('popBox');
  box.className = 'modal pop' + (n.type === '호출' ? ' h' : '');
  box.innerHTML = `<div class="ic">${T.ic}</div><div class="ttl">${esc(n.title)}</div>${tg}
    ${n.body?`<div class="body">${esc(n.body)}</div>`:''}
    <div class="btns"><button class="b1" id="popOk">확인했어요</button></div>`;
  document.getElementById('popOk').onclick = async () => {
    const seen = lsGet(K.seen, []);
    seen.push(String(n.id)); lsSet(K.seen, seen.slice(-200));
    if (n.important && me && !confirmed.has(String(n.id))){
      try{ await jsonp({ action:'confirm', nid:n.id, sid:me.sid }); confirmed.add(String(n.id)); }catch(e){}
    }
    stopBlink(); renderList(); showNextPop();
  };
  document.getElementById('popOv').classList.add('show');
}
function alertUser(){
  beep();
  if (document.hidden && !blinkTimer){
    let on = false;
    blinkTimer = setInterval(() => { document.title = (on = !on) ? '🔴 새 알림!' : baseTitle; }, 1000);
  }
}
function stopBlink(){ if (blinkTimer){ clearInterval(blinkTimer); blinkTimer = null; } document.title = baseTitle; }
let actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(t0 => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.25, actx.currentTime + t0);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + t0 + 0.2);
      o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + 0.2);
    });
  }catch(e){}
}
document.addEventListener('pointerdown', () => { try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); }catch(e){} }, { once:true });

/* ===== 🖥️ 교실 화면 모드 ===== */
let pollTimer = null;
function startPoll(){ clearInterval(pollTimer); pollTimer = setInterval(load, BOARD ? 30000 : POLL_MS); }
function applyBoard(){ document.body.classList.toggle('board', BOARD); }
let bdMode = 'toggle';
function go(url){ location.href = url; }
function openBoard(mode){
  bdMode = mode === 'admin' ? 'admin' : 'toggle';
  document.getElementById('bdTitle').textContent = bdMode === 'admin' ? '✏️ 관리 화면으로 전환' : BOARD ? '🖥️ 교실 화면 모드 끄기' : '🖥️ 교실 화면 모드';
  document.getElementById('bdText').textContent = bdMode === 'admin'
    ? '담임 비밀번호나 회장 코드를 입력해 주세요. 다 쓰면 [🖥️ 교실 화면 모드]를 눌러 돌아와요. (5분 동안 조작이 없으면 자동으로 돌아와요)'
    : BOARD ? '끄려면 담임 비밀번호나 회장 코드를 입력해 주세요.'
    : '전자칠판처럼 반 전체가 보는 화면용이에요. 모든 호출이 크게 뜨고 30초마다 새로고침돼요. 담임 비밀번호나 회장 코드를 입력해 주세요.';
  document.getElementById('bdOk').textContent = bdMode === 'admin' ? '전환' : BOARD ? '끄기' : '켜기';
  document.getElementById('bdPw').value = ''; document.getElementById('bdErr').textContent = '';
  document.getElementById('bdErr').style.color = ''; document.getElementById('bdOk').disabled = false;
  document.getElementById('boardOv').classList.add('show');
  setTimeout(() => document.getElementById('bdPw').focus(), 50);
}
async function toggleBoard(){
  const pw = document.getElementById('bdPw').value.trim(), err = document.getElementById('bdErr');
  if (!pw){ err.textContent = '비밀번호를 입력해 주세요.'; return; }
  waitOn(err, '확인 중…');
  try{
    const r = await jsonp({ action:'login', pw });
    if (!r.role){ err.textContent = '비밀번호가 맞지 않아요.'; return; }
    if (bdMode === 'admin'){   // 관리 화면으로 (이 탭에서만 로그인 유지)
      try{
        sessionStorage.setItem('sn_admin_pw_v1', pw);
        sessionStorage.setItem('sn_board_login', JSON.stringify({ role:r.role, installId:r.installId||'', className:r.className||'', mustChange:!!r.mustChange }));
      }catch(e){}
      err.style.color = '#2E7D32'; err.textContent = '✅ 확인됐어요. 관리 화면을 여는 중이에요… (몇 초 걸릴 수 있어요)';
      document.getElementById('bdOk').disabled = true;
      go('Cheon-R-class-board-admin.html?from=board'); return;
    }
    BOARD = !BOARD; lsSet(K.board, BOARD);
    closeOv('boardOv'); closeOv('whoOv'); applyBoard(); startPoll(); render(); checkPopups();
  }catch(e){ err.textContent = e.message; }
}

/* ===== 시작 ===== */
document.addEventListener('visibilitychange', () => { if (!document.hidden){ load(); if (!popShowing) stopBlink(); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('Cheon-R-class-board-sw.js', { scope:'./Cheon-R-class-board' }).catch(()=>{});
applyBoard();
if (lsGet(K.cls, '')) setSub(lsGet(K.cls, ''));
render();
if (!GAS){
  document.getElementById('list').innerHTML = '<div class="empty">연결 주소가 없어요.<br>선생님이 알려준 링크로 다시 열어 주세요.</div>';
} else {
  load();
  startPoll();
  if (!me && !PREVIEW && !BOARD) setTimeout(openWho, 600);
}
</script>
