<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>삿포로 쇼핑리스트</title>
<link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
<style>
  :root {
    --ink: #232b45;
    --cream: #f7f3ea;
    --warm: #e6ddc9;
    --accent: #6b5b95;
    --accent-light: #9b8fc4;
    --teal: #3d4a6b;
    --teal-light: #5c6b96;
    --blush: #8a7ca8;
    --sage: #556080;
    --lavender: #8b7aab;
    --text: #2c2c3e;
    --muted: #6b6b80;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', sans-serif;
    background: var(--cream);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: 60px;
  }
  /* HEADER */
  .header {
    background: var(--ink);
    color: var(--cream);
    padding: 44px 24px 28px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(107,91,149,0.25) 0%, transparent 70%);
  }
  .header-inner { max-width: 800px; margin: 0 auto; position: relative; z-index: 1; }
  .header-tag {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent-light); margin-bottom: 12px; font-weight: 300;
  }
  .header h1 { font-size: 30px; margin-bottom: 8px; color: #fff; }
  .header h1 span { color: var(--accent-light); font-weight: 700; }
  .header-sub { font-size: 13px; color: rgba(247,243,238,0.65); font-weight: 300; }
  .stat-row { display: flex; gap: 20px; margin-top: 22px; flex-wrap: wrap; }
  .stat-box { display: flex; flex-direction: column; gap: 2px; }
  .stat-num { font-size: 20px; font-weight: 700; color: #fff; }
  .stat-label { font-size: 10px; color: var(--accent-light); letter-spacing: 1px; }

  /* CONTROLS (sticky) */
  .controls {
    position: sticky; top: 0; z-index: 20;
    background: var(--cream);
    border-bottom: 1px solid var(--warm);
    padding: 12px 16px;
    box-shadow: 0 2px 12px rgba(35,43,69,0.06);
  }
  .controls-inner { max-width: 800px; margin: 0 auto; }
  .search-box {
    width: 100%;
    padding: 11px 16px;
    border-radius: 12px;
    border: 1px solid var(--warm);
    background: #fff;
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
  }
  .search-box:focus { border-color: var(--accent-light); }
  .chip-row {
    display: flex; gap: 6px; margin-top: 10px;
    overflow-x: auto; padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    font-size: 12px; font-weight: 500;
    padding: 7px 14px; border-radius: 20px;
    background: #fff; border: 1px solid var(--warm);
    color: var(--muted); cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* MAIN */
  .main { max-width: 800px; margin: 0 auto; padding: 20px 16px 0; }

  .no-result { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }

  /* CATEGORY */
  .cat-card {
    background: #fff; border-radius: 16px; margin-bottom: 16px;
    overflow: hidden; box-shadow: 0 2px 16px rgba(35,43,69,0.06);
  }
  .cat-header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 18px; cursor: pointer; user-select: none;
    color: #fff;
  }
  .cat-icon { font-size: 20px; flex-shrink: 0; }
  .cat-name-wrap { flex: 1; min-width: 0; }
  .cat-name { font-size: 15px; font-weight: 700; }
  .cat-count { font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .cat-chevron { font-size: 12px; transition: transform 0.2s; opacity: 0.85; }
  .cat-card.open .cat-chevron { transform: rotate(180deg); }

  .cat-body { display: none; padding: 0 18px 18px; }
  .cat-card.open .cat-body { display: block; }

  .howto-box {
    background: rgba(85,96,128,0.08);
    border-left: 3px solid var(--sage);
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
    margin: 14px 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .howto-box strong { color: var(--text); }

  .item-grid {
    display: grid; grid-template-columns: 1fr; gap: 10px;
  }
  @media (min-width: 620px) { .item-grid { grid-template-columns: 1fr 1fr; } }

  .item-card {
    display: flex; gap: 10px;
    border: 1px solid var(--warm);
    border-radius: 12px;
    padding: 12px 14px;
    position: relative;
    transition: all 0.15s;
  }
  .item-card.done { opacity: 0.5; background: rgba(85,96,128,0.04); }
  .item-card.is-custom { border-style: dashed; border-color: var(--accent-light); }

  .item-check {
    width: 22px; height: 22px; border-radius: 7px;
    border: 2px solid var(--warm); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; margin-top: 2px; background: #fff;
    font-size: 13px; color: #fff;
  }
  .item-check.checked { background: var(--accent); border-color: var(--accent); }

  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: 13.5px; font-weight: 700; color: var(--text); }
  .item-card.done .item-name { text-decoration: line-through; }
  .item-sub { font-size: 11px; color: var(--accent); margin-top: 2px; }
  .item-desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .item-meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .item-price { font-size: 11px; font-weight: 600; color: var(--ink); background: var(--warm); padding: 2px 8px; border-radius: 8px; }
  .item-tag { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 8px; }
  .item-new { font-size: 9.5px; font-weight: 700; color: var(--accent); }
  .item-del {
    position: absolute; top: 8px; right: 8px;
    width: 20px; height: 20px; border-radius: 50%;
    border: none; background: transparent; color: var(--muted);
    font-size: 13px; cursor: pointer; opacity: 0.4;
  }
  .item-del:hover { opacity: 1; }

  /* ADD FORM */
  .add-row { margin-top: 14px; }
  .add-toggle {
    font-size: 12px; color: var(--accent); font-weight: 600;
    cursor: pointer; padding: 8px 0; display: inline-flex; align-items: center; gap: 4px;
  }
  .add-form { display: none; gap: 8px; flex-direction: column; margin-top: 8px; background: rgba(155,143,196,0.06); padding: 12px; border-radius: 10px; }
  .add-form.open { display: flex; }
  .add-form input, .add-form select {
    padding: 9px 12px; border-radius: 8px; border: 1px solid var(--warm);
    font-family: 'Pretendard', sans-serif; font-size: 13px; background: #fff; outline: none;
  }
  .add-form input:focus, .add-form select:focus { border-color: var(--accent-light); }
  .add-form-row { display: flex; gap: 8px; }
  .add-form-row select { flex: 1; }
  .add-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 9px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: 'Pretendard', sans-serif;
  }

  footer { text-align: center; padding: 32px 16px 8px; font-size: 11px; color: var(--muted); }
</style>
</head>

/* ===================== 상태 ===================== */
const STORAGE_KEY = 'sapporoShoppingState_v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { bought: {}, hidden: {}, open: {}, custom: {} };
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
const state = loadState();
if (!state.custom) state.custom = {};
if (!state.open) state.open = {};
if (!state.hidden) state.hidden = {};
if (!state.bought) state.bought = {};

let activeTag = null;
let searchQuery = '';

/* ===================== 렌더링 ===================== */
function allItemsFor(cat) {
  const base = cat.items.map((it, i) => ({
    id: cat.id + '-' + i,
    name: it[0], sub: it[1], desc: it[2], price: it[3], tag: it[4],
    custom: false
  }));
  const customs = (state.custom[cat.id] || []).map(it => ({ ...it, custom: true }));
  return base.concat(customs);
}

function escapeHtml(s) {
  return String(s || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderChips() {
  const row = document.getElementById('tagChipRow');
  let html = `<div class="chip ${activeTag===null?'active':''}" data-tag="">전체</div>`;
  Object.keys(TAGS).forEach(key => {
    html += `<div class="chip ${activeTag===key?'active':''}" data-tag="${key}">${TAGS[key].label}</div>`;
  });
  row.innerHTML = html;
  row.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeTag = chip.dataset.tag || null;
      render();
    });
  });
}

function render() {
  const area = document.getElementById('mainArea');
  let totalCount = 0, doneCount = 0, catCount = 0;
  let html = '';
  const q = searchQuery.trim().toLowerCase();

  CATEGORIES.forEach((cat, ci) => {
    const items = allItemsFor(cat).filter(it => !state.hidden[it.id]);
    const filtered = items.filter(it => {
      if (activeTag && it.tag !== activeTag) return false;
      if (q) {
        const hay = (it.name + ' ' + it.sub + ' ' + it.desc + ' ' + cat.name).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    if (filtered.length === 0) return;

    catCount++;
    totalCount += filtered.length;
    const doneInCat = filtered.filter(it => state.bought[it.id]).length;
    doneCount += doneInCat;

    const color = 'var(--' + COLOR_CYCLE[ci % COLOR_CYCLE.length] + ')';
    const isOpen = !!state.open[cat.id] || q || activeTag;

    let itemsHtml = filtered.map(it => {
      const done = !!state.bought[it.id];
      const tagInfo = TAGS[it.tag] || { label: it.tag, color: 'var(--muted)' };
      return `
        <div class="item-card ${done?'done':''} ${it.custom?'is-custom':''}" data-id="${it.id}">
          <div class="item-check ${done?'checked':''}" data-check="${it.id}">${done?'✓':''}</div>
          <div class="item-body">
            <div class="item-name">${escapeHtml(it.name)}</div>
            ${it.sub ? `<div class="item-sub">${escapeHtml(it.sub)}</div>` : ''}
            ${it.desc ? `<div class="item-desc">${escapeHtml(it.desc)}</div>` : ''}
            <div class="item-meta">
              ${it.price ? `<span class="item-price">${escapeHtml(it.price)}</span>` : ''}
              <span class="item-tag" style="background:${tagInfo.color};color:#fff;">${tagInfo.label}</span>
              ${it.custom ? `<span class="item-new">✨ 즉흥 추가</span>` : ''}
            </div>
          </div>
          <button class="item-del" data-del="${it.id}" title="삭제">✕</button>
        </div>`;
    }).join('');

    html += `
      <div class="cat-card ${isOpen?'open':''}" data-cat="${cat.id}">
        <div class="cat-header" style="background:${color};" data-toggle="${cat.id}">
          <div class="cat-icon">${cat.icon}</div>
          <div class="cat-name-wrap">
            <div class="cat-name">${cat.name}</div>
            <div class="cat-count">${filtered.length}개 · 구매완료 ${doneInCat}개</div>
          </div>
          <div class="cat-chevron">▼</div>
        </div>
        <div class="cat-body">
          <div class="howto-box"><strong>📍 가는 법</strong><br/>${escapeHtml(cat.howto)}</div>
          <div class="item-grid">${itemsHtml}</div>
          <div class="add-row">
            <div class="add-toggle" data-addtoggle="${cat.id}">+ 이 매장에 즉흥 추가하기</div>
            <div class="add-form" id="addform-${cat.id}">
              <input type="text" placeholder="상품명" id="addname-${cat.id}"/>
              <input type="text" placeholder="설명/메모 (선택)" id="adddesc-${cat.id}"/>
              <div class="add-form-row">
                <input type="text" placeholder="가격 (선택)" id="addprice-${cat.id}" style="flex:1;"/>
                <select id="addtag-${cat.id}">
                  ${Object.keys(TAGS).map(k=>`<option value="${k}">${TAGS[k].label}</option>`).join('')}
                </select>
              </div>
              <button class="add-btn" data-addsubmit="${cat.id}">추가하기</button>
            </div>
          </div>
        </div>
      </div>`;
  });

  if (!html) {
    html = `<div class="no-result">검색 결과가 없어요. 다른 키워드로 찾아보세요 🔍</div>`;
  }

  area.innerHTML = html;
  document.getElementById('statTotal').textContent = totalCount;
  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statCat').textContent = catCount;

  bindEvents();
}

function bindEvents() {
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.toggle;
      state.open[id] = !state.open[id];
      saveState();
      render();
    });
  });
  document.querySelectorAll('[data-check]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.check;
      state.bought[id] = !state.bought[id];
      saveState();
      render();
    });
  });
  document.querySelectorAll('[data-del]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.del;
      if (!confirm('이 항목을 목록에서 지울까요?')) return;
      state.hidden[id] = true;
      saveState();
      render();
    });
  });
  document.querySelectorAll('[data-addtoggle]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.addtoggle;
      const form = document.getElementById('addform-' + id);
      form.classList.toggle('open');
    });
  });
  document.querySelectorAll('[data-addsubmit]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const catId = el.dataset.addsubmit;
      const nameEl = document.getElementById('addname-' + catId);
      const name = nameEl.value.trim();
      if (!name) { nameEl.focus(); return; }
      const desc = document.getElementById('adddesc-' + catId).value.trim();
      const price = document.getElementById('addprice-' + catId).value.trim();
      const tag = document.getElementById('addtag-' + catId).value;
      if (!state.custom[catId]) state.custom[catId] = [];
      state.custom[catId].push({
        id: catId + '-c' + Date.now(),
        name, sub: '', desc, price, tag
      });
      state.open[catId] = true;
      saveState();
      render();
    });
  });
}

document.getElementById('searchBox').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

renderChips();
render();
</script>
</body>
</html>
