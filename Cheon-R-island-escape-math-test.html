<style>
:root{--ink:#16294D;--sky:#4FB3FF;--gold:#FFD23F;--gold2:#F2A900;--pink:#FF6FA8;--cream:#FFFDF2;--soft:#E3F1FF;--sub:#4A5E86;--ok:#12803F;--err:#D12B47;--warn:#C26A00;--sand:#F6D58E;--grass:#4CC24A;--game:Galmuri11,Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;font-size:15px;line-height:1.5}
body{background:linear-gradient(180deg,#4FB3FF 0,#9ED7FF 55%,#E3F5FF 100%) fixed;min-height:100vh}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
.title{text-align:center;margin:18px 0 8px}
.title small{display:block;font-size:11px;letter-spacing:4px;color:#fff;font-weight:900;text-shadow:0 2px 0 var(--ink)}
.title b{display:block;font-size:34px;font-weight:900;color:var(--gold);text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 5px 0 var(--ink),0 5px 0 2px var(--ink);line-height:1.2;padding-bottom:6px}
.title .unit{display:inline-block;margin-top:10px;padding:4px 14px;background:#fff;border:3px solid var(--ink);border-radius:999px;font-size:14px;font-weight:900;color:#10305e;box-shadow:0 3px 0 var(--ink)}
.title span{display:block;font-size:13px;color:#10305e;margin-top:8px;font-weight:800}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:8px;padding:14px;margin:14px 0;box-shadow:0 4px 0 var(--ink)}
.sub{color:var(--sub);font-size:13px}
h2{font-size:18px;margin:4px 0 6px;color:var(--ink)}
label{display:block;font-weight:800;margin:12px 0 5px;font-size:14px}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;padding:12px;border:3px solid var(--ink);border-radius:6px;font:inherit;background:#fff;color:var(--ink);min-height:46px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 4px rgba(255,210,63,.8)}
.btn{display:block;width:100%;min-height:50px;border:3px solid var(--ink);border-radius:6px;background:var(--gold);color:var(--ink);font:inherit;font-weight:900;font-size:16px;margin-top:14px;cursor:pointer;box-shadow:inset 3px 3px 0 rgba(255,255,255,.55),inset -3px -3px 0 rgba(0,0,0,.18),0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:inset 3px 3px 0 rgba(255,255,255,.55),inset -3px -3px 0 rgba(0,0,0,.18),0 1px 0 var(--ink)}
.btn:disabled{opacity:.5}
.btn.ghost{background:#fff;box-shadow:0 3px 0 var(--ink)}
.btn.go{background:#6BDB5A}
.btn.sos{background:#FFB3C7}
.btn.small{min-height:46px;font-size:14px;margin-top:10px}
.msg{margin-top:10px;font-size:13px;font-weight:800;line-height:1.5}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}.msg.slow{color:var(--warn)}
.chip{display:inline-block;border-radius:4px;padding:1px 9px;font-size:12px;font-weight:900;color:#fff;border:2px solid var(--ink)}
.pill{display:inline-block;border-radius:4px;padding:1px 8px;font-size:11px;font-weight:900;background:var(--soft);color:var(--ink);border:2px solid var(--ink)}
.hud{display:flex;align-items:center;gap:12px}
.av{width:58px;height:58px;border-radius:8px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--soft);flex:none;box-shadow:0 3px 0 var(--ink)}
.hi{flex:1;min-width:0}.hi b{font-size:17px}
.coin{display:inline-block;font-weight:900;font-size:17px;white-space:nowrap;background:var(--gold);border:3px solid var(--ink);border-radius:6px;padding:0 9px;box-shadow:0 2px 0 var(--ink)}
.bar{height:16px;border-radius:4px;background:#fff;border:3px solid var(--ink);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--pink) 0 10px,#ffb3d1 10px 12px);width:0;transition:width .5s}

.timer{margin-top:10px;text-align:center;font-family:var(--game);font-weight:900;font-size:18px;background:#fff;border:3px solid var(--ink);border-radius:6px;padding:4px 8px}
.timer.low{background:#FFD0D8;color:var(--err)}
.banner{display:flex;align-items:center;gap:10px;border-radius:8px;padding:12px;margin:12px 0;font-weight:800;cursor:pointer;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-family:var(--game)}
.banner.box{background:#FFF1B8}.banner.ok{background:#DDF5DD;cursor:default}.banner.bad{background:#FFD0D8;cursor:default}.banner.wait{background:#E3F1FF;cursor:default}
.back{background:none;border:0;color:#10305e;font:inherit;font-weight:900;min-height:44px;padding:0;cursor:pointer;font-family:var(--game)}
.rule{background:#FFF1B8;border:3px dashed var(--ink);border-radius:6px;padding:10px 12px;font-size:13px;margin:10px 0;font-weight:700}
.dl{text-align:left;max-height:42vh;overflow:auto;font-size:14px;line-height:1.6;background:var(--soft);border:3px solid var(--ink);border-radius:6px;padding:10px 12px;margin:8px 0}
.dl div{margin:3px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;border:2px solid var(--ink)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;gap:6px;background:#2E86DE;background-image:linear-gradient(rgba(255,255,255,.14) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.14) 2px,transparent 2px);background-size:32px 22px;border-top:10px solid #7FD0FF;box-shadow:0 -3px 0 var(--ink);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}

#tabs button b{display:block;font-size:20px}

#modal{position:fixed;inset:0;z-index:20;background:rgba(22,41,77,.62);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .mb{width:100%;max-width:430px;max-height:92vh;overflow:auto;background:var(--cream);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:10px;padding:18px;text-align:center}
#modal .mb.pop{display:flex;flex-direction:column;overflow:hidden;animation:popin .25s steps(5)}
#modal .mb.pop .pb2{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:15px;line-height:1.7;text-align:center}
#modal .mb.pop h2,#modal .mb.pop .btn,#modal .mb.pop>div:first-child{flex:none}
.pop h2{font-size:21px;margin:6px 0 8px}
@keyframes popin{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;background:var(--gold);color:var(--ink);font-weight:900;padding:10px 18px;border-radius:6px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:opacity .3s;max-width:90%;text-align:center;font-family:var(--game)}
.hide{display:none!important}
details{background:var(--cream);border:3px solid var(--ink);border-radius:8px;margin:12px 0;padding:0 14px;box-shadow:0 4px 0 var(--ink)}
summary{min-height:50px;display:flex;align-items:center;font-weight:900;cursor:pointer;font-family:var(--game)}
details .gb{padding:0 0 12px;font-size:14px}details .gb li{margin:5px 0}
footer{text-align:center;color:#10305e;font-size:12px;margin-top:22px;font-weight:700}
footer a{color:var(--ink);font-weight:900}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}
.ch{aspect-ratio:1;border-radius:8px;border:3px solid var(--ink);background:#fff;font-size:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:64px;box-shadow:0 3px 0 var(--ink)}
.ch small{font-size:11px;color:var(--sub);font-weight:800}
.ch.on{background:var(--gold);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.tb{min-height:60px;border-radius:8px;border:3px solid var(--ink);background:#fff;font:inherit;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:space-between;padding:6px 14px;font-family:var(--game)}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tb small{font-size:12px;color:var(--sub);font-family:Pretendard,sans-serif;font-weight:800}
.tb.full{opacity:.45}
.shead{display:flex;gap:12px;align-items:center;margin-top:4px}
.shead .sic{width:54px;height:54px;border-radius:6px;border:3px solid var(--ink);background:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none}
.shead b{display:block;font-size:19px;font-family:var(--game)}
.shead small{display:block;font-weight:800;opacity:.8}

/* ===== 섬 장면 ===== */
.scene{position:relative;width:100%;aspect-ratio:100/72;border:4px solid var(--ink);border-radius:8px;box-shadow:0 5px 0 var(--ink);overflow:hidden;background:#3FA4F5;margin:14px 0}
.scene svg.bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.dec{position:absolute;transform:translate(-50%,-50%);font-size:clamp(16px,5vw,24px);pointer-events:none;z-index:1}
.fl{animation:flt 3s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-62%)}}
.spot{position:absolute;transform:translate(-50%,-50%);width:70px;margin:0;padding:0;background:none;border:0;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;z-index:2}
.spot .nd{position:relative;width:46px;height:46px;border-radius:6px;border:3px solid var(--ink);background:#FFE08A;box-shadow:inset 3px 3px 0 rgba(255,255,255,.55),inset -3px -3px 0 rgba(0,0,0,.25),0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-size:23px}
.spot:active .nd{transform:translateY(3px)}
.spot.clear .nd{background:#9BE59A}.spot.lock .nd{background:#B9B7C9}.spot.lock .ic{opacity:.3;filter:grayscale(1)}
.spot .ck,.spot .lk{display:none;position:absolute;font-style:normal}
.spot .ck{right:-9px;top:-9px;width:22px;height:22px;border-radius:4px;background:#6BDB5A;border:3px solid var(--ink);font-size:12px;font-weight:900;align-items:center;justify-content:center}
.spot.clear .ck{display:flex}.spot.lock .lk{display:block;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px}
.spot .lb{margin-top:5px;background:#fff;border:2px solid var(--ink);border-radius:4px;padding:0 5px;font-size:10px;font-weight:900;white-space:nowrap;font-family:var(--game);box-shadow:0 2px 0 var(--ink)}
.spot.next .nd{animation:bump 1s steps(2) infinite}
@keyframes bump{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ship{position:absolute;transform:translate(-50%,-50%);font-size:clamp(28px,9vw,44px);z-index:3;transition:left 3.2s ease-in;animation:rock 2s ease-in-out infinite}
@keyframes rock{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.pc{position:absolute;transform:translate(-50%,-100%);transition:left 1.2s ease,top 1.2s ease;font-size:clamp(20px,6.4vw,28px);line-height:1;text-align:center;pointer-events:none;z-index:5}
.pc .pn{display:block;font-size:10px;font-family:var(--game);background:#fff;border:2px solid var(--ink);border-radius:4px;padding:0 3px;white-space:nowrap;margin-top:2px;max-width:62px;overflow:hidden;text-overflow:ellipsis}
.pc.me .pn{background:var(--gold)}
.btabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.btabs button{font-family:var(--game);font-weight:900;font-size:13px;min-height:44px;padding:4px 12px;border:3px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.btabs button.on{background:var(--gold)}.btabs button.off{opacity:.5}
.bd .mrow{flex-wrap:wrap}.mrow.stuck{background:#FFF3B0;border-radius:6px;padding:3px 5px}
#bscene .spot{pointer-events:none}
.escb{position:absolute;left:50%;top:12%;transform:translateX(-50%);z-index:8;white-space:nowrap;background:var(--gold);border:3px solid var(--ink);border-radius:8px;padding:6px 12px;font-family:var(--game);font-weight:900;font-size:14px;color:var(--ink);box-shadow:0 3px 0 var(--ink);animation:escpop .5s ease both}
@keyframes escpop{from{opacity:0;transform:translateX(-50%) scale(.4)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.ship .bub{position:absolute;right:0;bottom:calc(100% + 4px);white-space:nowrap;background:#fff;border:3px solid var(--ink);border-radius:6px;padding:2px 7px;font-size:12px;font-family:var(--game);font-weight:900;color:var(--ink)}
.bdc{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:95;width:min(92vw,560px);background:var(--gold);border:4px solid var(--ink);border-radius:12px;padding:18px 14px;text-align:center;box-shadow:0 6px 0 var(--ink);font-family:var(--game);color:var(--ink);animation:escpop .5s ease both}
.bdc .bdt{font-size:clamp(22px,6vw,34px);font-weight:900}.bdc .bdt2{font-size:clamp(26px,7.5vw,42px);font-weight:900;margin-top:4px}.bdc .bds{margin-top:8px;font-size:clamp(13px,3.6vw,18px);font-weight:800}
.cft{position:fixed;top:-40px;font-size:24px;z-index:90;pointer-events:none;animation:cft 3s linear forwards}
@keyframes cft{to{transform:translateY(112vh) rotate(420deg)}}
.pc.hop{animation:hop .4s ease-in-out 3}
.pc .bub{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:var(--gold);border:3px solid var(--ink);border-radius:6px;padding:2px 7px;font-size:12px;font-family:var(--game);font-weight:900;color:var(--ink);z-index:9;animation:bubin .3s ease}
@keyframes bubin{from{opacity:0;transform:translateX(-50%) scale(.5)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.ftp{position:absolute;width:9px;height:9px;margin:-4px 0 0 -4px;background:#fff;border:2px solid var(--ink);border-radius:2px;z-index:4;pointer-events:none;opacity:0;animation:ftp 1.9s ease both}
@keyframes ftp{0%{opacity:0;transform:scale(0)}12%{opacity:1;transform:scale(1.25)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes hop{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-175%)}}
.pc.sail{transition:left 3.2s ease-in,top 1.2s ease}
.pc .sb{display:none;position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-style:normal;font-size:16px;animation:blink .8s steps(2) infinite}
.pc.sos .sb{display:block}
@keyframes blink{50%{opacity:.25}}
.mrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px;font-weight:800}
.mrow .mn{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pips{display:flex;gap:3px}.pips i{width:12px;height:12px;border-radius:2px;border:2px solid var(--ink);background:#fff}.pips i.d{background:#6BDB5A}
.hcard{background:#fff;border:3px solid var(--ink);border-radius:6px;padding:9px 11px;margin:8px 0;font-size:14px}
.hcard b{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
.qtext{font-size:17px;font-weight:700;line-height:1.7;white-space:pre-wrap;margin:6px 0 10px}
.chc{display:block;width:100%;text-align:left;min-height:50px;border:3px solid var(--ink);border-radius:6px;background:#fff;font:inherit;font-weight:700;font-size:15px;padding:8px 12px;margin:8px 0;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.chc b{display:inline-block;width:26px;font-size:17px}
.chc.on{background:var(--gold)}
.chc:disabled{opacity:.6}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.bx{aspect-ratio:1;border-radius:6px;border:3px solid var(--ink);box-shadow:inset 4px 4px 0 rgba(255,255,255,.5),inset -4px -4px 0 rgba(0,0,0,.2),0 3px 0 var(--ink);background:var(--gold);font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:56px;animation:wob 1.6s ease-in-out infinite}
.bx:nth-child(2){animation-delay:.2s}.bx:nth-child(3){animation-delay:.4s}.bx:nth-child(4){animation-delay:.6s}.bx:nth-child(5){animation-delay:.8s}
.bx.pick{background:#6BDB5A;animation:none;transform:scale(1.1)}.bx.dim{opacity:.55;animation:none;cursor:default}
@keyframes wob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.rk{display:flex;gap:10px;align-items:flex-start}.rk .rn{font-size:26px;width:38px;text-align:center;font-weight:900;flex:none}
.rk.mine{background:#FFF0F7;box-shadow:0 4px 0 var(--pink),0 0 0 3px var(--pink)}
.rk .coin{font-size:16px}
.te{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
.te .nm{flex:1;min-width:110px;font-weight:800}
.te select{width:auto;min-height:42px;padding:6px}

.row2{display:flex;gap:8px}.row2>*{flex:1}

.pw{-webkit-text-security:disc}

<script type="text/plain" id="gassrc">
/**
 * 섬탈출원정대 GAS (Cheon-R-island-escape-math-test.gs)
 *
 * [설치]
 * 1) 구글 시트를 하나 만들고 확장 프로그램 > Apps Script 에 이 코드를 통째로 붙여넣기
 * 2) 함수 목록에서 setup 을 한 번 실행 (권한 허용) -> 시트 탭 6개가 자동으로 생겨요
 * 3) 배포 > 새 배포 > 웹 앱 (실행: 나 / 액세스: 모든 사용자)
 *    * 코드를 고친 뒤에는 반드시 [배포 관리 > 수정 > 새 버전]으로 재배포 (새 배포 금지)
 * 4) 학생 링크:  앱주소.html?gas=웹앱주소
 *
 * [시트 탭]
 *  참가자   : 입장한 사람 (조/이름/캐릭터/코인/열쇠/도움중 + 문항별 완료·오답·힌트받음)
 *  풀이기록 : 제출할 때마다 한 줄 (정답/오답)
 *  힌트     : 조원 힌트 + 담임 힌트 쪽지
 *  도움요청 : 도움 요청 기록
 *  상자     : 보석함 결과
 *  조설정   : 섬 이름 변경 + 탈출 시각
 *
 * 이 앱의 정답·힌트는 HTML 파일의 QUESTIONS 에 있어요 (GAS는 기록과 공유만 담당).
 * 관리자 입장코드: 처음엔 mathtest -> 관리자 화면에서 각자 바꿔요 (바뀐 값은 스크립트 속성 ADMIN_CODE 에 저장)
 *   * 코드를 잊었다면: Apps Script > 프로젝트 설정 > 스크립트 속성에서 ADMIN_CODE 를 지우면 mathtest 로 돌아가요
 */
var SH_P = '참가자', SH_LOG = '풀이기록', SH_H = '힌트', SH_R = '도움요청', SH_B = '상자', SH_T = '조설정';
var NQ = 5;                    // 문제 수 (HTML의 QUESTIONS 개수와 같아야 해요)
var MAX_TEAM = 6;              // 조당 최대 인원
var TEAMS = [1, 2, 3, 4, 5];
var ISLAND_DEFAULT = { 1: '🐢 거북이섬', 2: '🌴 야자섬', 3: '🌋 화산섬', 4: '🐠 산호섬', 5: '🐚 조개섬' };
var ADMIN_CODE = 'mathtest';   // 처음 입장코드 (관리자 화면에서 각자 바꾸면 스크립트 속성 ADMIN_CODE에 저장돼요)
var CHARS = ['🦊', '🐯', '🐻', '🐼', '🐰', '🐸', '🦁', '🐧', '🐶', '🐱', '🐹', '🐨', '🐵', '🐔', '🦄', '🐙', '🦖', '🐳', '🦋', '🐢'];
var COIN_BASE = 10, COIN_FIRST = 5, COIN_HINT_PENALTY = 2, COIN_MIN = 5, COIN_HELP = 5, DOUBLE_CAP = 30;
var BOX_CODES = ['X', '5', '10', '20', 'D'];

var B_H = ['상자ID', '키', '문항', '상자1', '상자2', '상자3', '상자4', '상자5', '선택', '획득코인', '시각'];
var LOG_H = ['시각', '조', '이름', '문항', '결과', '획득코인'];
var H_H = ['ID', '시각', '조', '보낸이', '받는이', '문항', '종류', '내용', '감사'];
var R_H = ['ID', '시각', '조', '요청자', '문항', '종류', '상태'];
var T_H = ['조', '섬이름', '탈출시각ms', '탈출시각'];
function pHeaders_() {
  var h = ['키', '조', '이름', '캐릭터', '코인', '열쇠', '도움중', '입장시각', '갱신'];
  for (var i = 1; i <= NQ; i++) { h.push('Q' + i + '_완료'); h.push('Q' + i + '_오답'); h.push('Q' + i + '_힌트받음'); }
  return h;
}

/* ===== 공통 ===== */
function nowKST_() { return Utilities.formatDate(new Date(), 'Asia/Seoul', 'yyyy-MM-dd HH:mm:ss'); }
function num_(v) { var n = parseInt(String(v).replace(/[^0-9]/g, ''), 10); return isNaN(n) ? 0 : n; }
function clean_(v, n) { return String(v == null ? '' : v).replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, n); }
function key_(t, n) { return 'T' + num_(t) + '_' + clean_(n, 10); }
function props_() { return PropertiesService.getScriptProperties(); }
function pwDefault_() { return !props_().getProperty('ADMIN_CODE'); }
function adminOk_(code) { return String(code || '') === (props_().getProperty('ADMIN_CODE') || ADMIN_CODE); }
function sheet_(name, headers) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  if (sh.getLastRow() === 0) {
    if (name === SH_P) sh.getRange(1, 1, sh.getMaxRows(), 3).setNumberFormat('@');   // 키·이름이 날짜로 바뀌지 않게
    sh.getRange(1, 1, 1, headers.length).setValues([headers]).setFontWeight('bold').setBackground('#dff0ff');
    sh.setFrozenRows(1);
  }
  return sh;
}
function setup() {
  sheet_(SH_P, pHeaders_()); sheet_(SH_LOG, LOG_H); sheet_(SH_H, H_H); sheet_(SH_R, R_H); sheet_(SH_B, B_H); sheet_(SH_T, T_H);
  return 'OK';
}
function jsonp_(cb, obj) {
  var txt = JSON.stringify(obj);
  if (cb && /^[A-Za-z0-9_]+$/.test(cb)) return ContentService.createTextOutput(cb + '(' + txt + ')').setMimeType(ContentService.MimeType.JAVASCRIPT);
  return ContentService.createTextOutput(txt).setMimeType(ContentService.MimeType.JSON);
}
function withLock_(fn) {
  var lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try { return fn(); } finally { try { lock.releaseLock(); } catch (x) {} }
}
function bust_() { try { CacheService.getScriptCache().remove('snap'); } catch (e) {} }
function shuffle_(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function nextId_(sh) {
  var last = sh.getLastRow();
  if (last < 2) return 1;
  return num_(sh.getRange(last, 1, 1, 1).getValues()[0][0]) + 1;
}

/* ===== 게임 시간·설정 ===== */
function game_() {
  var pr = props_(), st = Number(pr.getProperty('START')) || 0, dur = Number(pr.getProperty('DUR'));
  if (!(dur > 0)) dur = 15;
  var now = Date.now(), end = st ? st + dur * 60000 : 0;
  return { phase: !st ? 'ready' : (now > end ? 'over' : 'running'), startAt: st, endAt: end, durationMin: Math.round(dur * 10) / 10 };
}
function cfg_() {
  var pr = props_();
  return { always: pr.getProperty('ALWAYS') === '1', minTeam: Math.max(1, num_(pr.getProperty('MINTEAM')) || 2) };
}

/* ===== 시트 읽기·쓰기 ===== */
function readP_() {
  var H = pHeaders_(), sh = sheet_(SH_P, H), last = sh.getLastRow(), list = [];
  if (last >= 2) {
    var v = sh.getRange(2, 1, last - 1, H.length).getValues();
    for (var i = 0; i < v.length; i++) {
      var r = v[i];
      if (!r[0]) continue;
      var p = { row: i + 2, key: String(r[0]), team: num_(r[1]), name: String(r[2]), ch: String(r[3] || ''), coins: Number(r[4]) || 0, hasKey: String(r[5]) === 'O', helping: num_(r[6]), joined: String(r[7]), done: [], wrong: [], hinted: [] };
      for (var q = 0; q < NQ; q++) { p.done.push(String(r[9 + q * 3]) === 'O'); p.wrong.push(num_(r[10 + q * 3])); p.hinted.push(num_(r[11 + q * 3])); }
      list.push(p);
    }
  }
  return { sh: sh, list: list };
}
function pRow_(p) {
  var r = [p.key, p.team, p.name, p.ch, p.coins, p.hasKey ? 'O' : '', p.helping || '', p.joined, nowKST_()];
  for (var q = 0; q < NQ; q++) { r.push(p.done[q] ? 'O' : ''); r.push(p.wrong[q] || 0); r.push(p.hinted[q] || 0); }
  return r;
}
function saveP_(sh, p) { var r = pRow_(p); sh.getRange(p.row, 1, 1, r.length).setValues([r]); }
function findP_(list, key) { for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i]; return null; }
function newP_(team, name) {
  var p = { key: key_(team, name), team: team, name: clean_(name, 10), ch: '', coins: 0, hasKey: false, helping: 0, joined: nowKST_(), done: [], wrong: [], hinted: [] };
  for (var q = 0; q < NQ; q++) { p.done.push(false); p.wrong.push(0); p.hinted.push(0); }
  return p;
}
function readH_() {
  var sh = sheet_(SH_H, H_H), last = sh.getLastRow(), list = [];
  if (last >= 2) {
    var v = sh.getRange(2, 1, last - 1, H_H.length).getValues();
    for (var i = 0; i < v.length; i++) {
      var r = v[i];
      list.push({ row: i + 2, id: num_(r[0]), t: String(r[1]), team: num_(r[2]), from: String(r[3]), to: String(r[4]), q: num_(r[5]), kind: String(r[6]), text: String(r[7]), thanks: String(r[8]) === 'O' });
    }
  }
  return { sh: sh, list: list };
}
function readR_() {
  var sh = sheet_(SH_R, R_H), last = sh.getLastRow(), list = [];
  if (last >= 2) {
    var v = sh.getRange(2, 1, last - 1, R_H.length).getValues();
    for (var i = 0; i < v.length; i++) { var r = v[i]; list.push({ row: i + 2, id: num_(r[0]), t: String(r[1]), team: num_(r[2]), name: String(r[3]), q: num_(r[4]), kind: String(r[5]), status: String(r[6]) }); }
  }
  return { sh: sh, list: list };
}
function readB_() {
  var sh = sheet_(SH_B, B_H), last = sh.getLastRow(), list = [];
  if (last >= 2) {
    var v = sh.getRange(2, 1, last - 1, B_H.length).getValues();
    for (var i = 0; i < v.length; i++) {
      var r = v[i];
      list.push({ row: i + 2, id: String(r[0]), key: String(r[1]), q: num_(r[2]), codes: [r[3], r[4], r[5], r[6], r[7]].map(String), pick: String(r[8]), gained: Number(r[9]) || 0 });
    }
  }
  return { sh: sh, list: list };
}
function readT_() {
  var sh = sheet_(SH_T, T_H), last = sh.getLastRow(), map = {};
  if (last >= 2) {
    var v = sh.getRange(2, 1, last - 1, 4).getValues();
    for (var i = 0; i < v.length; i++) { var t = num_(v[i][0]); if (t) map[t] = { row: i + 2, label: String(v[i][1] || ''), esc: Number(v[i][2]) || 0 }; }
  }
  return { sh: sh, map: map };
}
function upsertT_(T, t, label, esc) {
  var cur = T.map[t];
  var lab = label != null ? label : (cur ? cur.label : '');
  var e = esc != null ? esc : (cur ? cur.esc : 0);
  var row = [t, lab, e || '', e ? Utilities.formatDate(new Date(e), 'Asia/Seoul', 'HH:mm:ss') : ''];
  if (cur) { T.sh.getRange(cur.row, 1, 1, 4).setValues([row]); cur.label = lab; cur.esc = e; }
  else { T.sh.appendRow(row); T.map[t] = { row: T.sh.getLastRow(), label: lab, esc: e }; }
}
function labelOf_(T, t) { return (T[t] && T[t].label) || ISLAND_DEFAULT[t] || (t + '조'); }

/* 읽기용 스냅샷 (4초 캐시: 학생 20명이 5초마다 불러도 시트를 덜 읽게) */
function snap_() {
  var c = CacheService.getScriptCache(), hit = c.get('snap');
  if (hit) { try { return JSON.parse(hit); } catch (e) {} }
  var T = readT_().map, tt = {};
  Object.keys(T).forEach(function (k) { tt[k] = { label: T[k].label, esc: T[k].esc }; });
  var pend = readB_().list.filter(function (b) { return b.pick === ''; }).map(function (b) { return { id: b.id, key: b.key, q: b.q }; });
  var s = { P: readP_().list, H: readH_().list, R: readR_().list.slice(-60), T: tt, B: pend };
  try { c.put('snap', JSON.stringify(s), 4); } catch (e) {}
  return s;
}

/* ===== 보드 ===== */
function board_(s) {
  var tm = {};
  s.P.forEach(function (pl) {
    var t = tm[pl.team] || (tm[pl.team] = { team: pl.team, n: 0, coins: 0, solved: 0 });
    t.n++; t.coins += pl.coins;
    pl.done.forEach(function (d) { if (d) t.solved++; });
  });
  return Object.keys(tm).map(function (k) {
    var t = tm[k], info = s.T[t.team] || {};
    return { team: t.team, label: labelOf_(s.T, t.team), n: t.n, avg: Math.round(t.coins / t.n * 10) / 10, progress: Math.round(t.solved / (t.n * NQ) * 100), escapedAt: info.esc || 0 };
  });
}
function pubP_(p) { return { name: p.name, ch: p.ch, coins: p.coins, hasKey: p.hasKey, helping: p.helping, done: p.done }; }

/* ===== 조회 ===== */
function lobby_() {
  var s = snap_(), cnt = {};
  s.P.forEach(function (p) { cnt[p.team] = (cnt[p.team] || 0) + 1; });
  return { ok: true, now: Date.now(), game: game_(), teams: TEAMS.map(function (t) { return { team: t, label: labelOf_(s.T, t), n: cnt[t] || 0, max: MAX_TEAM }; }) };
}
function state_(p) {
  var s = snap_(), team = num_(p.team), key = key_(team, p.name), me = null, members = [];
  s.P.forEach(function (x) { if (x.key === key) me = x; if (x.team === team) members.push(x); });
  if (!me) return { ok: false, gone: true, error: '명단에 없어요. 다시 입장해 주세요' };
  var info = s.T[team] || {};
  var recv = [], sent = [];
  s.H.forEach(function (h) {
    if (h.team !== team) return;
    if (h.to === me.name) recv.push({ id: h.id, t: h.t, from: h.from, q: h.q, kind: h.kind, text: h.text, thanks: h.thanks });
    if (h.from === me.name && h.kind === '조원') sent.push({ id: h.id, to: h.to, q: h.q, thanks: h.thanks });
  });
  return {
    ok: true, now: Date.now(), game: game_(), cfg: cfg_(),
    me: { key: me.key, name: me.name, team: team, ch: me.ch, coins: me.coins, hasKey: me.hasKey, helping: me.helping, done: me.done, wrong: me.wrong, hinted: me.hinted },
    team: { team: team, label: labelOf_(s.T, team), leader: members[0] ? members[0].name : '', escapedAt: info.esc || 0, members: members.map(pubP_) },
    hints: { recv: recv, sent: sent },
    boxes: s.B.filter(function (b) { return b.key === key; }),
    board: board_(s)
  };
}

/* ===== 입장·캐릭터 ===== */
function join_(p) {
  var team = num_(p.team), name = clean_(p.name, 10);
  if (TEAMS.indexOf(team) < 0) return { ok: false, error: '조를 다시 골라 주세요' };
  if (!name) return { ok: false, error: '이름을 입력해 주세요' };
  var R = readP_(), key = key_(team, name), ex = findP_(R.list, key), cnt = 0;
  R.list.forEach(function (x) { if (x.team === team) cnt++; });
  if (ex) {
    if (String(p.confirm) !== '1') return { ok: true, exists: true };
    return { ok: true, rejoin: true, ch: ex.ch };
  }
  if (cnt >= MAX_TEAM) return { ok: false, error: '이 섬은 가득 찼어요 (최대 ' + MAX_TEAM + '명). 다른 조를 골라 주세요' };
  R.sh.appendRow(pRow_(newP_(team, name)));
  return { ok: true, created: true, ch: '' };
}
function cancelBoxes_(key) {
  var B = readB_();
  B.list.forEach(function (b) { if (b.key === key && b.pick === '') B.sh.getRange(b.row, 9).setValue('취소'); });
}
function leave_(p) {
  var R = readP_(), key = key_(p.team, p.name), x = findP_(R.list, key);
  if (x) { R.sh.deleteRow(x.row); cancelBoxes_(key); }
  return { ok: true };
}
function setchar_(p) {
  if (CHARS.indexOf(String(p.char)) < 0) return { ok: false, error: '캐릭터 오류' };
  var R = readP_(), x = findP_(R.list, key_(p.team, p.name));
  if (!x) return { ok: false, gone: true, error: '다시 입장해 주세요' };
  x.ch = String(p.char); saveP_(R.sh, x);
  return { ok: true };
}
function setisland_(p) {
  var R = readP_(), team = num_(p.team), mem = R.list.filter(function (x) { return x.team === team; });
  var isAdmin = adminOk_(p.code);
  if (!isAdmin && !(mem[0] && mem[0].name === clean_(p.name, 10))) return { ok: false, error: '섬 이름은 조장(처음 입장한 사람)만 바꿀 수 있어요' };
  var label = clean_(p.label, 12);
  var T = readT_();
  upsertT_(T, team, label || ISLAND_DEFAULT[team] || '', null);
  return { ok: true, label: label };
}

/* ===== 풀이 결과 ===== */
function resolveReq_(team, name, q) {
  var Rq = readR_();
  Rq.list.forEach(function (r) { if (r.team === team && r.name === name && r.q === q && r.status === '대기') Rq.sh.getRange(r.row, 7).setValue('해결'); });
}
function checkEscape_(team) {
  var R = readP_(), mem = R.list.filter(function (x) { return x.team === team; }), T = readT_();
  if (T.map[team] && T.map[team].esc) return 0;
  if (mem.length < cfg_().minTeam) return 0;
  for (var i = 0; i < mem.length; i++) if (!mem[i].hasKey) return 0;
  var now = Date.now();
  upsertT_(T, team, null, now);
  return now;
}
function result_(p) {
  var g = game_();
  if (g.phase !== 'running') return { ok: false, error: g.phase === 'ready' ? '아직 시작 전이에요. 아듬샘의 시작 신호를 기다려 주세요' : '시간이 끝났어요 🌊' };
  var R = readP_(), team = num_(p.team), pl = findP_(R.list, key_(team, p.name));
  if (!pl) return { ok: false, gone: true, error: '다시 입장해 주세요' };
  var q = num_(p.q);
  if (q < 1 || q > NQ) return { ok: false, error: '문항 오류' };
  if (pl.done[q - 1]) return { ok: true, already: true, coins: pl.coins };
  if (q > 1 && !pl.done[q - 2]) return { ok: false, error: '앞 문제를 먼저 풀어야 해요' };
  var correct = String(p.correct) === '1';
  var lg = sheet_(SH_LOG, LOG_H);
  if (!correct) {
    pl.wrong[q - 1]++;
    saveP_(R.sh, pl);
    lg.appendRow([nowKST_(), team, pl.name, q, '오답', 0]);
    return { ok: true, correct: false, wrong: pl.wrong[q - 1] };
  }
  var first = pl.wrong[q - 1] === 0 && pl.hinted[q - 1] === 0;
  var gained = Math.max(COIN_MIN, COIN_BASE + (first ? COIN_FIRST : 0) - COIN_HINT_PENALTY * pl.hinted[q - 1]);
  pl.done[q - 1] = true; pl.coins += gained;
  if (pl.helping === q) pl.helping = 0;
  if (q === NQ) pl.hasKey = true;
  saveP_(R.sh, pl);
  lg.appendRow([nowKST_(), team, pl.name, q, '정답', gained]);
  resolveReq_(team, pl.name, q);
  var boxId = pl.key + '_' + q, codes = shuffle_(BOX_CODES.slice()), B = readB_(), dup = false;
  B.list.forEach(function (b) { if (b.id === boxId) dup = true; });
  if (!dup) B.sh.appendRow([boxId, pl.key, q, codes[0], codes[1], codes[2], codes[3], codes[4], '', '', nowKST_()]);
  var esc = (q === NQ) ? checkEscape_(team) : 0;
  return { ok: true, correct: true, gained: gained, coins: pl.coins, boxId: dup ? '' : boxId, key: q === NQ, escaped: esc > 0 };
}

/* ===== 도움 요청 · 힌트 ===== */
function help_(p) {
  var R = readP_(), team = num_(p.team), me = findP_(R.list, key_(team, p.name));
  if (!me) return { ok: false, gone: true, error: '다시 입장해 주세요' };
  var q = num_(p.q);
  if (q < 1 || q > NQ) return { ok: false, error: '문항 오류' };
  if (me.done[q - 1]) return { ok: false, error: '이미 푼 문제예요' };
  var solvers = R.list.filter(function (x) { return x.team === team && x.name !== me.name && x.done[q - 1]; }).length;
  var Rq = readR_();
  if (String(p.mode) === 'team') {
    if (!solvers) return { ok: false, code: 'nosolver' };
    me.helping = q; saveP_(R.sh, me);
    Rq.sh.appendRow([nextId_(Rq.sh), nowKST_(), team, me.name, q, '조원', '대기']);
    return { ok: true };
  }
  // 담임 힌트
  var cf = cfg_();
  if (solvers && !cf.always) return { ok: false, code: 'blocked', solvers: solvers };
  if (solvers && String(p.force) !== '1') return { ok: false, code: 'confirm', solvers: solvers };
  var text = clean_(p.text, 200);
  if (!text) return { ok: false, error: '힌트 내용이 없어요' };
  var H = readH_();
  H.sh.appendRow([nextId_(H.sh), nowKST_(), team, '담임', me.name, q, '담임', text, '']);
  me.hinted[q - 1]++; saveP_(R.sh, me);
  Rq.sh.appendRow([nextId_(Rq.sh), nowKST_(), team, me.name, q, '담임', '처리']);
  return { ok: true };
}
function hint_(p) {
  var R = readP_(), team = num_(p.team), me = findP_(R.list, key_(team, p.name)), to = findP_(R.list, key_(team, p.to));

function openbox_(p) {

function leaks(text,qn){
 var Q=QUESTIONS[qn-1],t=String(text||'').replace(/\s+/g,'');
 if(!t)return false;
 var i;
 if(Q.type==='choice'){
  var c=CIRC[Q.ans-1],n=String(Q.ans);
  if(t.indexOf(c)>-1)return true;
  if(new RegExp('(^|[^0-9])'+n+'번').test(t))return true;
  if(new RegExp('(답|정답).{0,6}('+c+'|'+n+')').test(t))return true;
  if(new RegExp('^[^가-힣0-9]*'+n+'[^가-힣0-9]*$').test(t))return true;
  var ct=String(Q.choices[Q.ans-1]).replace(/\s+/g,'');
  if(ct.length>=2&&t.indexOf(ct)>-1)return true;
 }else{
  if(new RegExp('(답|정답)(은|는|이)?[:=]?'+Q.ans+'(개|가지)?').test(t))return true;
  if(t===Q.ans)return true;
 }
 for(i=0;Q.leak&&i<Q.leak.length;i++)if(Q.leak[i].test(t))return true;
 return false;}
function checkAnswer(Q,val){
 if(Q.type==='choice')return Number(val)===Q.ans;
 var v=String(val).replace(/\s+/g,'').replace(/[개가지번]/g,'');
 if(v===Q.ans)return true;
 for(var i=0;Q.alts&&i<Q.alts.length;i++)if(String(Q.alts[i]).replace(/\s+/g,'').replace(/[개가지번]/g,'')===v)return true;
 return false;}

function islandSvg(){
 var cx=25,cy=18.2,o='<svg class="bg" viewBox="0 0 100 72" preserveAspectRatio="none" shape-rendering="crispEdges"><rect width="100" height="72" fill="#3FA4F5"/>';
 for(var y=0;y<36;y++){
  var run=null,rs=0;
  for(var x=0;x<=50;x++){
   var c=null;
   if(x<50){
    var dx=x+.5-cx,dy=y+.5-cy,ang=Math.atan2(dy,dx),j=1+.07*Math.sin(ang*5+1)+.05*Math.cos(ang*3);
    var r2=(dx/22)*(dx/22)+(dy/14.5)*(dy/14.5),g2=(dx/17.5)*(dx/17.5)+(dy/10.8)*(dy/10.8);
    if(g2<=j*j*.98)c=((x+y)%7===0)?'#3FAE3E':'#4CC24A';
    else if(r2<=j*j)c=((x*3+y*5)%13===0)?'#E9C46A':'#F6D58E';
    else if(r2<=j*j*1.35)c='#6CC6FF';
    else if(((x*5+y*3)%9===0)&&y%2===0)c='#5DB1FA';
   }
   if(c!==run){if(run)o+='<rect x="'+rs*2+'" y="'+y*2+'" width="'+(x-rs)*2+'" height="2" fill="'+run+'"/>';run=c;rs=x;}
  }
 }
 o+='<rect x="72" y="60" width="22" height="3" fill="#B9743A"/><rect x="72" y="62" width="22" height="1" fill="#8F5628"/><rect x="74" y="63" width="2" height="4" fill="#8F5628"/><rect x="84" y="63" width="2" height="4" fill="#8F5628"/><rect x="92" y="63" width="2" height="4" fill="#8F5628"/></svg>';
 return o;}

 [['🐟',7,12],['🐋',90,14],['🌊',8,90],['🌊',50,92]].forEach(function(d){h+='<span class="dec fl" style="left:'+d[1]+'%;top:'+d[2]+'%">'+d[0]+'</span>';});

function updateScene(){
 var T=ST.team,box=$('pcs'),ship=$('ship');if(!box)return;
 var esc_=!!T.escapedAt&&!ESCHOLD,groups={};
 T.members.forEach(function(m){var sp=esc_?0:(HOLD[m.name]||Math.min(doneCount(m)+1,NQ));(groups[sp]=groups[sp]||[]).push(m);});
 var seen={},sx=SAIL.go?132:SHIP_X;
 if(ship)ship.style.left=(esc_?sx:SHIP_X)+'%';
 Object.keys(groups).forEach(function(sp){
  var arr=groups[sp];
  arr.forEach(function(m,j){
   var pos=sp==='0'?{x:sx+(j-(arr.length-1)/2)*5,y:SHIP_Y-6}:spotPos(Number(sp),j,arr.length);
   var el=PCN[m.name];if(!el){el=document.createElement('div');box.appendChild(el);PCN[m.name]=el;}
   el.className='pc'+(m.name===ST.me.name?' me':'')+(m.helping?' sos':'')+(esc_?' sail':'')+(el._hop?' hop':'');

   seen[m.name]=1;});});

function renderQuestion(q){
 view='q';curQ=q;QSEL=0;setTabs(true);var Q=QUESTIONS[q-1];

 bindDemoBar();
 $('bk').onclick=function(){renderIsland();};
 qsa('.chc').forEach(function(b){b.onclick=function(){if(ST.me.done[q-1])return;QSEL=Number(b.getAttribute('data-i'));qsa('.chc').forEach(function(x){x.classList.toggle('on',x===b);});};});
 if($('qin'))$('qin').addEventListener('keydown',function(e){if(e.key==='Enter')doSubmit(q);});
 paintQ();}
function paintQ(){
 if(view!=='q'||!ST||!$('qgo'))return;

 $('qmeta').innerHTML=done?'✅ 클리어한 문제예요!':('틀린 횟수 '+me.wrong[q-1]+'번'+(ph==='ready'?' · ⏳ 시작 전이에요':(ph==='over'?' · ⌛ 시간 종료':'')));
 if(done){
  qsa('.chc').forEach(function(b){b.disabled=true;b.classList.toggle('on',Number(b.getAttribute('data-i'))===Q.ans);});
  if($('qin')){$('qin').value=Q.ans;$('qin').disabled=true;}
  go.disabled=false;go.textContent=q<NQ?'다음 문제로 ▶':'섬으로 돌아가기 🏝️';go.onclick=function(){if(q<NQ)renderQuestion(q+1);else renderIsland();};
 }else{
  go.textContent='제출하기';go.disabled=ph!=='running';go.onclick=function(){doSubmit(q);};
 }
 var cc=$('qconc');if(cc){cc.innerHTML='<button class="btn ghost" id="qconcb">📖 개념 다시보기</button>';$('qconcb').onclick=function(){showConcept(q);};}
 $('qhelp').innerHTML=qHelpHtml(q);bindHelp(q);$('qhints').innerHTML=qHintsHtml(q);
 qsa('[data-thx]',$('qhints')).forEach(function(b){b.onclick=function(){sendThanks(Number(b.getAttribute('data-thx')));};});
 updateTimers();}
function qHelpHtml(q){
 var me=ST.me,T=ST.team;if(me.done[q-1])return '';
 var wrong=me.wrong[q-1],helping=me.helping===q,got=recvFor(q).length;
 if(wrong<2&&!helping&&!got)return '<div class="sub" style="text-align:center">💡 2번 틀리면 [🆘 도움 요청]이 열려요 (지금 '+wrong+'번 틀림)</div>';
 var solvers=T.members.filter(function(m){return m.name!==me.name&&m.done[q-1];}).length,used=ST.hints.recv.filter(function(h){return h.q===q&&h.kind==='담임';}).length;
 var h='<div class="card"><h2>🆘 도움이 필요해요?</h2>';
 if(helping)h+='<div class="rule">🆘 조원에게 도움을 요청하는 중이에요! 힌트가 오면 아래에 나타나요.</div>';
 h+='<button class="btn sos" id="hq-team"'+((helping||!solvers)?' disabled':'')+'>👥 조원에게 요청 ('+(solvers?'이 문제를 푼 조원 '+solvers+'명':'아직 푼 조원이 없어요')+')</button>';
 h+='<button class="btn ghost" id="hq-teacher">👩‍🏫 담임 힌트 요청 ('+Math.min(used,2)+'/2단계 사용)</button>';
 if(solvers&&!ST.cfg.always)h+='<div class="sub" style="margin-top:6px">조원이 이미 풀었어요! 먼저 조원에게 요청해 보세요.</div>';
 return h+'</div>';}
function qHintsHtml(q){
 var rv=recvFor(q).sort(function(a,b){return a.id-b.id;});if(!rv.length)return '';

function bindHelp(q){
 var a=$('hq-team');if(a)a.onclick=function(){reqTeam(q);};
 a=$('hq-teacher');if(a)a.onclick=function(){reqTeacher(q,false);};}
function reqTeam(q){
 api('help',Object.assign({q:q,mode:'team'},idp())).then(function(r){
  if(r&&r.ok){toast('🆘 조원에게 도움을 요청했어요!',2200);sfx('msg');pollNow();}
  else if(r&&r.code==='nosolver')popup({icon:'🤔',title:'아직 푼 조원이 없어요',body:'이 문제를 푼 조원이 없어서 조원 요청은 못 해요.<br>[담임 힌트 요청]을 눌러 보세요!',btns:[{t:'확인'}]});
  else toast((r&&r.error)||'요청하지 못했어요',2600);}).catch(function(){toast('요청이 안 갔어요. 다시 눌러 주세요',2600);});}
function reqTeacher(q,force){
 var used=ST.hints.recv.filter(function(h){return h.q===q&&h.kind==='담임';}).length;
 if(used>=2){popup({icon:'🙋',title:'단계 힌트를 모두 받았어요',body:'더 필요하면 손을 들어 아듬샘께 직접 물어보세요!',btns:[{t:'확인'}]});return;}
 var Q=QUESTIONS[q-1],text=used===0?Q.h1:Q.h2;
 api('help',Object.assign({q:q,mode:'teacher',text:text,force:force?1:0},idp())).then(function(r){
  if(r&&r.ok){toast('👩‍🏫 담임 힌트가 도착했어요!',2200);sfx('msg');pollNow();}
  else if(r&&r.code==='blocked')popup({icon:'👥',title:'조원이 이미 풀었어요!',body:'먼저 [👥 조원에게 요청]을 눌러 보세요.<br><span class="sub">조원이 도와주면 서로 더 잘 배워요 😊</span>',btns:[{t:'확인'}]});
  else if(r&&r.code==='confirm')popup({icon:'👥',title:'조원이 이미 풀었어요!',body:'먼저 조원에게 요청해 보는 걸 추천해요.<br>그래도 담임 힌트를 받을까요?',btns:[{t:'그래도 받을래요',fn:function(){reqTeacher(q,true);}},{t:'조원에게 요청할게요',ghost:true}]});
  else toast((r&&r.error)||'요청하지 못했어요',2600);}).catch(function(){toast('요청이 안 갔어요. 다시 눌러 주세요',2600);});}
function doSubmit(q){
 var Q=QUESTIONS[q-1],msg=$('qmsg'),btn=$('qgo'),val;
 if(phase()!=='running'){msg.className='msg err';msg.textContent=phase()==='ready'?'아직 시작 전이에요!':'시간이 끝났어요 🌊';return;}
 val=Q.type==='choice'?QSEL:($('qin')?$('qin').value.trim():'');
 if(!val){msg.className='msg err';msg.textContent=Q.type==='choice'?'보기를 하나 골라 주세요.':'정답을 입력해 주세요.';return;}
 var ok=checkAnswer(Q,val);
 if(!ok){
  msg.className='msg err';var c=$('qcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  ST.me.wrong[q-1]++;msg.textContent='땡! 다시 생각해 볼까요? 🤔'+(ST.me.wrong[q-1]>=2?' (아래에서 도움을 요청할 수 있어요)':'');
  api('result',Object.assign({q:q,correct:0},idp())).catch(function(){});paintQ();return;}
 btn.disabled=true;btn.textContent='확인 중…';msg.className='msg';msg.textContent='정답! 기록하는 중…';
 var stop=slowNote(function(t){msg.className='msg slow';msg.textContent=t;});
 api('result',Object.assign({q:q,correct:1},idp()),40000).then(function(r){
  stop();if(!r||!r.ok)throw new Error((r&&r.error)||'x');
  ST.me.done[q-1]=true;ST.me.coins=r.coins;if(ST.me.helping===q)ST.me.helping=0;if(r.key)ST.me.hasKey=true;
  if(!r.already){sfx('coin');toast('정답! 🪙 +'+r.gained,2400);}
  msg.className='msg ok';msg.textContent='✅ 클리어!';paintQ();
  if(r.boxId)setTimeout(function(){openBox(r.boxId,q);},500);else setTimeout(function(){afterSolve(q);},600);
  pollNow();
 }).catch(function(e){stop();btn.disabled=false;btn.textContent='제출하기';msg.className='msg err';msg.textContent='아직 기록이 안 됐어요 😢 '+((e&&e.message&&e.message.length<40&&e.message!=='x')?e.message:'구글 시트가 느린가 봐요. 같은 답으로 다시 눌러 주세요.');});}

 try{$('scene').scrollIntoView({behavior:'smooth',block:'center'});}catch(e){}

   },1100);
  },1300);
 },900);}

/* ===== 순위 (탈출 순위 점수 + 평균 코인 순위 점수) ===== */
function rankTeams(board){
 var N=board.length,esc_=board.filter(function(b){return b.escapedAt;}).sort(function(a,b){return a.escapedAt-b.escapedAt;});
 board.forEach(function(b){
  var ei=esc_.indexOf(b);b.escPts=ei<0?0:N-ei;
  b.coinPts=N-board.filter(function(o){return o.avg>b.avg;}).length;
  b.total=b.escPts+b.coinPts;});
 return board.slice().sort(function(a,b){return b.total-a.total||(a.escapedAt||1e15)-(b.escapedAt||1e15)||b.avg-a.avg;});}
function rankHtml(board,myTeam,ph,startAt,adminView){
 var medals=['🥇','🥈','🥉'],list=rankTeams(board.map(function(b){return Object.assign({},b);}));
 if(!list.length)return '<div class="card sub">아직 입장한 조가 없어요.</div>';
 return list.map(function(t,i){
  var col=teamColor(t.team),mine=t.team===myTeam,st;
  if(t.escapedAt)st='🚢 탈출 성공 · '+fmtMs(t.escapedAt-startAt);else if(ph==='over')st='🌊 탈출 실패';else st='🏝️ 탈출 도전 중…';
  return '<div class="card rk'+(mine?' mine':'')+'"><div class="rn">'+(medals[i]||(i+1))+'</div><div style="flex:1;min-width:0"><div><span class="dot" style="background:'+col+'"></span><b>'+esc(t.label)+'</b>'+(mine?' <span class="pill">내 조</span>':'')+' <span class="sub">'+t.n+'명</span></div><div class="sub" style="margin:4px 0;font-weight:800">'+st+'</div><div class="coin">🪙 평균 '+t.avg+'</div><div class="bar"><i style="width:'+t.progress+'%"></i></div><div class="sub">진행도 '+t.progress+'% · 점수 <b>'+t.total+'</b> (탈출 '+t.escPts+' + 코인 '+t.coinPts+')</div></div></div>';}).join('');}

 var s=DEMO.s;if(!s)return;var el=(Date.now()-s.t0)/1000;
 s.bots.forEach(function(b){
  var q=b.done.indexOf(false)+1;if(!q||el<b.sched[q-1])return;
  if(b.stuck[q]){
   var got=s.H.filter(function(h){return h.to===b.name&&h.q===q;});
   if(!b.helping){b.helping=q;b.helpSince=Date.now();return;}
   if(!got.length){
    if(Date.now()-b.helpSince>45000){var sv=demoAll().filter(function(p){return p!==b&&p.done[q-1];})[0];if(sv)demoPush(sv.name,b.name,q,'조원',QUESTIONS[q-1].bot);}
    return;}
   if(Date.now()-got[0].tms>6000){got[0].thanks=true;demoSolve(b,q,false);}
   return;}
  demoSolve(b,q,true);});}
function demoState(){
 var s=DEMO.s,now=Date.now(),me=s.me,mem=demoAll(),el=(now-s.t0)/60000;
 function fake(label,team,escMin){var pr=Math.min(1,el/escMin);return {team:team,label:label,n:4,avg:Math.round(pr*55*10)/10,progress:Math.round(pr*100),escapedAt:el>=escMin?s.t0+escMin*60000:0};}
 var sum=0,dn=0;mem.forEach(function(p){sum+=p.coins;dn+=p.done.filter(function(d){return d;}).length;});
 return {ok:true,now:now,game:{phase:now>s.t0+s.dur*60000?'over':'running',startAt:s.t0,endAt:s.t0+s.dur*60000,durationMin:s.dur},cfg:{always:false,minTeam:2},
  me:{key:'demo',name:me.name,team:9,ch:me.ch,coins:me.coins,hasKey:me.hasKey,helping:me.helping,done:me.done.slice(),wrong:me.wrong.slice(),hinted:me.hinted.slice()},
  team:{team:9,label:s.label,leader:me.name,escapedAt:s.escAt,members:mem.map(function(m){return {name:m.name,ch:m.ch,coins:m.coins,hasKey:m.hasKey,helping:m.helping,done:m.done.slice()};})},
  hints:{recv:s.H.filter(function(h){return h.to===me.name;}).map(function(h){return {id:h.id,t:h.t,from:h.from,q:h.q,kind:h.kind,text:h.text,thanks:h.thanks};}),sent:s.H.filter(function(h){return h.from===me.name&&h.kind==='조원';}).map(function(h){return {id:h.id,to:h.to,q:h.q,thanks:h.thanks};})},
  boxes:s.B.filter(function(b){return b.pick==='';}).map(function(b){return {id:b.id,key:'demo',q:b.q};}),
  board:[{team:9,label:s.label,n:4,avg:Math.round(sum/4*10)/10,progress:Math.round(dn/20*100),escapedAt:s.escAt},fake('🌋 화산섬',3,4.5),fake('🐠 산호섬',4,7.5)]};}
function demoCall(a,p){return new Promise(function(res){setTimeout(function(){res(demoDo(a,p));},120);});}
function demoDo(a,p){
 var s=DEMO.s,me=s&&s.me;if(!s)return {ok:false,error:'체험이 끝났어요'};
 var q=Number(p.q);
 if(a==='state')return demoState();
 if(a==='setchar'){me.ch=p.char;return {ok:true};}
 if(a==='setisland'){s.label=p.label||s.label;return {ok:true,label:s.label};}
 if(a==='leave')return {ok:true};
 if(a==='thanks'){s.H.forEach(function(h){if(h.id===Number(p.id))h.thanks=true;});return {ok:true};}
 if(a==='result'){
  if(me.done[q-1])return {ok:true,already:true,coins:me.coins};
  if(q>1&&!me.done[q-2])return {ok:false,error:'앞 문제를 먼저 풀어야 해요'};
  if(String(p.correct)!=='1'){me.wrong[q-1]++;return {ok:true,correct:false,wrong:me.wrong[q-1]};}
  var first=me.wrong[q-1]===0&&me.hinted[q-1]===0,g=Math.max(5,10+(first?5:0)-2*me.hinted[q-1]);
  me.done[q-1]=true;me.coins+=g;if(me.helping===q)me.helping=0;if(q===NQ)me.hasKey=true;
  var bid='demo_'+q;s.B.push({id:bid,q:q,pick:'',codes:shuffle(['X','5','10','20','D'])});demoCheckEsc();
  return {ok:true,correct:true,gained:g,coins:me.coins,boxId:bid,key:q===NQ,escaped:!!s.escAt};}
 if(a==='help'){
  var sol=s.bots.filter(function(b){return b.done[q-1];});
  if(p.mode==='team'){
   if(!sol.length)return {ok:false,code:'nosolver'};
   me.helping=q;
   setTimeout(function(){if(DEMO.s===s&&me.helping===q&&!me.done[q-1])demoPush(sol[0].name,me.name,q,'조원',QUESTIONS[q-1].bot);},6000);
   return {ok:true};}
  if(sol.length)return {ok:false,code:'blocked',solvers:sol.length};
  demoPush('담임',me.name,q,'담임',p.text);return {ok:true};}
 if(a==='hint'){
  var to=demoByName(p.to);if(!to||!me.done[q-1])return {ok:false,error:'보낼 수 없어요'};
  var already=s.H.some(function(h){return h.from===me.name&&h.to===to.name&&h.q===q;});
  demoPush(me.name,to.name,q,'조원',p.text);if(!already)me.coins+=5;
  return {ok:true,coins:me.coins,bonus:!already,help:5};}
 if(a==='openbox'){
  var b=s.B.filter(function(x){return x.id===p.id;})[0];if(!b)return {ok:false,error:'상자를 찾을 수 없어요'};
  if(b.pick!=='')return {ok:true,already:true,codes:b.codes,pick:Number(b.pick),gained:b.gained,coins:me.coins};
  var code=b.codes[Number(p.pick)-1],gn=0;
  if(code==='D')gn=Math.min(30,me.coins);else if(code!=='X')gn=parseInt(code,10)||0;
  me.coins+=gn;b.pick=String(p.pick);b.gained=gn;
  return {ok:true,already:false,codes:b.codes,pick:Number(p.pick),gained:gn,coins:me.coins};}
 return {ok:true};}

  }catch(e){}},190);}

 bdSounds();
 bdNext();
 var teams=ADM.labels.map(function(L){return {L:L,mem:ADM.players.filter(function(p){return p.team===L.team;})};});
 var tb=$('btabs');
 tb.innerHTML='<button data-b="0" class="'+(BSEL===0?'on':'')+'">📊 전체</button>'+teams.map(function(t){return '<button data-b="'+t.L.team+'" class="'+(BSEL===t.L.team?'on':'')+(t.mem.length?'':' off')+'">'+t.L.team+'조 ('+t.mem.length+')</button>';}).join('');
 qsa('button',tb).forEach(function(b){b.onclick=function(){BSEL=Number(b.getAttribute('data-b'));BSCN=-1;paintBoard();};});
 var body=$('bbody');
 if(BSEL===0){
  PCB={};BSCN=-1;
  var act=teams.filter(function(t){return t.mem.length;}),idle=teams.filter(function(t){return !t.mem.length;});
  body.innerHTML='<div class="sub" style="margin:4px 0">조를 누르면 그 조의 섬을 볼 수 있어요.</div>'+
   '<h2 style="margin:12px 0 4px">🏆 지금 순위</h2>'+rankHtml(ADM.board,0,bdPhase(),ADM.game.startAt,true)+
   '<h2 style="margin:16px 0 4px">🏝️ 조별 · 개별 현황</h2>'+(act.length?act.map(function(t){return bdTeam(t.L,t.mem,false);}).join(''):'<div class="card sub">아직 입장한 학생이 없어요.</div>')+
   (idle.length?'<div class="sub" style="margin:8px 0">비어 있는 섬: '+idle.map(function(t){return t.L.team+'조';}).join(', ')+'</div>':'');
  qsa('[data-bview]',body).forEach(function(b){b.onclick=function(){BSEL=Number(b.getAttribute('data-bview'));BSCN=-1;paintBoard();window.scrollTo(0,0);};});
  return;}
 var t=teams.filter(function(x){return x.L.team===BSEL;})[0];if(!t){BSEL=0;return;}
 var esc_=!!t.L.escapedAt;
 if(BSCN!==BSEL){
  body.innerHTML='<div id="bscene">'+sceneHtml()+'</div><div id="bcnt" class="sub" style="margin:-6px 0 8px"></div><div id="bteam"></div>';
  PCB={};BSCN=BSEL;}
 qsa('#bscene .spot').forEach(function(el){var q=Number(el.getAttribute('data-q'));el.className='spot'+((t.mem.length&&t.mem.every(function(p){return p.done[q-1];}))?' clear':'');});
 boardChars(t.mem,esc_);
 var cnt=[];for(var q=1;q<=NQ;q++){var c=t.mem.filter(function(p){return !esc_&&Math.min(doneCount(p)+1,NQ)===q;}).length;cnt.push(q+'. '+QUESTIONS[q-1].spot+' '+c+'명');}
 $('bcnt').textContent='지금 위치 → '+cnt.join(' · ')+(esc_?' · 🚢 탈출 완료':'');
 $('bteam').innerHTML=bdTeam(t.L,t.mem,true);}
function bdSounds(){
 var cur={};ADM.players.forEach(function(p){cur[p.team+'|'+p.name]=p.helping||0;});
 var kt={};ADM.players.forEach(function(p){if(p.hasKey)kt[p.team]=1;});
 if(BKEYT!==null){Object.keys(kt).forEach(function(t){if(!BKEYT[t]){var L=ADM.labels.filter(function(x){return x.team===Number(t);})[0];toast('🗝️ '+t+'조'+(L?' · '+L.label:'')+' 첫 열쇠 획득!',3200);boardSfx('key');}});}
 BKEYT=kt;
 if(BKNOWN===null){BKNOWN=cur;return;}
 var joined=false,sos=false;
 Object.keys(cur).forEach(function(k){if(!(k in BKNOWN))joined=true;else if(cur[k]&&cur[k]!==BKNOWN[k])sos=true;});
 BKNOWN=cur;
 if(sos)boardSfx('sos');else if(joined)boardSfx('join');}
function bdNext(){
 if(BQBUSY||!BQ.length)return;
 var e=BQ.shift(),L=e.L;BQBUSY=true;
 var el=document.createElement('div');el.className='bdc';
 el.innerHTML='<div class="bdt">🎉 '+L.team+'조 · '+esc(L.label)+'</div><div class="bdt2">탈출 성공! 🚢</div><div class="bds">⏱ 탈출 시간 '+fmtMs(L.escapedAt-ADM.game.startAt)+' · '+e.n+'번째로 탈출했어요!</div>';
 document.body.appendChild(el);confetti();boardSfx('fanfare');
 setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);BQBUSY=false;bdNext();},6500);}
function boardChars(mem,esc_){
 var box=$('pcs');if(!box)return;var groups={},seen={};
 mem.forEach(function(m){var sp=esc_?0:Math.min(doneCount(m)+1,NQ);(groups[sp]=groups[sp]||[]).push(m);});
 Object.keys(groups).forEach(function(sp){var arr=groups[sp];
  arr.forEach(function(m,j){
   var pos=sp==='0'?{x:SHIP_X+(j-(arr.length-1)/2)*5,y:SHIP_Y-6}:spotPos(Number(sp),j,arr.length);
   var el=PCB[m.name];if(!el){el=document.createElement('div');box.appendChild(el);PCB[m.name]=el;}
   el.className='pc'+(m.helping?' sos':'');el.style.left=pos.x+'%';el.style.top=pos.y+'%';
   el.innerHTML='<i class="sb">🆘</i>'+esc(m.ch||'🙂')+'<span class="pn">'+esc(m.name)+(m.hasKey?' 🗝️':'')+'</span>';
   seen[m.name]=1;});});
 Object.keys(PCB).forEach(function(k){if(!seen[k]){if(PCB[k].parentNode)PCB[k].parentNode.removeChild(PCB[k]);delete PCB[k];}});}

/* ===== 입장코드 변경 ===== */
function renderPwChange(force){
 view='pw';setTabs(false);clearInterval(admT);
 $('app').innerHTML=titleHtml('입장코드 설정')+'<div class="card"><h2>🔑 나만의 입장코드로 바꿔 주세요</h2><div class="sub">'+(force?'처음 코드(mathtest)는 누구나 알 수 있어요. ':'')+'<b>4~20자</b>로 새 입장코드를 정해 주세요. 학생에게는 보이지 않아요.</div><label for="pw1">새 입장코드</label><input type="text" class="pw" id="pw1" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false"><label for="pw2">한 번 더 입력</label><input type="text" class="pw" id="pw2" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="pwgo">바꾸기</button><div class="msg" id="pwm"></div><div class="sub" style="margin-top:8px">잊어버리면: Apps Script → 프로젝트 설정 → 스크립트 속성에서 <b>ADMIN_CODE</b>를 지우면 mathtest로 돌아가요.</div></div>'+backBtn('bk',force?'🚪 나가기':'‹ 관리자 화면으로')+footer();
 $('bk').onclick=function(){if(force){try{sessionStorage.removeItem('ise_admin_code');}catch(e){}MODE='';renderStart();}else renderAdmin();};
 var go=function(){
  var a=$('pw1').value.trim(),b=$('pw2').value.trim(),m=$('pwm'),btn=$('pwgo');
  if(a.length<4||a.length>20){m.className='msg err';m.textContent='4~20자로 정해 주세요.';return;}
  if(a.toLowerCase()==='mathtest'){m.className='msg err';m.textContent='처음 코드와 다른 코드로 정해 주세요.';return;}
  if(a!==b){m.className='msg err';m.textContent='두 칸이 달라요. 다시 확인해 주세요.';return;}
  btn.disabled=true;m.className='msg';m.textContent='저장 중…';
  adm('adminpw',{newcode:a}).then(function(r){
   if(r&&r.ok&&r.ping){btn.disabled=false;m.className='msg err';m.textContent='연결된 GAS 코드가 옛 버전이에요. 최신 .gs를 붙여넣고 [배포 관리 → 수정 → 새 버전]으로 재배포해 주세요.';return;}
   if(!r||!r.ok){btn.disabled=false;m.className='msg err';m.textContent=(r&&r.error)||'바꾸지 못했어요';return;}
   try{sessionStorage.setItem('ise_admin_code',a);}catch(e){}toast('✅ 입장코드를 바꿨어요! 잊지 마세요',3000);renderAdmin();
  }).catch(function(e){btn.disabled=false;m.className='msg err';m.textContent=noGasMsg(e);});};
 $('pwgo').onclick=go;$('pw2').addEventListener('keydown',function(e){if(e.key==='Enter')go();});}

function qrPoster(url,o){o=o||{};
 var qr=qrcode(0,'M');qr.addData(url);qr.make();
 var n=qr.getModuleCount(),W=640,H=860,c=$(o.cid||'qrc'),x;c.width=W;c.height=H;x=c.getContext('2d');
 x.fillStyle='#7FD0FF';x.fillRect(0,0,W,H);x.fillStyle='#16294D';x.fillRect(0,0,W,12);x.fillRect(0,H-12,W,12);
 x.textAlign='center';x.fillStyle='#16294D';x.font='900 54px Galmuri11,Pretendard,sans-serif';x.fillText('섬탈출원정대',W/2,100);
 x.font='700 24px Galmuri11,Pretendard,sans-serif';x.fillText(o.sub||'수학문제를 클리어하고 보석을 얻어 섬을 탈출하자!',W/2,152);
 var sz=Math.floor(480/n)*n,ox=(W-sz)/2,oy=205,k=sz/n;
 x.fillStyle='#fff';x.fillRect(ox-24,oy-24,sz+48,sz+48);x.strokeStyle='#16294D';x.lineWidth=6;x.strokeRect(ox-24,oy-24,sz+48,sz+48);
 x.fillStyle='#16294D';for(var r=0;r<n;r++)for(var q=0;q<n;q++)if(qr.isDark(r,q))x.fillRect(Math.round(ox+q*k),Math.round(oy+r*k),Math.ceil(k),Math.ceil(k));
 x.font='700 28px Galmuri11,Pretendard,sans-serif';x.fillText(o.line||'📷 카메라로 찍어서 입장해요!',W/2,oy+sz+90);
 x.font='700 22px Galmuri11,Pretendard,sans-serif';x.fillText('Made by Cheon_R',W/2,H-40);}

/* ===== 시작 ===== */
(function boot(){
 if(params.get('new')==='1'&&!params.get('gas')){renderTeacherSetup();return;}
 var s=store.get(K_SES,null);
 if(s&&GAS){
  MODE='real';SES=s;view='boot';setTabs(false);
  $('app').innerHTML=titleHtml()+'<div class="card"><h2>섬으로 돌아가는 중… 🏝️</h2><div class="msg" id="bmsg"></div></div>';
  var stop=slowNote(function(t){var m=$('bmsg');if(m){m.className='msg slow';m.textContent=t;}});
  api('state',idp(),35000).then(function(r){stop();if(r&&r.ok){applyState(r);enterGame();}else{store.del(K_SES);SES=null;MODE='';renderStart();}})
  .catch(function(e){stop();errCard('접속이 안 됐어요 😢',noGasMsg(e),function(){location.reload();},function(){store.del(K_SES);SES=null;MODE='';renderStart();});});
 }else renderStart();
})();
</script>
