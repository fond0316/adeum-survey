<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9B8EC4">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="경력 노트">
<title>경력 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --main:#9B8EC4;--main-d:#8072B5;--main-dd:#5B4F92;--main-s:#EEEBF8;--main-s2:#E2DDF3;
  --bg:#F4F2FA;--card:#FFFFFF;--ink:#2A2637;--ink2:#5E596F;--ink3:#948FA6;--line:#E7E3F1;--line2:#D8D2E9;
  --ok:#2E8A5E;--ok-s:#E2F3E9;--warn:#A86A14;--warn-s:#FBEFD9;--danger:#C24A4A;--danger-s:#FBE7E7;
  --shadow:0 1px 2px rgba(60,48,110,.05),0 4px 14px rgba(60,48,110,.05);
  --tabh:62px;--topH:56px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
body.modal{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3,h4{letter-spacing:-.01em}
a{color:var(--main-dd)}
code{background:var(--main-s);padding:1px 6px;border-radius:6px;font-size:.92em}

/* 레이아웃 */
.shell{min-height:100vh;display:flex}
.side{display:none}
.main{flex:1;min-width:0;padding-bottom:calc(var(--tabh) + var(--safe-b) + 90px)}
.topbar{position:sticky;top:0;z-index:30;background:rgba(244,242,250,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:calc(8px + var(--safe-t)) 16px 8px;display:flex;align-items:center;gap:8px;min-height:56px}
.topbar h1{font-size:17px;margin:0;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:820px;margin:0 auto;padding:4px 16px 0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:var(--safe-b)}
.tabbar button{border:0;background:none;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink3)}
.tabbar .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.65}
.tabbar button.on{color:var(--main-dd);font-weight:800}
.tabbar button.on .ic{filter:none;opacity:1}
.fab{position:fixed;right:18px;bottom:calc(var(--tabh) + var(--safe-b) + 16px);z-index:41;width:58px;height:58px;border-radius:50%;border:0;background:var(--main);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(110,90,180,.38)}
.fab:active{transform:scale(.96)}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:4px;width:236px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:#fff}
  .side-brand{font-size:18px;font-weight:800;padding:4px 10px 16px;color:var(--main-dd)}
  .snav{display:flex;align-items:center;gap:10px;border:0;background:none;min-height:46px;padding:0 12px;border-radius:12px;font-weight:700;color:var(--ink2);text-align:left}
  .snav:hover{background:var(--bg)}
  .snav.on{background:var(--main-s);color:var(--main-dd)}
  .side .btn{margin-top:12px}
  .side-foot{margin-top:auto;font-size:12px;color:var(--ink3);padding:0 10px}
  .tabbar{display:none}
  .main{padding-bottom:60px}
  .fab{bottom:28px;right:32px}
}

/* 공통 컴포넌트 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.sec-title{font-size:15.5px;font-weight:800;margin:24px 2px 10px;display:flex;align-items:center;gap:8px}
.sec-title .link,.sec-title .btn{margin-left:auto}
.link{border:0;background:none;color:var(--main-dd);font-weight:700;font-size:13.5px;padding:8px 4px;min-height:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.soft{background:var(--main-s);border-color:var(--main-s);color:var(--main-dd)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--main-dd)}
.btn.danger{color:var(--danger);border-color:#EFCACA;background:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn.grow{flex:1}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.iconbtn{border:0;background:none;width:44px;height:44px;border-radius:12px;font-size:18px;color:var(--ink2);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:rgba(0,0,0,.04)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.center{text-align:center}
.hint{font-size:12.5px;color:var(--ink3);margin:6px 2px 0;line-height:1.5}
.lsub{font-size:12px;font-weight:500;color:var(--ink3);margin-left:4px}
.err{color:var(--danger);font-size:13.5px;font-weight:600;margin:10px 2px 0}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:13.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.chip.sm{min-height:34px;padding:0 11px;font-size:13px}
.chip .n{font-size:12px;opacity:.8;font-weight:600}
.chip-sel{flex-shrink:0;width:auto;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:13.5px;font-weight:700;color:var(--ink2)}
.chip-sel.on{border-color:var(--main);color:var(--main-dd);background:var(--main-s)}
#qaCats.chips.scroll{flex-wrap:wrap;overflow-x:visible;padding:2px 0 4px}
.vsep{flex-shrink:0;width:1px;background:var(--line2);margin:6px 2px}
input[type=text],input[type=url],input[type=password],input[type=date],input[type=month],input[type=number],input[type=search],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:#fff;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:90px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--main);box-shadow:0 0 0 3px var(--main-s2)}
input:disabled{background:#F6F5F9;color:var(--ink3)}
label.f{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ink2);margin:16px 2px 7px}
label.f em{color:var(--danger);font-style:normal}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g2>div{min-width:0}
@media (max-width:359px){.g2{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--main-s);border-radius:12px;padding:3px;gap:2px;flex-shrink:0}
.seg button{border:0;background:none;min-height:38px;padding:0 13px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--main-dd);white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(60,48,110,.16)}
.seg.wide{display:flex}.seg.wide button{flex:1}
.seg.mini button{min-height:32px;padding:0 10px;font-size:12.5px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;cursor:pointer;font-weight:700;font-size:14.5px}
.tog small{display:block;font-size:12px;font-weight:500;color:var(--ink3)}
.tog.sm{min-height:44px;font-size:14px;font-weight:600}
.tog input{-webkit-appearance:none;appearance:none;width:48px;height:28px;border-radius:999px;background:#D9D4E6;position:relative;transition:background .2s;flex-shrink:0;cursor:pointer;margin:0}
.tog input::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog input:checked{background:var(--main)}
.tog input:checked::after{left:23px}
.ck{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 12px 0 10px;border:1px solid var(--line2);border-radius:12px;background:#fff;font-size:13.5px;font-weight:600;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--main);margin:0}
.cklist{display:flex;flex-wrap:wrap;gap:8px}
details.acc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px}
details.acc>summary{min-height:50px;display:flex;align-items:center;gap:8px;font-weight:800;cursor:pointer;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'▾';margin-left:auto;color:var(--ink3)}
details.acc[open]>summary::after{content:'▴'}
details.acc>*:last-child{margin-bottom:14px}
details.acc>summary:last-child{margin-bottom:0}
.guide{padding-left:20px;margin:0 0 10px;font-size:14px;color:var(--ink2)}
.guide li{margin:6px 0}
.credit{text-align:center;font-size:12px;color:var(--ink3);margin:28px 0 8px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 88px);transform:translateX(-50%) translateY(8px);background:#2E2944;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:300;max-width:min(92vw,520px);text-align:center;box-shadow:0 8px 24px rgba(30,20,60,.25);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#B23B3B}
@media (min-width:960px){.toast{bottom:40px}}
.banner{display:flex;width:100%;align-items:center;gap:8px;flex-wrap:wrap;border:1px dashed var(--main);background:var(--main-s);color:var(--main-dd);border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:600;margin:8px 0 4px;text-align:left}
.banner b{margin-left:auto}

/* 상단 상태 */
.sync{border:0;border-radius:999px;min-height:34px;padding:0 12px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.ok{background:var(--ok-s);color:var(--ok)}
.sync.ing{background:var(--main-s);color:var(--main-dd)}
.sync.err{background:var(--danger-s);color:var(--danger)}
.sync.local{background:var(--warn-s);color:var(--warn)}

/* 홈 */
.hero{background:var(--main);color:#fff;border-radius:20px;padding:18px 18px 16px;margin-top:8px}
.hero-t{display:flex;align-items:center;gap:8px}
.hero h2{margin:0;font-size:21px;font-weight:800;flex:1}
.hero p{margin:5px 0 0;font-size:14px;opacity:.95}
.hero .edu{font-size:13px;opacity:.9}
.hero-btn{border:0;background:rgba(255,255,255,.18);color:#fff;width:38px;height:38px;border-radius:12px;font-size:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.stat .l{font-size:12.5px;color:var(--ink3);font-weight:700}
.stat .v{font-size:20px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
.stat .s{font-size:12px;color:var(--ink2);margin-top:1px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stats.s6{grid-template-columns:repeat(2,1fr)}
@media (min-width:720px){.stats.s6{grid-template-columns:repeat(3,1fr)}}
button.stat{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%;display:block}
button.stat:active{transform:scale(.98)}
.stat .l .go{float:right;color:var(--ink3);font-weight:800}
.attn{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.attn-b{flex:1;min-width:150px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--ink2);padding:0 14px;text-align:left}
.attn-b b{color:var(--main-dd)}
.empty{text-align:center;color:var(--ink2);background:#fff;border:1px dashed var(--line2);border-radius:16px;padding:22px 16px}
.empty p{margin:0 0 12px}
.onb{margin-top:14px}
.onb h3{margin:0 0 8px;font-size:16px}
.onb ol{margin:0 0 12px;padding-left:20px;color:var(--ink2);font-size:14px}
.onb li{margin:4px 0}

/* 기록 카드 */
.rc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px 11px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;position:relative}
.rc:active{background:#FCFBFE}
.rc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);font-weight:600}
.ctag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--cs);color:var(--ci)}
.rc h4{margin:6px 0 2px;font-size:15.5px;font-weight:800;line-height:1.4}
.rc .star{color:#E0A400}
.rc .sub{font-size:13px;color:var(--ink2)}
.mets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.met{font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--main-s);color:var(--main-dd)}
.tags{margin-top:6px;font-size:12.5px;color:var(--main-d);font-weight:600}
.rc-foot{display:flex;align-items:center;gap:6px;margin-top:8px;min-height:32px}
.pill{padding:2px 8px;border-radius:999px;font-weight:800;font-size:11.5px;white-space:nowrap}
.pill.draft{background:var(--warn-s);color:var(--warn)}
.pill.noproof{background:var(--danger-s);color:var(--danger)}
.pill.proof{background:var(--ok-s);color:var(--ok)}
.pill.unk{background:#F1F0F5;color:var(--ink3)}
.copy1{margin-left:auto}
.rtools{margin-top:8px}
.srow{display:flex;gap:8px;align-items:center}
.srow input{flex:1;min-width:0}
.stick{position:sticky;top:var(--topH);z-index:20;background:var(--bg);margin:0 -16px;padding:2px 16px 0}
.navrow{align-items:center}
.yg{scroll-margin-top:calc(var(--topH) + 60px)}
.yhead{display:flex;align-items:baseline;gap:8px;margin:16px 2px 10px}
.yhead h3{margin:0;font-size:18px;font-weight:800;color:var(--main-dd)}
.yhead span{font-size:13px;color:var(--ink3);font-weight:600}
.yinfo{display:block;width:100%;text-align:left;font-size:13px;color:var(--ink2);background:#fff;border:1px dashed var(--line2);border-radius:12px;padding:9px 12px;margin:0 0 12px;cursor:pointer;font-weight:600}
.tl{position:relative;margin-left:6px;padding-left:20px;border-left:2px solid var(--main-s2)}
.tl .rc::before{content:'';position:absolute;left:-29px;top:17px;width:14px;height:14px;border-radius:50%;background:var(--cc);border:3px solid var(--bg)}
.sumline{font-size:13.5px;color:var(--ink2);font-weight:600;margin:10px 2px 10px}
.sumline b{color:var(--main-dd)}

/* 시트(모달) */
.ovl{position:fixed;inset:0;z-index:100;background:rgba(30,24,50,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94vh;max-height:94dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .2s ease}
.sheet-h{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 18px;background:#fff;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:17px;flex:1;font-weight:800}
.sheet-b{overflow-y:auto;padding:6px 16px 22px;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-f{display:flex;gap:8px;padding:12px 16px calc(12px + var(--safe-b));background:#fff;border-top:1px solid var(--line)}
@media (min-width:720px){.ovl{align-items:center;padding:20px}.sheet{border-radius:22px;max-height:90vh}}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px}
.cchip{min-height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;color:var(--ink2);text-align:left;padding:0 10px}
.cchip.on{border-color:var(--cc);background:var(--cs);color:var(--ci)}
.ymeta{font-size:12.5px;color:var(--main-dd);font-weight:700;margin:8px 2px 0}
.aib{margin-left:auto;border:0;background:var(--main-s);color:var(--main-dd);font-weight:800;font-size:12.5px;border-radius:999px;min-height:32px;padding:0 12px}
.aibox{background:#fff;border:1.5px solid var(--main);border-radius:14px;padding:12px;margin-top:8px}
.aibox .t{font-size:12.5px;font-weight:800;color:var(--main-dd);margin-bottom:6px}
.aibox pre{white-space:pre-wrap;font-family:var(--font);font-size:14.5px;margin:0 0 10px;line-height:1.6}
.metrow{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;margin-bottom:6px}
.tagbox .chips{margin-bottom:8px}
.tchip{display:inline-flex;align-items:center;gap:2px;padding:0 4px 0 11px;min-height:34px;border-radius:999px;background:var(--main-s);color:var(--main-dd);font-weight:700;font-size:13px}
.tchip button{border:0;background:none;color:inherit;width:28px;height:28px;font-size:12px;border-radius:50%}
.sug .chip{color:var(--main-d)}
.togs{margin-top:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0}
.drbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--warn-s);color:var(--warn);font-weight:700;font-size:13px;border-radius:12px;padding:10px 12px;margin-top:10px}
.edmore{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:20px;padding-top:14px;border-top:1px dashed var(--line2)}
.edmore .danger{margin-left:auto}

/* 설정 */
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--ink3);font-weight:600;flex-shrink:0}
.kv b{text-align:right;min-width:0;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600}
.okc{color:var(--ok)}
.affgrp{margin-bottom:12px}
.affgrp-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--ink2);margin:0 2px 8px}
.affgrp-h span{font-weight:600;color:var(--main-dd);font-size:13px}
.affgrp-h .btn{margin-left:auto}
.affc{display:flex;gap:10px;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.affc b{display:block;font-size:15px}
.affc span{font-size:12.5px;color:var(--ink2)}
.affc-r{text-align:right;flex-shrink:0}

async function copyText(text) {

  }
}

      return true;
    }
  } catch (e) {}
  const div = document.createElement('div'); div.contentEditable = 'true'; div.innerHTML = html; div.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(div); const rg = document.createRange(); rg.selectNodeContents(div); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg);

const AI_SYS = `당신은 한국의 교사·직장인이 경력기술서, 자기실적평가서, 자기소개서를 쓰도록 돕는 전문 편집자입니다.
규칙:
- 주어진 기록에 있는 사실만 씁니다. 없는 경험·수치·기관명·성과를 절대 지어내지 않습니다.
- 숫자, 날짜, 기관명, 고유명사는 그대로 둡니다.
- 맞춤법을 지키고 군더더기 수식어를 줄입니다.
- 결과 본문만 출력합니다. 인사말, 설명, 따옴표, 마크다운 기호(**, #, 코드블록)는 쓰지 않습니다.`;
function stripMd(t) { return String(t || '').replace(/^```[a-zA-Z]*\n?/, '').replace(/\n?```\s*$/, '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#{1,6}\s*/gm, '').trim(); }
async function aiCall(prompt, maxTokens) {
  if (S.mode !== 'gas') throw new Error('AI는 구글 시트를 연결한 뒤에 쓸 수 있어요.');
  if (!S.ai.hasKey) throw new Error('설정 › AI에서 키를 먼저 넣어 주세요.');
  const res = await gasCall('ai', { system: AI_SYS, prompt, maxTokens }, { timeout: 150000 });
  return stripMd(res.text);
}

function showGate(kind, msg) {
  $('#shell').hidden = true; $('#gate').hidden = false;
  $('#gateSetup').hidden = kind !== 'setup'; $('#gateLocalBtn').hidden = kind !== 'setup' || S.backToLocal; $('#gateLock').hidden = kind !== 'lock';
  $('#gateBack').hidden = !(kind === 'setup' && S.backToLocal);
  if (!$('#gateGuide').innerHTML) $('#gateGuide').innerHTML = GUIDE_HTML;
  if (kind === 'lock') { $('#l_sheet').textContent = S.sheetName ? `연결된 시트: ${S.sheetName}` : ''; $('#l_rem').checked = S.remember; setTimeout(() => $('#l_pw').focus(), 60); }

async function gConnect(btn) {
  const url = $('#g_url').value.trim(), pw = $('#g_pw').value.trim(), rem = $('#g_rem').checked;
  $('#g_err').hidden = true;
  if (!/^https?:\/\/\S+$/.test(url)) return gateErr('g', 'GAS 웹 앱 주소(https://script.google.com/…/exec)를 붙여넣어 주세요.');
  if (/script\.google\.com/.test(url) && !/\/exec(\?|$)/.test(url)) return gateErr('g', "편집기 주소가 아니라, 배포 후 나온 '웹 앱 URL'(…/exec)이 필요해요.");
  if (!pw) return gateErr('g', '비밀번호를 넣어 주세요.');
  const prev = { mode: S.mode, gasUrl: S.gasUrl, pw: S.pw, remember: S.remember };
  const fromLocal = S.mode === 'local';
  Object.assign(S, { mode: 'gas', gasUrl: url, pw, remember: rem });
  if (btn.disabled) return;
  btn.disabled = true; const old = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>연결 중…';
  try {
    await gasCall('ping', {});
    const local = loadJSON(localStorage, LS.local);
    const nRec = local ? (local.records || []).length : 0, nAff = local ? (local.affs || []).length : 0;
    if ((nRec || nAff) && confirm(`체험 모드에서 쓴 기록 ${nRec}건, 경력·학력 ${nAff}건을 이 시트로 옮길까요?`)) {
      btn.innerHTML = '<span class="spin"></span>옮기는 중…';
      await gasCall('importAll', { mode: 'merge', records: (local.records || []).map(normRec), affs: (local.affs || []).map(normAff), settings: local.settings || {} }, { timeout: 240000 });
      localStorage.removeItem(LS.local);
    }
    const res = await gasCall('loadAll', {}, { timeout: 45000 });
    applyData(res); S.lastSync = res.time || nowStamp(); S.lastSyncAt = Date.now(); S.backToLocal = false;
    saveConn(); saveCache();
    $('#g_pw').value = '';
    enterApp();
    toast(`'${S.sheetName}' 시트에 연결했어요 🎉`);
  } catch (e) {
    Object.assign(S, prev);
    if (fromLocal) { S.mode = 'local'; loadCache(); }
    gateErr('g', e.code === 'PW' ? '비밀번호가 맞지 않아요. GAS 코드 맨 위의 비밀번호를 확인해 주세요.' : errMsg(e));
  } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}

  const byHead = (role, re, ex) => { for (let c = 0; c < nc; c++) if (!used.has(c) && re.test(head[c] || '') && !(ex && ex.test(head[c] || ''))) { roles[role] = c; used.add(c); return; } };
  byHead('kind', /구분|유형|종류/); byHead('title', /연수명|과정명|수강과정|교육명|강좌|프로그램|^과정|연수\s*과정/); byHead('org', /기관/);
  byHead('hours', /시간/); byHead('no', /번호|코드/); byHead('start', /시작|개시/); byHead('end', /종료|까지|끝/);
  const dateCols = []; for (let c = 0; c < nc; c++) if (!used.has(c) && data.filter(r => cellDates(r[c]).length).length >= data.length * 0.6) dateCols.push(c);
  const pct = (c, f) => data.filter(r => f(r[c] || '')).length / data.length;
  const free = () => Array.from({ length: nc }, (_, c) => c).filter(c => !used.has(c) && !dateCols.includes(c));
  if (roles.hours === undefined) { const c = free().find(c => pct(c, v => /\d\s*시간/.test(v)) >= 0.6) ?? free().find(c => pct(c, v => /^\d+(\.\d+)?$/.test(v.trim()) && parseFloat(v) <= 400) >= 0.8); if (c !== undefined) { roles.hours = c; used.add(c); } }
  if (roles.no === undefined) { const c = free().find(c => pct(c, v => /-\d{3,}\s*$/.test(v)) >= 0.6); if (c !== undefined) { roles.no = c; used.add(c); } }
  if (roles.org === undefined) { const c = free().find(c => pct(c, v => /연수원|교육청|연수|대학|공단|협회|원$/.test(v) && v.length < 25) >= 0.5); if (c !== undefined) { roles.org = c; used.add(c); } }
  if (roles.title === undefined) { const c = free().map(c => [c, data.reduce((s, r) => s + (r[c] || '').length, 0)]).sort((a, b) => b[1] - a[1])[0]; if (c && c[1] > 0) { roles.title = c[0]; used.add(c[0]); } }
  if (roles.title === undefined) return [];
  return data.map(r => {
    let ds = []; if (roles.start !== undefined) ds = ds.concat(cellDates(r[roles.start])); if (roles.end !== undefined) ds = ds.concat(cellDates(r[roles.end]));
    if (!ds.length) dateCols.forEach(c => { ds = ds.concat(cellDates(r[c])); });
    const no = roles.no !== undefined ? r[roles.no] || '' : '';
    return { title: r[roles.title] || '', org: roles.org !== undefined ? r[roles.org] || '' : '', hours: roles.hours !== undefined ? parseHoursText(r[roles.hours]) : '', start: ds[0] || '', end: ds[1] && ds[1] !== ds[0] ? ds[1] : '', kind: kindFromText(roles.kind !== undefined ? r[roles.kind] : '') || kindFromText(no), no };
  });
}
async function trainFileRead(file) {
  const rows = await fileToRows(file), items = tableToTrainItems(rows);
  if (!items.length) return toast('표에서 연수 내역을 찾지 못했어요. 연수명·날짜가 있는 표인지 확인해 주세요', 'err');
  ptPreview(items, 'file');
}

/* ═════════ PDF로 연수 불러오기 (PDF 쪽을 그림으로 바꿔 AI가 읽음 · 추가 기능) ═════════ */
const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfjsReady = null;
function loadPdfJs() {
  if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions.workerSrc) return Promise.resolve();
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((resolve, reject) => {
    const s = document.createElement('script'); s.src = PDFJS_URL;
    s.onload = async () => {
      try { const t = await (await fetch(PDFJS_WORKER)).text(); pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' })); resolve(); }
      catch (e) { reject(e); }
    };
    s.onerror = () => reject(new Error('PDF 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인하거나 사진·엑셀로 해 주세요'));
    document.head.appendChild(s);
  }).catch(e => { pdfjsReady = null; throw e; });
  return pdfjsReady;
}
async function pdfToImages(file, maxPages, maxSide) {
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise, n = Math.min(pdf.numPages, maxPages), imgs = [];
  for (let i = 1; i <= n; i++) {
    const page = await pdf.getPage(i), v1 = page.getViewport({ scale: 1 }), k = maxSide / Math.max(v1.width, v1.height), vp = page.getViewport({ scale: k });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: cx, viewport: vp }).promise;
    const d = cv.toDataURL('image/jpeg', 0.72); imgs.push({ mt: 'image/jpeg', data: d.slice(d.indexOf(',') + 1) });
  }
  return { imgs, total: pdf.numPages };
}
function openTrainPdfPick() {
  if (S.mode !== 'gas') return toast('PDF 읽기(AI)는 구글 시트를 연결한 뒤에 쓸 수 있어요', 'err');
  if (!S.ai.hasKey) { toast('설정 › AI에서 키를 먼저 넣어 주세요', 'err'); return; }
  const old = $('#trainPdfFile'); if (old) old.remove();
  const inp = document.createElement('input'); inp.type = 'file'; inp.id = 'trainPdfFile'; inp.accept = 'application/pdf,.pdf'; inp.hidden = true;
  document.body.appendChild(inp); inp.click();
}
async function trainPdfRead(file) {
  const found = []; let total = 0, used = 0;
  try {
    phBusy('PDF를 그림으로 바꾸는 중…');
    const r = await pdfToImages(file, 6, 1400); total = r.total; used = r.imgs.length;
    for (let i = 0; i < r.imgs.length; i++) {
      phBusy(`PDF ${i + 1}/${r.imgs.length}쪽 AI가 읽는 중…`);
      const res = await gasCall('aiVision', { system: PT_SYS, prompt: PT_PROMPT, images: [r.imgs[i]], maxTokens: 4000 }, { timeout: 170000 });
      parsePhotoJson(res.text).forEach(it => found.push(it));
    }
  } finally { phBusyEnd(); }
  ptPreview(found, 'pdf');
  if (total > used) toast(`PDF가 ${total}쪽이라 앞 ${used}쪽만 읽었어요. 나머지는 나눠서 올려 주세요`, 'err');
}
ACT.trainPdf = () => { closeSheet(true); openTrainPdfPick(); };
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'trainPdfFile') { const f = t.files && t.files[0]; t.remove(); if (f) run(null, '', () => trainPdfRead(f)); }
});
