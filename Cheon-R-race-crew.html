<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9B8EC4">
<title>레이스 크루 · Cheon-R</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--main:#9B8EC4;--main-d:#7A6CB0;--bg:#F4F2FA;--card:#fff;--line:#DDD8EE;--tx:#2B2740;--tx2:#6B6785;--warn:#E07A5F;--ok:#5BAE8A;--soft:#ECE8F7}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hdr .s{font-size:12px;color:var(--tx2)}
.hdr .t{font-size:19px;font-weight:700}
.hdr>div:first-child{min-width:0}.hdr .btn{white-space:nowrap;flex:0 0 auto;margin-left:10px;word-break:keep-all}
.card{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px}
.sec b{font-size:15px}.sec span{font-size:12px;color:var(--tx2)}
.mut{color:var(--tx2);font-size:12.5px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--soft);color:#4A3F7A;white-space:nowrap}
.pill.ok{background:#E3F3EA;color:#1F6B4A}.pill.warn{background:#FBE7E1;color:#9A3F27}.pill.out{background:#FBEFD9;color:#7A5410}.pill.gray{background:#EEE;color:#666}
.sc{border-left:4px solid var(--main);padding-left:12px}
.fb{font-size:12.5px;background:var(--bg);border-radius:8px;padding:6px 9px;margin-top:6px}
.fb.good{background:#E8F5EE}.fb.warn{background:#FBEDE8}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:.5px solid var(--line);background:#fff;color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--main);border-color:var(--main);color:#fff}
.btn.dng{color:#B5543B}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:26px;font-weight:700;line-height:1.2}
label.l{display:block;font-size:12.5px;color:var(--tx2);margin:10px 0 4px}
input,select,textarea{width:100%;min-height:44px;border:.5px solid #CFC9E4;border-radius:10px;padding:0 12px;font:inherit;background:#fff;color:var(--tx)}
textarea{padding:10px 12px;min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 13px;border-radius:19px;border:.5px solid #CFC9E4;background:#fff;font:inherit;font-size:13px;cursor:pointer;color:var(--tx)}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
#nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
#nav .in{display:flex;width:100%;max-width:520px}
#nav button{flex:1;min-height:56px;border:0;background:none;font:inherit;font-size:11px;color:#8C88A3;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--main-d);font-weight:600}
.demo{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#FFF1B8;border:1.5px dashed #3A3360;border-radius:10px;padding:6px 10px;margin-bottom:10px;font-size:12.5px;font-weight:600;color:#3A3360}.demo .btn{white-space:nowrap;flex:0 0 auto}
#sheetWrap{position:fixed;inset:0;background:rgba(30,25,50,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
#sheetWrap.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
#sheet h2{font-size:17px;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2B2740;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:80;display:none;max-width:88%;text-align:center}
.tl{position:relative;height:28px;border-radius:6px;overflow:hidden;background:var(--soft)}
.tl i{position:absolute;top:0;bottom:0;font-style:normal;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.tl u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#2B2740;z-index:3}
.fl{position:relative;height:34px}
.fl b{position:absolute;top:0;width:2px;height:8px;background:var(--warn)}
.fl span{position:absolute;top:9px;font-size:10.5px;color:#B5543B;white-space:nowrap}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar div{height:100%;background:var(--main)}
.badge{display:inline-flex;align-items:center;gap:4px;margin:0 6px 6px 0;padding:5px 10px;border-radius:14px;font-size:12px;background:#F3E9C9;color:#6B5310}
.badge.lock{background:#EEE;color:#999}
.foot{text-align:center;font-size:11.5px;color:#9A96AF;margin-top:20px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-family:inherit;font-size:10px;fill:#6B6785}
.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wk .btn{min-height:40px;padding:0 14px}
details summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.pet{display:flex;gap:10px;align-items:center}.petart{flex:0 0 120px}.petin{flex:1;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{padding:8px;text-align:center;margin-bottom:0}.tile svg{display:block;width:100%;height:auto}.tile .tn{font-size:12.5px;font-weight:600;margin-top:4px}.tile .tq{height:56px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#CFC9E4;background:var(--bg);border-radius:10px}
.adm-top{display:flex;align-items:center;gap:10px;background:var(--main);color:#fff;border-radius:14px;padding:10px 14px;min-height:56px}.adm-top b{flex:1;font-size:17px}.adm-role{font-size:12px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:99px}.adm-out{min-height:36px;padding:0 12px;border-radius:10px;border:0;background:rgba(255,255,255,.2);color:#fff;font:inherit;cursor:pointer}.adm-h{font-size:16px;font-weight:700;margin-bottom:2px}.adm-link{border:0;background:none;font:inherit;font-size:12px;color:#9A96AA;min-height:44px;padding:0 14px;cursor:pointer}body.pcview #app{max-width:860px}body.pcview #nav .in{max-width:860px}body.pcview #sheet{max-width:640px}
.gate{position:fixed;inset:0;z-index:9999;background:var(--bg,#F4F2FA);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.gate-in{max-width:340px}.gate h2{margin:8px 0;font-size:19px}.adm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;border:.5px solid var(--line);border-radius:12px;padding:6px 8px;margin-bottom:10px;font-size:12.5px}.adm b{color:var(--main-d);margin-right:2px}.adm-b{min-height:36px;padding:0 12px;border-radius:18px;border:.5px solid #CFC9E4;background:#fff;font:inherit;font-size:13px;color:var(--tx);cursor:pointer}.adm-b.on{background:var(--main);border-color:var(--main);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"><div class="in"></div></nav>

<script>
(function(){
'use strict';
var DEMO=(function(){try{var q=new URLSearchParams(location.search).get('demo');if(q==='0')localStorage.removeItem('running_demo');return localStorage.getItem('running_demo')==='1'}catch(e){return false}})();
var MODE=(function(){if(DEMO)return 'all';try{var q=new URLSearchParams(location.search).get('mode');if(q)localStorage.setItem('running_mode',q==='me'?'all':q);var m=localStorage.getItem('running_mode');return ['lore','skid','hyrox'].indexOf(m)>=0?m:'all'}catch(e){return 'all'}})();
var LORE=MODE!=='all',MODENM={all:'레이스 크루',skid:'스키드레이스',lore:'로어그릿',hyrox:'하이록스'};
if(LORE)document.title=MODENM[MODE]+' · 레이스 크루 · Cheon-R';
var KEY=DEMO?'running_demo_v1':(LORE?'running_'+MODE+'_v1':'running_data_v1');
var DAY=864e5;
var DOW=['일','월','화','수','목','금','토'];
var PLACES=['야외','무동력 트레드밀','일반 트레드밀'];
var TM='무동력 트레드밀';
var TYPE={easy:['이지런','#9B8EC4'],long:['롱런','#7A6CB0'],tempo:['템포','#E0A458'],interval:['인터벌','#E07A5F'],station:['스테이션 반복','#D4537E'],test:['테스트','#5B8DEF'],taper:['조절','#8FBFA8'],free:['자유 기록','#9B8EC4']};
var KIND={restart:['재시동','#D9D3EE','#3A3360'],lower:['로어','#C3BAE2','#3A3360'],base:['베이스','#9B8EC4','#fff'],build:['빌드','#7A6CB0','#fff'],taper:['테이퍼','#D9D3EE','#3A3360']};
var KINDNAME={restart:'재시동',lower:'로어그릿 대비',base:'러닝 베이스',build:'하이록스 빌드',taper:'테이퍼'};
var LM=[0.75,0.9,1,1.12,1.25];
var ZP=[[0.5,0.6],[0.6,0.7],[0.7,0.8],[0.8,0.9],[0.9,1.0]];
var ZC=['#CFD8E8','#7FB69E','#E8C468','#E39A5B','#D9645C'];

function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diffDays(a,b){return Math.round((parse(a)-parse(b))/DAY)}
function todayStr(){return fmt(new Date())}
function mondayOf(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmt(d)}
function md(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmtPace(sec){if(!isFinite(sec)||sec<=0)return '-';var m=Math.floor(sec/60),s=Math.round(sec-m*60);if(s===60){m++;s=0}return m+':'+pad(s)}
function parsePace(t){var m=String(t).trim().match(/^(\d{1,2}):([0-5]\d)$/);return m?Number(m[1])*60+Number(m[2]):NaN}
function num(v){var n=parseFloat(v);return isFinite(n)?n:0}

function loreInfo(){return '<details class="card" style="margin-top:10px"><summary><b>사용 안내</b></summary><div class="mut" style="margin-top:6px;line-height:1.7">· 기록은 이 폰(브라우저)에만 저장돼요. 프로그램 탭 맨 아래 "백업"으로 파일을 저장해 두면 안전해요.<br>· 카카오톡 안에서 열지 말고 사파리·크롬에서 열어 주세요. 홈 화면에 추가하면 앱처럼 쓸 수 있어요.<br>· 가민·스트라바 자동 연동은 없어요. 기록은 직접 입력해 주세요.<br>· 최대심박(프로그램 탭)은 임시값 185예요. 본인 값으로 바꿔 주세요.<br>· 문의: <a href="mailto:fond7509@naver.com?subject=[레이스 크루] 문의">fond7509@naver.com</a></div></details>'}
function seedMode(){
var t=todayStr(),b={v:1,settings:{maxHr:185},overrides:{},logs:[],badges:{},finished:{}};
function blk(id,name,kind,st,en,lv,days){if(en<t)return null;return{id:id,name:name,kind:kind,start:st<t?t:st,end:en,level:lv,days:days}}
if(MODE==='skid'){b.events=[{id:'e1',name:'스키드레이스',short:'스키드',date:'2026-12-12',goal:null}];b.blocks=[blk('b1','스키드레이스 대비','restart','2026-11-26','2026-12-12',2,[2,6])]}
else if(MODE==='hyrox'){b.events=[{id:'e3',name:'하이록스',short:'하이록스',date:'2027-05-16',goal:{base:360,target:330}}];b.blocks=[blk('b3','러닝 베이스','base','2027-01-18','2027-02-15',3,[2,4,6]),blk('b4','하이록스 빌드','build','2027-02-16','2027-05-02',3,[2,4,6]),blk('b5','테이퍼','taper','2027-05-03','2027-05-16',3,[2,6])]}
else{b.events=[{id:'e2',name:'로어그릿',short:'로어',date:'2027-01-17',goal:null}];b.blocks=[blk('b2','로어그릿 대비','lower','2026-12-13','2027-01-17',3,[2,4,6])]}
b.blocks=b.blocks.filter(Boolean);return b}
function demoSeed(){
var t=todayStr(),b={v:1,settings:{maxHr:185},overrides:{},badges:{},finished:{},setupDone:true,f45:{},logs:[]};
b.events=[{id:'e1',name:'스키드레이스(체험)',short:'스키드',date:addDays(t,16),goal:null},{id:'e2',name:'로어그릿(체험)',short:'로어',date:addDays(t,52),goal:null}];
b.blocks=[{id:'b1',name:'체험용 재시동',kind:'restart',start:addDays(t,-20),end:addDays(t,16),level:2,days:[2,6],indoorUntil:addDays(t,-10)},{id:'b2',name:'체험용 로어 대비',kind:'lower',start:addDays(t,17),end:addDays(t,52),level:3,days:[2,4,6]}];
[[-19,32,5.1,148,0],[-16,35,5.6,150,0],[-12,34,5.7,149,0],[-9,38,6.4,147,0],[-5,36,6.2,146,0],[-2,40,6.9,145,0]].forEach(function(r,i){b.logs.push({id:'demo'+i,date:addDays(t,r[0]),sid:'',place:r[0]<-10?'무동력 트레드밀':'야외',min:r[1],km:r[0]<-10?0:r[2],avgHr:r[3],maxHr:r[3]+14,rpe:5,reps:[],note:i===0?'체험용 샘플 기록이에요':''})});
[-18,-15,-11,-8,-4].forEach(function(d,i){b.f45[addDays(t,d)]=i===2?2:1});
return b}
function seed(){if(DEMO)return demoSeed();if(LORE)return seedMode();return{v:1,settings:{maxHr:185},
events:[
{id:'e1',name:'스키드레이스',short:'스키드',date:'2026-12-12',goal:null},
{id:'e2',name:'로어그릿',short:'로어',date:'2027-01-17',goal:null},
{id:'e3',name:'하이록스',short:'하이록스',date:'2027-05-16',goal:{base:360,target:330}}],
blocks:[
{id:'b1',name:'재시동 · 스키드레이스',kind:'restart',start:'2026-11-26',end:'2026-12-12',level:2,days:[2,6],indoorUntil:'2026-12-09'},
{id:'b2',name:'로어그릿 대비',kind:'lower',start:'2026-12-13',end:'2027-01-17',level:3,days:[2,4,6]},
{id:'b3',name:'러닝 베이스',kind:'base',start:'2027-01-18',end:'2027-02-15',level:3,days:[2,4,6]},
{id:'b4',name:'하이록스 빌드',kind:'build',start:'2027-02-16',end:'2027-05-02',level:3,days:[2,4,6]},
{id:'b5',name:'테이퍼',kind:'taper',start:'2027-05-03',end:'2027-05-16',level:3,days:[2,6]}],
overrides:{},logs:[],badges:{}}}

var S=load();
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.v===1&&o.blocks&&o.events)return o}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 공간을 확인해 주세요')}
if(MODE==='all'&&!DEMO){try{localStorage.setItem('running_dirty','1')}catch(e){}cloudSeq=(cloudSeq|0)+1;if(typeof cloudQueue==='function')cloudQueue()}}

var ui={tab:'home',week:mondayOf(todayStr())};
var sessions=[];

function nextEventAfter(d){return S.events.filter(function(e){return e.date>=d}).sort(function(a,b){return a.date<b.date?-1:1})[0]||null}
function makeSession(b,d,wk,total,pos){
var m=LM[b.level-1]*Math.min(1.35,1+0.07*(wk-1));
if(total>=4&&wk===total&&b.kind!=='taper')m*=0.85;
var place=(b.indoorUntil&&d<=b.indoorUntil)?TM:'야외';
var s={id:d+'_s',date:d,blockId:b.id,wk:wk,total:total,type:'easy',title:'',detail:'',min:0,reps:0,repDist:0,place:place};
var ev=nextEventAfter(d),n=ev?diffDays(ev.date,d):99;
if(ev&&n<=4&&n>0){s.type='taper';s.min=15;s.title='대회 전 조절 15분';s.detail=ev.name+' D-'+n+' · 가볍게 몸만 풀어요 (Z1~Z2)';return s}
var k=b.kind,R=Math.round;
function easy(mn){s.type='easy';s.min=Math.min(60,R(mn));s.title='이지런 '+s.min+'분';s.detail='Z2('+zb(2)+'bpm) 유지 · 대화가 되는 강도'}
function tempo(mn){s.type='tempo';s.min=R(mn);s.title='템포 '+s.min+'분';s.detail='워밍업 10분 + Z3~Z4 구간 유지 + 쿨다운'}
function longr(mn){s.type='long';s.min=Math.min(85,R(mn));s.title='롱런 '+s.min+'분';s.detail='Z2 · 속도보다 시간을 채우는 게 목표'}
if(k==='restart'){easy(pos===0?20*m:22*m)}
else if(k==='lower'){
var tw=Math.max(3,total-2);
if(pos===0){
if(wk===tw){s.type='test';s.reps=4;s.repDist=0.75;s.place='야외';s.title='실외 750m 테스트 × 4';s.detail='스테이션 직후라고 생각하고 750m씩. 회차별 페이스 기록 → 기준값'}
else{s.type='station';s.reps=Math.min(10,3+wk+(b.level-3));s.repDist=0.75;s.title='750m × '+s.reps+' (스테이션 사이)';s.detail='750m 러닝 → 스테이션 → 반복. 회차별 페이스 기록'}
}else if(pos===1)easy(25*m);else tempo(28*m)}
else if(k==='base'){if(pos===0)easy(30*m);else if(pos===1)longr(45*m);else tempo(25*m)}
else if(k==='build'){
if(pos===0){s.type='interval';s.reps=Math.min(8,3+Math.ceil(wk/2));s.repDist=1;s.title='1km × '+s.reps+' 인터벌';s.detail='Z4 강도 · 회차 사이 충분히 쉬기. 회차별 페이스 기록'}
else if(pos===1){s.type='station';s.reps=Math.min(8,2+Math.ceil(wk*0.6));s.repDist=1;s.title='스테이션 후 1km × '+s.reps;s.detail='스테이션 → 1km 러닝 반복 (하이록스 방식). 회차별 페이스 기록'}
else if(pos===2)longr(50*m);else easy(30*m)}
else{if(pos===0)easy(25*m);else{s.type='interval';s.reps=3;s.repDist=1;s.title='대회 페이스 1km × 3';s.detail='목표 페이스 감각 확인. 무리하지 않기'}}
return s}
function genSessions(){
var out=[];
S.blocks.forEach(function(b){

function zoneOf(hr){var r=hr/S.settings.maxHr;return r<0.6?1:r<0.7?2:r<0.8?3:r<0.9?4:5}
function logFor(sid){return S.logs.find(function(l){return l.sid===sid})}

function status(s){

if(S.overrides[s.id]&&S.overrides[s.id].skip)return 'skip';
var t=todayStr();if(s.date<t)return 'missed';if(s.date===t)return 'today';return 'up'}
function isTM(l){return l.place===TM}
function pace(l){return (!isTM(l)&&l.km>0&&l.min>0)?l.min*60/l.km:NaN}
function repAvg(l){if(!l.reps||!l.reps.length)return NaN;return l.reps.reduce(function(a,b){return a+b},0)/l.reps.length}

function feedback(l){
var s=sessById(l.sid),t=s?s.type:'free',o=[],easyish=['easy','long','taper','free'].indexOf(t)>=0;
if(isTM(l))o.push(['info','무동력 트레드밀은 같은 페이스보다 훨씬 힘들어서 거리·페이스 대신 시간·심박·RPE로 봤어요.']);
if(s&&s.min&&l.min){var r=l.min/s.min;
if(r>=0.9)o.push(['good','목표 시간 '+s.min+'분을 채웠어요.']);
else if(r>=0.6)o.push(['info','목표 '+s.min+'분 중 '+l.min+'분 했어요. 이 정도도 충분히 의미 있어요.']);
else o.push(['info','짧게 마쳤어요. 컨디션을 메모해 두면 다음 계획에 도움이 돼요.'])}
if(l.avgHr){var z=zoneOf(l.avgHr);
if(easyish){
if(z>=4)o.push(['warn','쉬운 세션인데 평균 심박이 Z'+z+'예요. 페이스를 낮춰 Z2('+zb(2)+'bpm) 근처로 맞춰 보세요.']);
else if(z===3)o.push(['info','평균 심박이 Z3예요. 조금 더 천천히 달리면 Z2('+zb(2)+'bpm)에 들어와요.']);
else o.push(['good','평균 심박 Z'+z+' · 안정적인 강도예요.'])}
else if(t==='tempo'){
if(z===3||z===4)o.push(['good','Z3~Z4 템포 구간을 잘 유지했어요.']);
else if(z<3)o.push(['info','템포치고는 가벼웠어요. 다음엔 조금 더 올려 봐도 좋아요.']);
else o.push(['warn','템포인데 평균 심박이 Z5예요. 너무 세게 달린 것 같아요.'])}}
if(l.rpe&&easyish&&l.rpe>=7)o.push(['warn','쉬운 세션인데 RPE '+l.rpe+'이에요. 컨디션이나 피로 누적을 체크해 보세요.']);
if(!isTM(l)&&l.reps&&l.reps.length>=3){var dr=l.reps[l.reps.length-1]-l.reps[0];
if(dr>10)o.push(['warn','마지막 회차가 첫 회차보다 '+Math.round(dr)+'초 느려요. 초반 페이스를 조금 낮춰 보세요.']);
else if(dr<=5)o.push(['good','회차 간 페이스 차이가 '+Math.max(0,Math.round(dr))+'초 이내예요. 페이스 유지가 좋아요.'])}
return o}
function cheer(l){

var h=0,k=l.id||'x';for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))%997;return P[h%P.length]}

function weekStats(mon){
var end=addDays(mon,6);
var ss=sessions.filter(function(s){return s.date>=mon&&s.date<=end});
var ls=S.logs.filter(function(l){return l.date>=mon&&l.date<=end});
var done=ss.filter(function(s){return logFor(s.id)}).length;
var km=0,min=0;ls.forEach(function(l){min+=l.min||0;if(!isTM(l))km+=l.km||0});
return{planned:ss.length,done:done,min:min,km:km,logs:ls,sessions:ss}}
function weekAch(mon){var w=weekStats(mon);return{planned:w.planned,done:w.done,ok:w.planned>0&&w.done>=Math.max(1,w.planned-1),skip:w.planned===0}}
function streak(){
if(!sessions.length)return{n:0,pass:false};
var cur=mondayOf(todayStr()),first=mondayOf(sessions[0].date),n=0,pass=false;
if(weekAch(cur).ok)n++;
var mon=addDays(cur,-7);
while(mon>=first){var w=weekAch(mon);
if(w.skip){mon=addDays(mon,-7);continue}
if(w.ok)n++;else if(!pass)pass=true;else break;
mon=addDays(mon,-7)}
return{n:n,pass:pass&&n>0}}
function validRuns(){return S.logs.filter(function(l){var s=sessById(l.sid),t=s?s.type:'free';return !isTM(l)&&l.km>0&&l.avgHr>0&&['easy','long','free','taper'].indexOf(t)>=0}).sort(function(a,b){return a.date<b.date?-1:1})}
function change(){
var v=validRuns();if(v.length<4)return null;
var n=v.length<6?2:3,a=v.slice(0,n),b=v.slice(-n);
function avg(arr,f){return arr.reduce(function(x,l){return x+f(l)},0)/arr.length}
return{p0:avg(a,pace),p1:avg(b,pace),h0:avg(a,function(l){return l.avgHr}),h1:avg(b,function(l){return l.avgHr})}}

function lineChart(pts,o){

var W=340,H=150,pl=38,pr=10,pt=10,pb=22,ys=pts.map(function(p){return p.y}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
if(mn===mx){var fl=o.flat||1;mn-=fl;mx+=fl}var pd=(mx-mn)*0.15;mn-=pd;mx+=pd;
function X(i){return pl+(W-pl-pr)*i/(pts.length-1)}

var d='',c='';pts.forEach(function(p,i){d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);c+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3" fill="'+o.color+'"/>'});
var g='';[mn+pd,(mn+mx)/2,mx-pd].forEach(function(v){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#E8E4F4"/><text x="'+(pl-4)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+o.yf(v)+'</text>'});

function barChart(items,o){

function openDemoAsk(){
openSheet('<h2>🎮 체험해 볼까요?</h2><div class="mut" style="line-height:1.7">샘플 기록이 들어 있는 체험용 화면으로 들어가요. 기록 입력·프사오 체크·병아리 성장까지 마음껏 눌러 봐도 돼요.<br><br>✅ 내 진짜 기록은 그대로예요 (체험은 따로 보관돼요).<br>✅ [체험 끝내기]를 누르면 체험 기록이 지워지고 원래 화면으로 돌아와요.</div><div style="display:grid;gap:8px;margin-top:14px"><button class="btn pri" data-act="demogo">체험 시작 🎮</button><button class="btn" data-act="closesheet">취소</button></div>')}
function demoGo(on){
try{if(on)localStorage.setItem('running_demo','1');else{localStorage.removeItem('running_demo');localStorage.removeItem('running_demo_v1')}}catch(e){}
try{history.replaceState(null,'',location.pathname+(on?'':location.search.replace(/[?&]demo=\d/,'')))}catch(e){}
location.reload()}
function refreshOpen(manual){
if(DEMO)return;
if(!gasUrl()){if(manual)toast('먼저 GAS 주소를 입력해 주세요');applyGate();return}
gasCall({action:'open'},function(r){
if(r&&r.ok&&r.open){try{localStorage.setItem('running_open',r.open.join(','))}catch(e){}applyGate();if(isAdmin())render();if(manual)toast('연결됐어요 · 열린 버전: '+(r.open.length?r.open.map(function(m){return MODENM[m]}).join(', '):'없음'))}
else{applyGate();if(manual)toast('GAS에 연결하지 못했어요. 주소와 배포(모든 사용자)를 확인해 주세요')}})}
function gToggle(m){
if(!gasUrl()){toast('먼저 GAS 주소를 입력해 주세요');return}
var cur=openList().slice(),i=cur.indexOf(m);if(i>=0)cur.splice(i,1);else cur.push(m);
var fin=function(r){
if(r&&r.ok){try{localStorage.setItem('running_open',r.open.join(','))}catch(e){}render();toast(MODENM[m]+(r.open.indexOf(m)>=0?'를 열었어요':'를 닫았어요'))}
else if(r&&r.err==='pw')toast('GAS의 관리자 비밀번호와 달라요')
else toast('저장하지 못했어요. 연결을 확인해 주세요')};
gasPost({action:'set',pw:adminPw(),open:cur.join(',')},function(r){if(r&&r.err==='old')gasCall({action:'set',pw:adminPw(),open:cur.join(',')},fin);else fin(r)})}
function vSwitch(){
var h='<div class="card"><div class="adm-h">🚪 열린 버전 스위치</div><div class="mut">친구가 들어올 수 있는 버전을 켜고 꺼요. 닫힌 버전은 "준비 중이에요"가 보여요.</div>';
SHARE.forEach(function(x){var on=openList().indexOf(x[0])>=0;h+='<div class="row" style="margin-top:10px"><div><b>'+x[1]+'</b><div class="mut">'+(on?'친구가 들어올 수 있어요':'"준비 중이에요"가 보여요')+'</div></div><button class="btn sm" data-act="gtoggle" data-v="'+x[0]+'" style="flex:0 0 78px;'+(on?'background:var(--main);border-color:var(--main);color:#fff':'')+'">'+(on?'열림':'닫힘')+'</button></div>'});
h+='<div class="mut" style="margin-top:10px;font-size:12px">스위치를 누르면 시트에 저장돼서 친구 앱에 바로 반영돼요. 관리자(나)는 항상 모든 버전이 열려요.'+(gasUrl()?'':' (위 🔗 연결에 GAS 주소를 먼저 넣어 주세요)')+'</div></div>';
return h}
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target&&(ev.target.id==='a_pw'||ev.target.id==='a_gas')){var b=document.querySelector('[data-act="adminlogin"]');if(b)b.click()}});
applyView();
render();
applyGate();
refreshOpen(false);
if(cloudOn())pullCheck(false);
})();
